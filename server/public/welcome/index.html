<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to JubileeVerse</title>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #1b1b1b;
            --bg-secondary: #242424;
            --text-primary: #ffffff;
            --text-secondary: #c4c4c4;
            --accent-gold: #E6AC00;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
        }

        .welcome-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        .video-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .skip-button {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(230, 172, 0, 0.9);
            color: var(--bg-primary);
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 10;
        }

        .skip-button:hover {
            background: var(--accent-gold);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(230, 172, 0, 0.4);
        }

        .loading-message {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 18px;
            color: var(--text-secondary);
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 20;
            text-align: center;
            background: rgba(27, 27, 27, 0.8);
            padding: 15px 30px;
            border-radius: 8px;
        }

        .loading-message.show {
            opacity: 1;
        }

        .progress-bar {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 20;
        }

        .progress-bar.show {
            opacity: 1;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-gold), #F5C518);
            width: 0%;
            transition: width 0.3s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .video-wrapper {
            animation: fadeIn 0.6s ease-out;
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <div class="video-wrapper">
            <video id="welcomeVideo" autoplay playsinline controls>
                <source src="/welcome.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            <button class="skip-button" id="skipButton">Skip to Chat →</button>
        </div>
        <div class="loading-message" id="loadingMessage">Preparing your experience...</div>
        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <script>
        const video = document.getElementById('welcomeVideo');
        const skipButton = document.getElementById('skipButton');
        const loadingMessage = document.getElementById('loadingMessage');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');

        // Redirect to chat page
        function goToChat() {
            loadingMessage.classList.add('show');
            progressBar.classList.add('show');

            // Animate progress bar
            let progress = 0;
            const interval = setInterval(() => {
                progress += 2;
                progressFill.style.width = progress + '%';

                if (progress >= 100) {
                    clearInterval(interval);
                    window.location.href = '/chat/';
                }
            }, 20);
        }

        // Auto-redirect when video ends
        video.addEventListener('ended', () => {
            goToChat();
        });

        // Skip button functionality
        skipButton.addEventListener('click', () => {
            video.pause();
            goToChat();
        });

        // Handle video errors
        video.addEventListener('error', (e) => {
            console.error('Video error:', e);
            const errorCode = video.error ? video.error.code : 'unknown';
            const errorMessage = video.error ? video.error.message : 'Unknown error';
            console.error('Error code:', errorCode);
            console.error('Error message:', errorMessage);
            loadingMessage.textContent = 'Video unavailable. Redirecting to chat...';
            loadingMessage.classList.add('show');
            setTimeout(goToChat, 2000);
        });

        // Log when video can play
        video.addEventListener('canplay', () => {
            console.log('Video ready to play');
        });

        // Log when video starts playing
        video.addEventListener('play', () => {
            console.log('Video started playing');
        });

        // Log video loading progress
        video.addEventListener('loadedmetadata', () => {
            console.log('Video metadata loaded. Duration:', video.duration);
        });

        // Attempt to play with sound (browser may require user interaction)
        video.addEventListener('loadeddata', () => {
            video.play().catch(error => {
                console.log('Autoplay with sound blocked. User interaction required.');
                // Video controls are visible, user can click play
            });
        });
    </script>
</body>
</html>
