<head>

    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #1b1b1b;
            --bg-secondary: #242424;
            --bg-tertiary: #2d2d2d;
            --bg-card: #2d2d2d;
            --text-primary: #ffffff;
            --text-secondary: #c4c4c4;
            --text-muted: #8a8a8a;
            --accent-gold: #E6AC00;
            --accent-gold-hover: #F5C518;
            --accent-blue: #0078d4;
            --accent-green: #107c10;
            --accent-red: #d13438;
            --border-color: rgba(255, 255, 255, 0.1);
            --header-height: 48px;
            --card-radius: 8px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
        }

        /* Header */
        .header {
            height: var(--header-height);
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 10px;
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--text-primary);
        }
        .logo-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
        }
        .logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #ffffff;
        }
        .logo-text span { color: var(--accent-gold); font-weight: 400; }
        .logo-text .logo-verse { color: var(--accent-gold); }
        .logo-text .logo-dotcom { color: #ffffff; }
        .back-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--accent-gold); }
        .back-link svg { width: 16px; height: 16px; }

        /* Sports page layout */
        .sports-page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 16px;
        }

        /* Loading */
        .sports-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            gap: 16px;
        }
        .sports-loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent-gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* League tabs */
        .league-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            overflow-x: auto;
            scrollbar-width: none;
            padding-bottom: 4px;
        }
        .league-tabs::-webkit-scrollbar { display: none; }
        .league-tab {
            flex-shrink: 0;
            padding: 8px 20px;
            border-radius: 24px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .league-tab:hover {
            border-color: var(--accent-gold);
            color: var(--text-primary);
        }
        .league-tab.active {
            background: var(--accent-gold);
            color: #000;
            border-color: var(--accent-gold);
            font-weight: 600;
        }
        .league-tab-icon { font-size: 16px; }

        /* Section title */
        .section-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-title-icon { font-size: 24px; }
        .section-title-badge {
            font-size: 11px;
            background: var(--accent-gold);
            color: #000;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
        }

        /* Match cards */
        .matches-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 32px;
        }
        .match-card {
            background: var(--bg-card);
            border-radius: var(--card-radius);
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: border-color 0.2s;
        }
        .match-card:hover {
            border-color: rgba(255,255,255,0.2);
        }
        .match-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px 0;
        }
        .match-card-league {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .match-card-status {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 10px;
        }
        .match-card-status.completed {
            color: var(--text-secondary);
            background: rgba(255,255,255,0.05);
        }
        .match-card-status.live {
            color: #fff;
            background: var(--accent-red);
            animation: pulse 2s infinite;
        }
        .match-card-status.upcoming {
            color: var(--accent-gold);
            background: rgba(230,172,0,0.1);
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .match-card-body {
            padding: 12px 16px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .match-team {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .match-team.right {
            flex-direction: row-reverse;
            text-align: right;
        }
        .match-team-flag {
            font-size: 28px;
            line-height: 1;
            width: 36px;
            text-align: center;
        }
        .match-team-info {
            display: flex;
            flex-direction: column;
        }
        .match-team-name {
            font-size: 15px;
            font-weight: 600;
        }
        .match-team-sub {
            font-size: 11px;
            color: var(--text-muted);
        }
        .match-score-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 80px;
        }
        .match-scores {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .match-score {
            font-size: 24px;
            font-weight: 700;
            min-width: 36px;
            text-align: center;
        }
        .match-score-overs {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 400;
        }
        .match-vs {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
        }
        .match-result {
            font-size: 12px;
            color: var(--accent-gold);
            text-align: center;
            padding: 0 16px 10px;
        }
        /* Upcoming match center */
        .match-upcoming-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 100px;
            gap: 2px;
        }
        .match-upcoming-date {
            font-size: 13px;
            font-weight: 600;
            color: var(--accent-gold);
        }
        .match-upcoming-time {
            font-size: 12px;
            color: var(--text-secondary);
        }
        .match-upcoming-venue {
            font-size: 10px;
            color: var(--text-muted);
            text-align: center;
            max-width: 140px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Standings table */
        .standings-card {
            background: var(--bg-card);
            border-radius: var(--card-radius);
            border: 1px solid var(--border-color);
            overflow: hidden;
            margin-bottom: 32px;
        }
        .standings-title {
            padding: 14px 16px;
            font-size: 16px;
            font-weight: 600;
            border-bottom: 1px solid var(--border-color);
        }
        .standings-table {
            width: 100%;
            border-collapse: collapse;
        }
        .standings-table th {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            font-weight: 500;
        }
        .standings-table th:not(:first-child) { text-align: center; }
        .standings-table td {
            padding: 10px 12px;
            font-size: 13px;
            border-bottom: 1px solid var(--border-color);
        }
        .standings-table td:not(:first-child) { text-align: center; color: var(--text-secondary); }
        .standings-table tr:last-child td { border-bottom: none; }
        .standings-table tr:hover { background: rgba(255,255,255,0.03); }
        .standings-team {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .standings-pos {
            font-size: 12px;
            color: var(--text-muted);
            min-width: 20px;
        }
        .standings-flag { font-size: 18px; }
        .standings-name { font-weight: 500; }

        /* Quick links */
        .quick-links {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 32px;
        }
        .quick-link {
            background: var(--bg-card);
            border-radius: var(--card-radius);
            border: 1px solid var(--border-color);
            padding: 16px;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .quick-link:hover {
            border-color: var(--accent-gold);
            background: var(--bg-tertiary);
        }
        .quick-link-icon { font-size: 28px; }
        .quick-link-text { font-size: 14px; font-weight: 500; }
        .quick-link-sub { font-size: 11px; color: var(--text-muted); }

        /* Responsive */
        @media (max-width: 768px) {
            .match-card-body { gap: 8px; }
            .match-team-flag { font-size: 22px; width: 28px; }
            .match-team-name { font-size: 13px; }
            .match-score { font-size: 20px; min-width: 30px; }
            .match-upcoming-center { min-width: 80px; }
            .standings-table th, .standings-table td { padding: 8px 8px; font-size: 12px; }
        }
        @media (max-width: 480px) {
            .sports-page { padding: 16px 10px; }
            .match-team-sub { display: none; }
            .quick-links { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>

                            { pos: 2, name: 'Mumbai City FC', flag: '🔵', w: 9, l: 3, pts: '30' },
                            { pos: 3, name: 'FC Goa', flag: '🟠', w: 8, l: 4, pts: '28' }
                        ],
                        standingsColumns: ['Team', 'W', 'L', 'PTS']
                    }
                }
            },
            GB: {
                league: 'Premier League',
                icon: '⚽',
                tabs: [
                    { id: 'epl', label: 'Premier League', icon: '⚽' },
                    { id: 'ucl', label: 'Champions League', icon: '🏆' }
                ],
                leagues: {
                    epl: {
                        name: 'English Premier League',
                        icon: '⚽',
                        matches: [
                            { type: 'result', team1: { name: 'Arsenal', short: 'ARS', flag: '🔴', score: '3' }, team2: { name: 'Chelsea', short: 'CHE', flag: '🔵', score: '1' }, status: 'Final', result: 'Arsenal won', league: 'Matchweek 24' },
                            { type: 'result', team1: { name: 'Liverpool', short: 'LIV', flag: '🔴', score: '2' }, team2: { name: 'Man City', short: 'MCI', flag: '🔵', score: '2' }, status: 'Final', result: 'Draw', league: 'Matchweek 24' },
                            { type: 'upcoming', team1: { name: 'Man United', short: 'MUN', flag: '🔴' }, team2: { name: 'Tottenham', short: 'TOT', flag: '⚪' }, date: 'Feb 2', time: '4:30 PM', venue: 'Old Trafford, Manchester', league: 'Matchweek 25' }
                        ],
                        standings: [
                            { pos: 1, name: 'Liverpool', flag: '🔴', w: 17, l: 2, pts: '53' },
                            { pos: 2, name: 'Arsenal', flag: '🔴', w: 14, l: 3, pts: '47' },
                            { pos: 3, name: 'Man City', flag: '🔵', w: 13, l: 5, pts: '43' },
                            { pos: 4, name: 'Aston Villa', flag: '🟣', w: 12, l: 5, pts: '40' }
                        ],
                        standingsColumns: ['Team', 'W', 'L', 'PTS']
                    },
                    ucl: {
                        name: 'UEFA Champions League',
                        icon: '🏆',
                        matches: [
                            { type: 'upcoming', team1: { name: 'Real Madrid', short: 'RMA', flag: '⚪' }, team2: { name: 'Bayern Munich', short: 'BAY', flag: '🔴' }, date: 'Feb 11', time: '9:00 PM', venue: 'Santiago Bernabeu, Madrid', league: 'Round of 16' },
                            { type: 'upcoming', team1: { name: 'PSG', short: 'PSG', flag: '🔵' }, team2: { name: 'Barcelona', short: 'BAR', flag: '🔵' }, date: 'Feb 12', time: '9:00 PM', venue: 'Parc des Princes, Paris', league: 'Round of 16' }
                        ],
                        standings: [],
                        standingsColumns: ['Team', 'W', 'L', 'PTS']
                    }
                }
            }
        };
        sportsDataSets.DEFAULT = sportsDataSets.US;

        let currentCountry = 'US';
        let currentLeagueId = '';

        async function getCountry() {
            try {
                const res = await fetch('https://ipapi.co/json/', { signal: AbortSignal.timeout(5000) });
                if (res.ok) { const g = await res.json(); return g.country_code || 'US'; }
            } catch (e) {}
            try {
                const res = await fetch('https://ip-api.com/json/?fields=countryCode', { signal: AbortSignal.timeout(5000) });
                if (res.ok) { const g = await res.json(); return g.countryCode || 'US'; }
            } catch (e) {}
            return 'US';
        }

        function renderMatchCard(match) {
            const isResult = match.type === 'result';
            const isUpcoming = match.type === 'upcoming';
            const statusClass = match.status === 'Final' || match.status === 'Completed' ? 'completed' : (isUpcoming ? 'upcoming' : 'live');
            const statusText = isUpcoming ? 'Upcoming' : match.status;

            let bodyHTML = '';
            if (isUpcoming) {
                bodyHTML = `
                    <div class="match-card-body">
                        <div class="match-team">
                            <span class="match-team-flag">${match.team1.flag}</span>
                            <div class="match-team-info">
                                <span class="match-team-name">${match.team1.name}</span>
                            </div>
                        </div>
                        <div class="match-upcoming-center">
                            <div class="match-upcoming-date">${match.date}</div>
                            <div class="match-upcoming-time">${match.time}</div>
                            <div class="match-upcoming-venue">${match.venue}</div>
                        </div>
                        <div class="match-team right">
                            <span class="match-team-flag">${match.team2.flag}</span>
                            <div class="match-team-info">
                                <span class="match-team-name">${match.team2.name}</span>
                            </div>
                        </div>
                    </div>`;
            } else {
                bodyHTML = `
                    <div class="match-card-body">
                        <div class="match-team">
                            <span class="match-team-flag">${match.team1.flag}</span>
                            <div class="match-team-info">
                                <span class="match-team-name">${match.team1.name}</span>
                                ${match.team1.sub ? '<span class="match-team-sub">' + match.team1.sub + '</span>' : ''}
                            </div>
                        </div>
                        <div class="match-score-area">
                            <div class="match-scores">
                                <span class="match-score">${match.team1.score}</span>
                                <span class="match-vs">vs</span>
                                <span class="match-score">${match.team2.score}</span>
                            </div>
                        </div>
                        <div class="match-team right">
                            <span class="match-team-flag">${match.team2.flag}</span>
                            <div class="match-team-info">
                                <span class="match-team-name">${match.team2.name}</span>
                                ${match.team2.sub ? '<span class="match-team-sub">' + match.team2.sub + '</span>' : ''}
                            </div>
                        </div>
                    </div>
                    ${match.result ? '<div class="match-result">' + match.result + '</div>' : ''}`;
            }

            return `
                <div class="match-card">
                    <div class="match-card-header">
                        <span class="match-card-league">${match.league || ''}</span>
                        <span class="match-card-status ${statusClass}">${statusText}</span>
                    </div>
                    ${bodyHTML}
                </div>`;
        }

        function renderPage() {
            const page = document.getElementById('sportsPage');
            const data = sportsDataSets[currentCountry] || sportsDataSets.DEFAULT;
            const tabs = data.tabs;
            if (!currentLeagueId) currentLeagueId = tabs[0].id;
            const league = data.leagues[currentLeagueId];

            // Tabs
            const tabsHTML = tabs.map(t =>
                `<button class="league-tab${t.id === currentLeagueId ? ' active' : ''}" onclick="switchLeague('${t.id}')">
                    <span class="league-tab-icon">${t.icon}</span> ${t.label}
                </button>`
            ).join('');

            // Separate matches
            const results = league.matches.filter(m => m.type === 'result');
            const upcoming = league.matches.filter(m => m.type === 'upcoming');

            // Results
            let resultsHTML = '';
            if (results.length) {
                resultsHTML = `
                    <div class="section-title">
                        <span class="section-title-icon">${league.icon}</span>
                        Recent Results
                        <span class="section-title-badge">${results.length}</span>
                    </div>
                    <div class="matches-grid">${results.map(m => renderMatchCard(m)).join('')}</div>`;
            }

            // Upcoming
            let upcomingHTML = '';
            if (upcoming.length) {
                upcomingHTML = `
                    <div class="section-title">
                        <span class="section-title-icon">📅</span>
                        Upcoming Matches
                        <span class="section-title-badge">${upcoming.length}</span>
                    </div>
                    <div class="matches-grid">${upcoming.map(m => renderMatchCard(m)).join('')}</div>`;
            }

            // Standings
            let standingsHTML = '';
            if (league.standings && league.standings.length) {
                const cols = league.standingsColumns;
                const thHTML = cols.map(c => `<th>${c}</th>`).join('');
                const rowsHTML = league.standings.map(row => {
                    const values = [row.w, row.l, row.pts || row.pct];
                    return `<tr>
                        <td><div class="standings-team">
                            <span class="standings-pos">${row.pos}</span>
                            <span class="standings-flag">${row.flag}</span>
                            <span class="standings-name">${row.name}</span>
                        </div></td>
                        ${values.map(v => `<td>${v}</td>`).join('')}
                    </tr>`;
                }).join('');
                standingsHTML = `
                    <div class="standings-card">
                        <div class="standings-title">Standings</div>
                        <table class="standings-table">
                            <thead><tr>${thHTML}</tr></thead>
                            <tbody>${rowsHTML}</tbody>
                        </table>
                    </div>`;
            }

            // Quick links
            const quickLinksHTML = `
                <div class="section-title"><span class="section-title-icon">🔗</span> Quick Links</div>
                <div class="quick-links">
                    ${tabs.map(t => `
                        <a href="#" class="quick-link" onclick="event.preventDefault(); switchLeague('${t.id}'); window.scrollTo({top:0,behavior:'smooth'});">
                            <span class="quick-link-icon">${t.icon}</span>
                            <div>
                                <div class="quick-link-text">${t.label}</div>
                                <div class="quick-link-sub">${(data.leagues[t.id].matches || []).length} matches</div>
                            </div>
                        </a>`).join('')}
                    <a href="/" class="quick-link">
                        <span class="quick-link-icon">🏠</span>
                        <div>
                            <div class="quick-link-text">Back to Home</div>
                            <div class="quick-link-sub">JubileeVerse.com</div>
                        </div>
                    </a>
                </div>`;

            page.innerHTML = `
                <div class="league-tabs">${tabsHTML}</div>
                ${resultsHTML}
                ${upcomingHTML}
                ${standingsHTML}
                ${quickLinksHTML}
            `;
        }

        function switchLeague(id) {
            currentLeagueId = id;
            renderPage();
        }

        async function init() {
            currentCountry = await getCountry();
            if (!sportsDataSets[currentCountry]) currentCountry = 'US';

            // Try to fetch live data for football/soccer
            try {
                const sportsRes = await fetch('/api/sports');
                if (sportsRes.ok) {
                    const liveData = await sportsRes.json();
                    if (liveData.success && liveData.data) {
                        const regionData = liveData.data[currentCountry] || liveData.data.DEFAULT;
                        if (regionData && regionData.matches && regionData.matches.length > 0) {
                            // Add a "Live" tab with the real-time data
                            const liveLeague = {
                                name: regionData.league + ' (Live)',
                                icon: regionData.icon || '⚽',
                                matches: regionData.matches,
                                standings: [],
                                standingsColumns: ['Team', 'W', 'L', 'PTS']
                            };
                            // Insert live data as first tab option
                            if (!sportsDataSets[currentCountry].leagues.live) {
                                sportsDataSets[currentCountry].tabs.unshift({ id: 'live', label: 'Live ⚽', icon: '🔴' });
                                sportsDataSets[currentCountry].leagues.live = liveLeague;
                            }
                            console.log('[Sports Page] Loaded live data, last updated:', regionData.lastUpdated);
                        }
                    }
                }
            } catch (err) {
                console.log('[Sports Page] Live data unavailable, using static data');
            }

            const data = sportsDataSets[currentCountry];
            currentLeagueId = data.tabs[0].id;
            renderPage();
        }

        init();
    </script>
    <script src="/js/site-translate.js"></script>
</body>
</html>
