<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="JubileeVerse Weather - Your local weather forecast">
    <title>Weather - JubileeVerse</title>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #1b1b1b;
            --bg-secondary: #242424;
            --bg-tertiary: #2d2d2d;
            --bg-card: #2d2d2d;
            --text-primary: #ffffff;
            --text-secondary: #c4c4c4;
            --text-muted: #8a8a8a;
            --accent-gold: #E6AC00;
            --accent-gold-hover: #F5C518;
            --accent-blue: #0078d4;
            --border-color: rgba(255, 255, 255, 0.1);
            --header-height: 48px;
            --card-radius: 8px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
        }

        /* Header */
        .header {
            height: var(--header-height);
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .header-inner {
            max-width: 1548px;
            margin: 0 auto;
            padding: 0 10px;
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--text-primary);
        }
        .logo-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
        }
        .logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #ffffff;
        }
        .logo-text span {
            color: var(--accent-gold);
            font-weight: 400;
        }
        .logo-text .logo-verse { color: var(--accent-gold); }
        .logo-text .logo-dotcom { color: #ffffff; }
        .back-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--accent-gold); }
        .back-link svg { width: 16px; height: 16px; }

        /* Main layout */
        .weather-page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 16px;
        }

        /* Loading state */
        .weather-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            gap: 16px;
        }
        .weather-loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent-gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Current weather hero */
        .current-hero {
            background: linear-gradient(135deg, #1a73e8 0%, #4fc3f7 100%);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
        }
        .current-hero::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 300px;
            height: 300px;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
        }
        .current-hero-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
        }
        .current-city {
            font-size: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .current-city svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
        .current-date {
            font-size: 13px;
            opacity: 0.8;
        }
        .unit-toggle {
            display: flex;
            background: rgba(255,255,255,0.15);
            border-radius: 20px;
            overflow: hidden;
        }
        .unit-toggle button {
            background: none;
            border: none;
            color: rgba(255,255,255,0.6);
            padding: 4px 14px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .unit-toggle button.active {
            background: rgba(255,255,255,0.25);
            color: #fff;
            font-weight: 600;
        }
        .current-main {
            display: flex;
            align-items: center;
            gap: 24px;
            margin: 16px 0;
            position: relative;
            z-index: 1;
        }
        .current-icon {
            font-size: 72px;
            line-height: 1;
        }
        .current-temp {
            font-size: 64px;
            font-weight: 300;
            line-height: 1;
        }
        .current-temp sup {
            font-size: 28px;
            font-weight: 400;
            vertical-align: super;
        }
        .current-info {
            position: relative;
            z-index: 1;
        }
        .current-desc {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 4px;
        }
        .current-hl {
            font-size: 14px;
            opacity: 0.85;
        }

        /* Details grid */
        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }
        .detail-card {
            background: var(--bg-card);
            border-radius: var(--card-radius);
            padding: 16px;
            border: 1px solid var(--border-color);
        }
        .detail-card-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .detail-card-value {
            font-size: 24px;
            font-weight: 600;
        }
        .detail-card-extra {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Hourly forecast */
        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }
        .hourly-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 12px;
            margin-bottom: 24px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.2) transparent;
        }
        .hourly-scroll::-webkit-scrollbar { height: 4px; }
        .hourly-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }
        .hourly-item {
            flex: 0 0 72px;
            text-align: center;
            background: var(--bg-card);
            border-radius: var(--card-radius);
            padding: 12px 8px;
            border: 1px solid var(--border-color);
        }
        .hourly-item.now {
            border-color: var(--accent-gold);
            background: rgba(230, 172, 0, 0.1);
        }
        .hourly-time {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .hourly-icon {
            font-size: 22px;
            margin-bottom: 6px;
        }
        .hourly-temp {
            font-size: 14px;
            font-weight: 600;
        }

        /* 7-day forecast */
        .daily-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 24px;
        }
        .daily-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: var(--bg-card);
            border-radius: var(--card-radius);
            border: 1px solid var(--border-color);
        }
        .daily-day {
            width: 80px;
            font-size: 14px;
            font-weight: 500;
        }
        .daily-icon {
            width: 40px;
            font-size: 22px;
            text-align: center;
        }
        .daily-desc {
            flex: 1;
            font-size: 13px;
            color: var(--text-secondary);
            padding: 0 12px;
        }
        .daily-temps {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 14px;
        }
        .daily-bar {
            width: 80px;
            height: 4px;
            border-radius: 2px;
            background: linear-gradient(to right, #4fc3f7, #ff7043);
            position: relative;
            margin: 0 8px;
        }
        .daily-high {
            font-weight: 600;
        }
        .daily-low {
            color: var(--text-muted);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .current-hero { padding: 20px; }
            .current-icon { font-size: 52px; }
            .current-temp { font-size: 48px; }
            .current-temp sup { font-size: 22px; }
            .details-grid { grid-template-columns: repeat(2, 1fr); }
            .daily-desc { display: none; }
            .daily-bar { width: 50px; }
        }
        @media (max-width: 480px) {
            .weather-page { padding: 16px 10px; }
            .current-main { gap: 16px; }
            .current-icon { font-size: 42px; }
            .current-temp { font-size: 40px; }
            .details-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .detail-card { padding: 12px; }
            .detail-card-value { font-size: 20px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a href="/" class="logo">
                <img src="/images/JubileeLogo.png" alt="Jubilee" class="logo-icon">
                <div class="logo-text">Jubilee<span class="logo-verse">Verse</span><span class="logo-dotcom">.com</span></div>
            </a>
            <a href="/" class="back-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
                Back to Home
            </a>
        </div>
    </header>

    <div class="weather-page" id="weatherPage">
        <div class="weather-loading" id="weatherLoading">
            <div class="weather-loading-spinner"></div>
            <div style="color:var(--text-secondary);font-size:14px;">Loading weather data...</div>
        </div>
    </div>

    <script>
        const weatherIcons = {
            0: '☀️', 1: '🌤️', 2: '⛅', 3: '☁️',
            45: '🌫️', 48: '🌫️',
            51: '🌦️', 53: '🌧️', 55: '🌧️',
            56: '🌨️', 57: '🌨️',
            61: '🌦️', 63: '🌧️', 65: '🌧️',
            66: '🌨️', 67: '🌨️',
            71: '🌨️', 73: '❄️', 75: '❄️',
            77: '🌨️',
            80: '🌦️', 81: '🌧️', 82: '⛈️',
            85: '🌨️', 86: '❄️',
            95: '⛈️', 96: '⛈️', 99: '⛈️'
        };

        const weatherDescriptions = {
            0: 'Clear sky', 1: 'Mainly clear', 2: 'Partly cloudy', 3: 'Overcast',
            45: 'Foggy', 48: 'Rime fog',
            51: 'Light drizzle', 53: 'Drizzle', 55: 'Dense drizzle',
            56: 'Freezing drizzle', 57: 'Heavy freezing drizzle',
            61: 'Light rain', 63: 'Moderate rain', 65: 'Heavy rain',
            66: 'Freezing rain', 67: 'Heavy freezing rain',
            71: 'Light snow', 73: 'Moderate snow', 75: 'Heavy snow',
            77: 'Snow grains',
            80: 'Light showers', 81: 'Mod. showers', 82: 'Heavy showers',
            85: 'Light snow showers', 86: 'Heavy snow showers',
            95: 'Thunderstorm', 96: 'Thunderstorm w/ hail', 99: 'Severe thunderstorm'
        };

        let useCelsius = true;

        function toF(c) { return Math.round(c * 9 / 5 + 32); }
        function displayTemp(c) { return useCelsius ? Math.round(c) : toF(c); }
        function unitLabel() { return useCelsius ? '°C' : '°F'; }

        async function getGeoLocation() {
            try {
                const res = await fetch('https://ipapi.co/json/', { signal: AbortSignal.timeout(5000) });
                if (res.ok) {
                    const geo = await res.json();
                    if (geo.latitude && geo.longitude) return { lat: geo.latitude, lon: geo.longitude, city: geo.city || 'Unknown', region: geo.region || '', country: geo.country_name || '' };
                }
            } catch (e) {}
            try {
                const res = await fetch('https://ip-api.com/json/?fields=city,regionName,country,lat,lon', { signal: AbortSignal.timeout(5000) });
                if (res.ok) {
                    const geo = await res.json();
                    if (geo.lat && geo.lon) return { lat: geo.lat, lon: geo.lon, city: geo.city || 'Unknown', region: geo.regionName || '', country: geo.country || '' };
                }
            } catch (e) {}
            try {
                const pos = await new Promise((resolve, reject) => {
                    navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 8000 });
                });
                return { lat: pos.coords.latitude, lon: pos.coords.longitude, city: 'Your Location', region: '', country: '' };
            } catch (e) {}
            return { lat: 40.7128, lon: -74.0060, city: 'New York', region: 'NY', country: 'United States' };
        }

        let weatherData = null;
        let geoData = null;

        async function loadWeatherPage() {
            const page = document.getElementById('weatherPage');
            try {
                geoData = await getGeoLocation();

                const weatherRes = await fetch(
                    `https://api.open-meteo.com/v1/forecast?latitude=${geoData.lat}&longitude=${geoData.lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,surface_pressure,uv_index&hourly=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,weather_code,sunrise,sunset,uv_index_max,precipitation_probability_max&timezone=auto&forecast_days=7`
                );
                weatherData = await weatherRes.json();
                renderWeather();
            } catch (err) {
                console.error('Weather page error:', err);
                page.innerHTML = `
                    <div class="weather-loading">
                        <div style="font-size:48px;">⚠️</div>
                        <div style="color:var(--text-secondary);font-size:16px;">Unable to load weather data</div>
                        <button onclick="loadWeatherPage()" style="margin-top:8px;background:var(--accent-gold);color:#000;border:none;padding:10px 24px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600;">Try Again</button>
                    </div>`;
            }
        }

        function renderWeather() {
            const page = document.getElementById('weatherPage');
            const current = weatherData.current;
            const hourly = weatherData.hourly;
            const daily = weatherData.daily;

            const code = current.weather_code;
            const icon = weatherIcons[code] || '🌡️';
            const desc = weatherDescriptions[code] || 'Unknown';
            const temp = current.temperature_2m;
            const feelsLike = current.apparent_temperature;
            const humidity = current.relative_humidity_2m;
            const windSpeed = Math.round(current.wind_speed_10m);
            const windDir = current.wind_direction_10m;
            const pressure = Math.round(current.surface_pressure);
            const uvIndex = current.uv_index || 0;
            const high = daily.temperature_2m_max[0];
            const low = daily.temperature_2m_min[0];

            const now = new Date();
            const dateStr = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
            const locationStr = [geoData.city, geoData.region].filter(Boolean).join(', ');

            // Wind direction text
            const windDirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
            const windDirText = windDirs[Math.round(windDir / 45) % 8];

            // UV level text
            let uvLevel = 'Low';
            if (uvIndex >= 8) uvLevel = 'Very High';
            else if (uvIndex >= 6) uvLevel = 'High';
            else if (uvIndex >= 3) uvLevel = 'Moderate';

            // Sunrise / Sunset
            const sunrise = daily.sunrise ? new Date(daily.sunrise[0]).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) : '--';
            const sunset = daily.sunset ? new Date(daily.sunset[0]).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) : '--';

            // Hourly forecast (next 24 hours)
            const currentHour = now.getHours();
            let hourlyHTML = '';
            let hourStart = 0;
            for (let i = 0; i < hourly.time.length; i++) {
                const hDate = new Date(hourly.time[i]);
                if (hDate >= now) { hourStart = i; break; }
            }
            for (let i = hourStart; i < Math.min(hourStart + 24, hourly.time.length); i++) {
                const hDate = new Date(hourly.time[i]);
                const hTime = i === hourStart ? 'Now' : hDate.toLocaleTimeString('en-US', { hour: 'numeric' });
                const hIcon = weatherIcons[hourly.weather_code[i]] || '🌡️';
                const hTemp = displayTemp(hourly.temperature_2m[i]);
                const isNow = i === hourStart;
                hourlyHTML += `<div class="hourly-item${isNow ? ' now' : ''}">
                    <div class="hourly-time">${hTime}</div>
                    <div class="hourly-icon">${hIcon}</div>
                    <div class="hourly-temp">${hTemp}°</div>
                </div>`;
            }

            // Daily forecast
            const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const dayNamesShort = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            let dailyHTML = '';
            for (let i = 0; i < daily.time.length; i++) {
                const d = new Date(daily.time[i]);
                const dayLabel = i === 0 ? 'Today' : (i === 1 ? 'Tomorrow' : dayNamesShort[d.getDay()]);
                const dIcon = weatherIcons[daily.weather_code[i]] || '🌡️';
                const dDesc = weatherDescriptions[daily.weather_code[i]] || '';
                const dHigh = displayTemp(daily.temperature_2m_max[i]);
                const dLow = displayTemp(daily.temperature_2m_min[i]);
                const precip = daily.precipitation_probability_max ? (daily.precipitation_probability_max[i] || 0) : 0;
                const precipStr = precip > 0 ? ` &middot; ${precip}% rain` : '';
                dailyHTML += `<div class="daily-item">
                    <div class="daily-day">${dayLabel}</div>
                    <div class="daily-icon">${dIcon}</div>
                    <div class="daily-desc">${dDesc}${precipStr}</div>
                    <div class="daily-temps">
                        <span class="daily-low">${dLow}°</span>
                        <div class="daily-bar"></div>
                        <span class="daily-high">${dHigh}°</span>
                    </div>
                </div>`;
            }

            page.innerHTML = `
                <div class="current-hero">
                    <div class="current-hero-top">
                        <div>
                            <div class="current-city">
                                <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                                ${locationStr}
                            </div>
                            <div class="current-date">${dateStr}</div>
                        </div>
                        <div class="unit-toggle">
                            <button class="${useCelsius ? 'active' : ''}" onclick="switchUnit(true)">°C</button>
                            <button class="${!useCelsius ? 'active' : ''}" onclick="switchUnit(false)">°F</button>
                        </div>
                    </div>
                    <div class="current-main">
                        <div class="current-icon">${icon}</div>
                        <div class="current-temp">${displayTemp(temp)}<sup>${unitLabel()}</sup></div>
                    </div>
                    <div class="current-info">
                        <div class="current-desc">${desc}</div>
                        <div class="current-hl">Feels like ${displayTemp(feelsLike)}° &middot; H:${displayTemp(high)}° L:${displayTemp(low)}°</div>
                    </div>
                </div>

                <div class="details-grid">
                    <div class="detail-card">
                        <div class="detail-card-label">Feels Like</div>
                        <div class="detail-card-value">${displayTemp(feelsLike)}${unitLabel()}</div>
                    </div>
                    <div class="detail-card">
                        <div class="detail-card-label">Humidity</div>
                        <div class="detail-card-value">${humidity}%</div>
                    </div>
                    <div class="detail-card">
                        <div class="detail-card-label">Wind</div>
                        <div class="detail-card-value">${windSpeed} km/h</div>
                        <div class="detail-card-extra">${windDirText} direction</div>
                    </div>
                    <div class="detail-card">
                        <div class="detail-card-label">Pressure</div>
                        <div class="detail-card-value">${pressure} hPa</div>
                    </div>
                    <div class="detail-card">
                        <div class="detail-card-label">UV Index</div>
                        <div class="detail-card-value">${Math.round(uvIndex)}</div>
                        <div class="detail-card-extra">${uvLevel}</div>
                    </div>
                    <div class="detail-card">
                        <div class="detail-card-label">Sunrise / Sunset</div>
                        <div class="detail-card-value" style="font-size:16px;">🌅 ${sunrise}</div>
                        <div class="detail-card-extra">🌇 ${sunset}</div>
                    </div>
                </div>

                <div class="section-title">Hourly Forecast</div>
                <div class="hourly-scroll">${hourlyHTML}</div>

                <div class="section-title">7-Day Forecast</div>
                <div class="daily-list">${dailyHTML}</div>
            `;
        }

        function switchUnit(celsius) {
            useCelsius = celsius;
            if (weatherData) renderWeather();
        }

        loadWeatherPage();
    </script>
    <script src="/js/site-translate.js"></script>
</body>
</html>
