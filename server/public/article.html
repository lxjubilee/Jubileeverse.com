<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="JubileeVerse - Uplifting Christian news article">
    <title>Article - JubileeVerse</title>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;500;600;700&family=Playfair+Display:wght@400;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <!-- Markdown parser for Claude-generated full_article content -->
    <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
    <style>
        /* ============================================
           JUBILEE GOOD NEWS - MSN-STYLE ARTICLE PAGE
           ============================================ */

        :root {
            /* MSN Dark Theme Colors */
            --bg-primary: #1b1b1b;
            --bg-secondary: #242424;
            --bg-tertiary: #2d2d2d;
            --bg-card: #2d2d2d;
            --bg-card-hover: #3a3a3a;

            /* Text Colors */
            --text-primary: #ffffff;
            --text-secondary: #c4c4c4;
            --text-muted: #8a8a8a;
            --text-body: #e0e0e0;

            /* Accent Colors */
            --accent-gold: #E6AC00;
            --accent-gold-hover: #F5C518;
            --accent-blue: #0078d4;
            --accent-red: #d13438;
            --accent-green: #107c10;

            /* Borders */
            --border-color: rgba(255, 255, 255, 0.1);
            --border-hover: rgba(255, 255, 255, 0.2);

            /* Spacing */
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 12px;
            --space-lg: 16px;
            --space-xl: 24px;
            --space-2xl: 32px;
            --space-3xl: 48px;

            /* Font Sizes */
            --font-xs: 11px;
            --font-sm: 12px;
            --font-base: 14px;
            --font-md: 16px;
            --font-lg: 18px;
            --font-xl: 22px;
            --font-2xl: 28px;
            --font-3xl: 36px;
            --font-4xl: 42px;

            /* Article Typography */
            --article-line-height: 1.75;
            --article-max-width: 720px;

            /* Layout */
            --max-width: 1548px;
            --header-height: 48px;
            --card-radius: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #articleContent {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        a {
            color: inherit;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        a:hover {
            color: var(--accent-gold);
        }

        /* ============================================
           HEADER - STICKY NAVIGATION
           ============================================ */

        .header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }

        .header-inner {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 var(--space-lg);
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: var(--space-md);
        }

        .back-btn-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 6px;
            color: #ffffff;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        .back-btn-overlay:hover {
            background: rgba(0, 0, 0, 0.65);
            border-color: rgba(255, 255, 255, 0.45);
        }

        .back-btn-overlay svg {
            width: 16px;
            height: 16px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }

        .logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .logo-text span {
            color: var(--accent-gold);
        }
        .logo-text .logo-verse { color: var(--accent-gold); }
        .logo-text .logo-dotcom { color: #ffffff; }

        .header-actions {
            display: flex;
            align-items: center;
            gap: var(--space-md);
        }

        .header-media-links {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: var(--font-sm);
        }

        .header-media-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .header-media-links a:hover {
            color: var(--text-primary);
        }

        .header-media-links .divider {
            color: var(--text-muted);
        }

        .btn-sign-in {
            background: transparent;
            color: var(--text-secondary);
            padding: var(--space-sm) var(--space-md);
            border-radius: 4px;
            font-size: var(--font-sm);
            font-weight: 500;
            transition: all 0.2s ease;
            border: 1px solid var(--border-color);
            text-decoration: none;
        }

        .btn-sign-in:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .profile-btn-container {
            position: relative;
            display: inline-flex;
        }

        .profile-btn {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 50%;
            border: none;
            background-color: #ffbd59;
            color: #000;
            font-weight: bold;
            font-size: 13px;
            transition: all 0.15s ease;
        }

        .profile-btn:hover {
            background-color: #ffd280;
            transform: scale(1.05);
        }

        .profile-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 8px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            min-width: 200px;
            display: none;
            flex-direction: column;
            z-index: 1000;
            overflow: hidden;
        }

        .profile-dropdown.open {
            display: flex;
        }

        .profile-dropdown-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: var(--font-sm);
            transition: background 0.15s;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
        }

        .profile-dropdown-item:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }

        .profile-dropdown-item svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .profile-dropdown-divider {
            height: 1px;
            background: var(--border-color);
            margin: 4px 0;
        }

        .share-btn {
            display: flex;
            align-items: center;
            gap: var(--space-xs);
            padding: var(--space-sm) var(--space-md);
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-secondary);
            font-size: var(--font-sm);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .share-btn:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .share-btn svg {
            width: 16px;
            height: 16px;
        }

        /* ============================================
           ARTICLE HERO SECTION
           ============================================ */

        .article-hero {
            position: relative;
            width: 100%;
            max-height: 750px;
            overflow: hidden;
            background: var(--bg-tertiary);
        }

        .article-hero-image {
            width: 100%;
            height: 750px;
            object-fit: cover;
            display: block;
        }

        /* Reviewer inline editing — title */
        .reviewer-title-edit-wrap {
            position: relative;
            width: 100%;
        }
        .reviewer-title-input {
            width: 100%;
            background: rgba(0,0,0,0.6);
            border: 2px solid var(--accent-gold);
            border-radius: 4px;
            color: #fff;
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(22px, 4vw, 36px);
            font-weight: 700;
            line-height: 1.2;
            padding: 8px 12px;
            resize: none;
            outline: none;
            box-sizing: border-box;
        }
        .reviewer-edit-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .reviewer-save-btn {
            background: #2e7d32;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 6px 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .reviewer-save-btn:hover { background: #1b5e20; }
        .reviewer-cancel-btn {
            background: rgba(255,255,255,0.15);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 4px;
            padding: 6px 14px;
            font-size: 13px;
            cursor: pointer;
        }
        .reviewer-cancel-btn:hover { background: rgba(255,255,255,0.25); }

        /* Reviewer inline editing — body */
        .reviewer-body-edit-wrap {
            position: relative;
            width: 100%;
        }
        .reviewer-body-textarea {
            width: 100%;
            min-height: 480px;
            background: #1a1a1a;
            border: 2px solid var(--accent-gold);
            border-radius: 6px;
            color: #e8e8e8;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            padding: 16px;
            resize: vertical;
            outline: none;
            box-sizing: border-box;
        }
        .reviewer-body-hint {
            font-size: 12px;
            color: var(--accent-gold);
            margin-bottom: 8px;
            opacity: 0.8;
        }
        [title~="Double-click"] {
            cursor: text;
        }
        .reviewer-editable-hint {
            position: absolute;
            top: 4px;
            right: 4px;
            font-size: 10px;
            background: var(--accent-gold);
            color: #000;
            padding: 2px 6px;
            border-radius: 3px;
            opacity: 0.8;
            pointer-events: none;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* Reviewer-only delete button — top-right corner of hero image */
        .reviewer-delete-btn {
            position: absolute;
            top: 14px;
            right: 14px;
            z-index: 20;
            width: 38px;
            height: 38px;
            background: #c62828;
            border: 2px solid #b71c1c;
            border-radius: 4px;
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0.9;
            transition: opacity 0.15s, background 0.15s;
        }
        .reviewer-delete-btn:hover {
            opacity: 1;
            background: #b71c1c;
        }

        /* Reviewer image-regeneration button — sits left of the delete button */
        .reviewer-regen-btn {
            position: absolute;
            top: 14px;
            right: 62px;
            z-index: 20;
            width: 38px;
            height: 38px;
            background: #c62828;
            border: 2px solid #b71c1c;
            border-radius: 4px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0.9;
            transition: opacity 0.15s, background 0.15s, transform 0.3s ease;
        }
        .reviewer-regen-btn:hover {
            opacity: 1;
            background: #b71c1c;
            transform: rotate(180deg);
        }
        .reviewer-regen-btn svg {
            width: 18px;
            height: 18px;
            pointer-events: none;
        }
        .reviewer-regen-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        /* Reviewer article-rewrite button — sits left of the image-regen button */
        .reviewer-rewrite-btn {
            position: absolute;
            top: 14px;
            right: 110px;
            z-index: 20;
            width: 38px;
            height: 38px;
            background: #c62828;
            border: 2px solid #b71c1c;
            border-radius: 4px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0.9;
            transition: opacity 0.15s, background 0.15s;
        }
        .reviewer-rewrite-btn:hover {
            opacity: 1;
            background: #b71c1c;
        }
        .reviewer-rewrite-btn svg {
            width: 18px;
            height: 18px;
            pointer-events: none;
        }
        .reviewer-rewrite-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Confirm-delete modal */
        .confirm-modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 9000;
            align-items: center;
            justify-content: center;
        }
        .confirm-modal-backdrop.open {
            display: flex;
        }
        .confirm-modal {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 32px 28px 24px;
            max-width: 380px;
            width: 90%;
            box-shadow: 0 12px 40px rgba(0,0,0,0.7);
            text-align: center;
        }
        .confirm-modal p {
            color: #f0f0f0;
            font-size: 1rem;
            line-height: 1.55;
            margin: 0 0 28px;
        }
        .confirm-modal-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .confirm-modal-ok {
            background: #c62828;
            border: none;
            border-radius: 5px;
            color: #fff;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            padding: 10px 28px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .confirm-modal-ok:hover { background: #b71c1c; }
        .confirm-modal-cancel {
            background: transparent;
            border: 1px solid #555;
            border-radius: 5px;
            color: #ccc;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 10px 28px;
            cursor: pointer;
            transition: border-color 0.15s, color 0.15s;
        }
        .confirm-modal-cancel:hover { border-color: #aaa; color: #fff; }

        .article-hero-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: var(--space-3xl) var(--space-xl);
            background: linear-gradient(transparent, rgba(0,0,0,0.85), rgba(0,0,0,0.95));
        }

        .article-hero-content {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 var(--space-lg);
        }

        .article-meta-top {
            display: flex;
            align-items: center;
            gap: var(--space-md);
            margin-bottom: var(--space-md);
            flex-wrap: wrap;
        }

        .article-source-badge {
            display: inline-flex;
            align-items: center;
            gap: var(--space-xs);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .article-source-badge.cnn { background: #cc0000; color: white; }
        .article-source-badge.foxnews { background: #003366; color: white; }
        .article-source-badge.yahoo { background: #6001d2; color: white; }
        .article-source-badge.nytimes { background: #f5f5f5; color: #1a1a1a; }
        .article-source-badge.msn { background: #0078d4; color: white; }
        .article-source-badge.default { background: var(--accent-gold); color: var(--bg-primary); }

        .article-rank-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .article-rank-badge.rank-1 { background: var(--accent-gold); color: var(--bg-primary); }
        .article-rank-badge.rank-2 { background: #c0c0c0; color: var(--bg-primary); }
        .article-rank-badge.rank-3 { background: #cd7f32; color: white; }

        .article-rank-badge svg {
            width: 12px;
            height: 12px;
        }

        .article-category {
            font-size: 11px;
            font-weight: 600;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .article-hero-title {
            font-family: 'Playfair Display', serif;
            font-size: var(--font-3xl);
            font-weight: 700;
            line-height: 1.2;
            color: var(--text-primary);
            margin-bottom: var(--space-lg);
        }

        .article-meta-bottom {
            display: flex;
            align-items: center;
            gap: var(--space-lg);
            color: var(--text-muted);
            font-size: var(--font-sm);
        }

        .article-meta-item {
            display: flex;
            align-items: center;
            gap: var(--space-xs);
        }

        .article-meta-item svg {
            width: 14px;
            height: 14px;
            opacity: 0.7;
        }

        .prominence-score {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }

        .score-circle-small {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--font-sm);
            font-weight: 700;
            background: rgba(16, 124, 16, 0.2);
            color: var(--accent-green);
            border: 2px solid var(--accent-green);
        }

        /* ============================================
           ARTICLE CONTENT
           ============================================ */

        .article-container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: var(--space-2xl) var(--space-lg);
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: var(--space-3xl);
        }

        .article-main {
            /* Full width - content extends to the right */
        }

        .article-body {
            font-size: var(--font-lg);
            line-height: var(--article-line-height);
            color: var(--text-body);
            text-align: justify;
        }

        .article-body p {
            margin-bottom: var(--space-xl);
            text-align: justify;
        }

        .article-body p:first-child::first-letter {
            float: left;
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            line-height: 0.8;
            padding-right: var(--space-md);
            padding-top: var(--space-xs);
            color: var(--accent-gold);
        }

        .article-body h1 {
            font-family: 'Playfair Display', serif;
            font-size: var(--font-2xl);
            font-weight: 700;
            margin-top: var(--space-2xl);
            margin-bottom: var(--space-lg);
            color: var(--text-primary);
            line-height: 1.25;
        }

        .article-body h2 {
            font-size: var(--font-xl);
            font-weight: 600;
            margin-top: var(--space-2xl);
            margin-bottom: var(--space-lg);
            color: var(--text-primary);
        }

        .article-body h3 {
            font-size: var(--font-lg);
            font-weight: 600;
            margin-top: var(--space-xl);
            margin-bottom: var(--space-md);
            color: var(--text-primary);
        }

        .article-body h4, .article-body h5, .article-body h6 {
            font-size: var(--font-md);
            font-weight: 600;
            margin-top: var(--space-lg);
            margin-bottom: var(--space-sm);
            color: var(--text-secondary);
        }

        .article-body hr {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: var(--space-2xl) 0;
        }

        .article-body strong {
            font-weight: 700;
            color: var(--text-primary);
        }

        .article-body em {
            font-style: italic;
            color: var(--text-secondary);
        }

        .article-body a {
            color: var(--accent-gold);
            text-decoration: underline;
        }

        .article-body a:hover {
            color: var(--accent-gold-hover);
        }

        .article-body code {
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 1px 6px;
            color: var(--accent-gold);
        }

        .article-body pre {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--card-radius);
            padding: var(--space-lg);
            overflow-x: auto;
            margin: var(--space-xl) 0;
        }

        .article-body pre code {
            background: none;
            border: none;
            padding: 0;
            color: var(--text-secondary);
        }

        .article-body blockquote {
            margin: var(--space-2xl) 0;
            padding: var(--space-lg) var(--space-xl);
            border-left: 3px solid var(--accent-gold);
            background: var(--bg-card);
            border-radius: 0 var(--card-radius) var(--card-radius) 0;
            font-style: italic;
            color: var(--text-secondary);
            text-align: justify;
        }

        .article-body ul, .article-body ol {
            margin: var(--space-lg) 0;
            padding-left: var(--space-xl);
        }

        .article-body li {
            margin-bottom: var(--space-sm);
        }

        /* Author Byline */
        .article-byline {
            display: flex;
            align-items: flex-start;
            gap: var(--space-md);
            margin: var(--space-xl) 0;
            padding: var(--space-lg);
            background: var(--bg-secondary);
            border-radius: var(--card-radius);
            border-left: 3px solid var(--accent-gold);
        }

        .article-byline-avatars {
            display: flex;
            gap: calc(var(--space-xs) * -1);
            flex-shrink: 0;
        }

        .article-byline-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            color: white;
            margin-right: -8px;
        }

        .article-byline-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .article-byline-text {
            flex: 1;
            min-width: 0;
        }

        .article-byline-credit {
            font-size: var(--font-sm);
            color: var(--text-secondary);
            margin-bottom: 2px;
        }

        .article-byline-names {
            font-size: var(--font-base);
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.4;
        }

        .article-byline-names a {
            color: var(--accent-gold);
            text-decoration: none;
        }

        .article-byline-names a:hover {
            text-decoration: underline;
        }

        .article-byline-roles {
            font-size: var(--font-sm);
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .author-bio-excerpt {
            font-size: var(--font-sm);
            color: var(--text-secondary);
            margin-top: var(--space-xs);
            font-style: italic;
            line-height: 1.5;
        }

        /* Hopeful Call-to-Action Box */
        .hope-callout {
            margin: var(--space-2xl) 0;
            padding: var(--space-xl);
            background: linear-gradient(135deg, rgba(230, 172, 0, 0.1), rgba(230, 172, 0, 0.05));
            border: 1px solid rgba(230, 172, 0, 0.3);
            border-radius: var(--card-radius);
        }

        .hope-callout-title {
            font-size: var(--font-md);
            font-weight: 600;
            color: var(--accent-gold);
            margin-bottom: var(--space-sm);
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }

        .hope-callout-title svg {
            width: 20px;
            height: 20px;
        }

        .hope-callout-text {
            font-size: var(--font-base);
            color: var(--text-secondary);
            line-height: 1.6;
            text-align: justify;
        }

        /* Original Source Link */
        .original-source {
            margin-top: var(--space-2xl);
            padding: var(--space-lg);
            background: var(--bg-card);
            border-radius: var(--card-radius);
            border: 1px solid var(--border-color);
        }

        .original-source-label {
            font-size: var(--font-xs);
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: var(--space-sm);
        }

        .original-source-title {
            font-size: var(--font-base);
            color: var(--text-secondary);
            margin-bottom: var(--space-sm);
        }

        .original-source-link {
            font-size: var(--font-sm);
            color: var(--accent-blue);
            word-break: break-all;
        }

        .original-source-link:hover {
            text-decoration: underline;
        }

        /* ============================================
           ARTICLE SIDEBAR
           ============================================ */

        .article-sidebar {
            position: sticky;
            top: calc(var(--header-height) + var(--space-xl));
            height: fit-content;
        }

        .sidebar-widget {
            background: var(--bg-card);
            border-radius: var(--card-radius);
            padding: var(--space-lg);
            margin-bottom: var(--space-lg);
        }

        .widget-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--space-md);
            padding-bottom: var(--space-sm);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .widget-title svg {
            width: 18px; height: 18px;
            flex-shrink: 0;
            opacity: 0.65;
        }

        /* ============================================
           TTS - READ ALOUD WIDGET
           ============================================ */

        .tts-controls {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            margin-bottom: var(--space-md);
        }

        .tts-play-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--accent-gold);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s, background 0.2s;
            flex-shrink: 0;
        }

        .tts-play-btn:hover { background: var(--accent-gold-hover); transform: scale(1.06); }

        .tts-play-btn svg { width: 18px; height: 18px; fill: #000; color: #000; }

        .tts-stop-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: transparent;
            border: 1px solid var(--border-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .tts-stop-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }
        .tts-stop-btn svg { width: 14px; height: 14px; }

        .tts-speed-btn {
            background: rgba(255,255,255,0.08);
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            font-family: inherit;
            transition: all 0.15s;
        }

        .tts-speed-btn:hover { background: rgba(255,255,255,0.15); color: var(--text-primary); }

        .tts-gender-toggle {
            display: flex;
            align-items: center;
            gap: 2px;
            margin-left: auto;
        }

        .tts-gender-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
            padding: 0;
            position: relative;
            z-index: 1;
        }

        .tts-gender-btn:active { transform: scale(0.85); }

        .tts-gender-btn svg {
            width: 36px;
            height: 36px;
            transition: filter 0.3s ease, transform 0.3s ease, color 0.3s ease;
            pointer-events: none;
        }

        .tts-gender-btn { color: #ffffff; }

        .tts-gender-btn:not(.active) { opacity: 0.25; }
        .tts-gender-btn:not(.active):hover { opacity: 0.5; }
        .tts-gender-btn:not(.active):hover svg { transform: scale(1.1); }

        .tts-gender-btn.active { opacity: 1; color: #E6AC00; }
        .tts-gender-btn.active svg {
            filter: drop-shadow(0 0 5px rgba(230,172,0,0.5));
            transform: scale(1.05);
        }

        .tts-progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
            margin-bottom: 6px;
            transition: height 0.15s;
        }

        .tts-progress-bar:hover { height: 6px; }

        .tts-progress-fill {
            height: 100%;
            width: 0%;
            background: var(--accent-gold);
            border-radius: 2px;
            transition: width 0.2s linear;
        }

        .tts-time-display {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 3px;
            font-size: 11px;
            font-family: 'SF Mono', 'Consolas', 'Monaco', monospace;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            margin-bottom: var(--space-sm);
        }

        .tts-time-sep { opacity: 0.4; }

        #ttsElapsed { color: var(--accent-gold); }
        #ttsDuration { color: var(--text-muted); }

        /* Translate Widget */
        .translate-dropdown { position: relative; margin-top: 8px; }
        .translate-dropdown-trigger {
            width: 100%;
            padding: 8px 10px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            user-select: none;
            transition: border-color 0.2s, color 0.2s;
        }
        .translate-dropdown-trigger:hover { border-color: var(--border-hover); color: var(--text-primary); }
        .translate-dropdown.open .translate-dropdown-trigger { border-color: var(--accent-gold); color: var(--text-primary); }
        .translate-dropdown-label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .translate-dropdown-arrow {
            width: 13px; height: 13px;
            flex-shrink: 0;
            opacity: 0.5;
            transition: transform 0.2s, opacity 0.2s;
        }
        .translate-dropdown.open .translate-dropdown-arrow { transform: rotate(180deg); opacity: 1; }
        .translate-dropdown-panel {
            display: none;
            position: absolute;
            top: calc(100% + 3px);
            left: 0; right: 0;
            background: var(--bg-tertiary);
            border: 1px solid rgba(230,172,0,0.5);
            border-radius: 6px;
            max-height: 372px;
            overflow-y: scroll;
            z-index: 1000;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            scrollbar-width: thin;
            scrollbar-color: rgba(230,172,0,0.6) transparent;
        }
        .translate-dropdown-panel.panel-above {
            top: auto;
            bottom: calc(100% + 3px);
        }
        .translate-dropdown-panel::-webkit-scrollbar { width: 4px; }
        .translate-dropdown-panel::-webkit-scrollbar-track { background: transparent; }
        .translate-dropdown-panel::-webkit-scrollbar-thumb { background: rgba(230,172,0,0.6); border-radius: 4px; }
        .translate-dropdown-panel::-webkit-scrollbar-thumb:hover { background: var(--accent-gold); }
        .translate-dropdown.open .translate-dropdown-panel { display: block; }
        .translate-search-input {
            width: 100%;
            padding: 7px 10px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            color: var(--text-primary);
            font-size: 12px;
            outline: none;
            font-family: inherit;
            position: sticky;
            top: 0;
            z-index: 1;
        }
        .translate-search-input:focus { border-color: var(--accent-gold); }
        .translate-search-input::placeholder { color: var(--text-muted); }
        .translate-no-results {
            padding: 12px 10px;
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
        }
        .translate-prev-lang-section { margin-top: 8px; font-size: 11px; line-height: 1.7; }
        .translate-prev-lang-section a { color: var(--accent-gold); text-decoration: none; opacity: 0.85; cursor: pointer; display: block; padding: 1px 0; }
        .translate-prev-lang-section a:hover { opacity: 1; text-decoration: underline; }
        .tts-play-btn.tts-inactive { opacity: 0.3; pointer-events: none; cursor: not-allowed; }
        .translate-dropdown-option {
            padding: 7px 10px;
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: background 0.1s, color 0.1s;
        }
        .translate-dropdown-option:hover { background: var(--bg-card-hover); color: var(--text-primary); }
        .translate-dropdown-option.active { color: var(--accent-gold); background: rgba(230,172,0,0.07); }
        .translate-status {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            color: var(--accent-gold);
            font-size: 13px;
        }
        .translate-spinner {
            width: 14px; height: 14px;
            border: 2px solid rgba(230,172,0,0.3);
            border-top-color: var(--accent-gold);
            border-radius: 50%;
            animation: tts-spin 0.7s linear infinite;
            flex-shrink: 0;
        }
        @keyframes tts-spin { to { transform: rotate(360deg); } }
        .translate-restore-btn {
            margin-top: 10px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 12px;
            cursor: pointer;
            padding: 0;
        }
        .translate-restore-btn:hover { color: var(--accent-gold); }

        /* Highlight currently spoken paragraph/heading */
        .article-body [data-tts-segment].tts-speaking {
            background: rgba(230, 172, 0, 0.12);
            border-radius: 4px;
            outline: 2px solid rgba(230, 172, 0, 0.25);
            transition: background 0.3s, outline 0.3s;
        }

        /* Word-level highlighting */
        .article-body [data-tts-segment] .tts-word {
            cursor: pointer;
            border-radius: 2px;
            transition: background 0.15s, color 0.15s;
        }
        .article-body [data-tts-segment] .tts-word:hover {
            background: rgba(230, 172, 0, 0.15);
        }
        .article-body [data-tts-segment] .tts-word.tts-word-active {
            background: rgba(230, 172, 0, 0.35);
            color: #fff;
            border-radius: 2px;
        }

        /* Related Articles */
        .related-article {
            display: flex;
            gap: var(--space-md);
            padding: var(--space-sm) 0;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .related-article:last-child {
            border-bottom: none;
        }

        .related-article:hover {
            opacity: 0.8;
        }

        .related-article-image {
            width: 80px;
            height: 60px;
            border-radius: 4px;
            overflow: hidden;
            flex-shrink: 0;
            background: var(--bg-tertiary);
        }

        .related-article-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .related-article-content {
            flex: 1;
        }

        .related-article-title {
            font-size: var(--font-sm);
            font-weight: 500;
            line-height: 1.4;
            color: var(--text-primary);
            margin-bottom: var(--space-xs);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .related-article-meta {
            font-size: 10px;
            color: var(--text-muted);
        }

        /* Daily Verse */
        .verse-widget {
            border-left: 3px solid var(--accent-gold);
        }

        .verse-text {
            font-size: var(--font-base);
            font-style: italic;
            line-height: 1.6;
            color: var(--text-secondary);
            margin-bottom: var(--space-md);
        }

        .verse-reference {
            font-size: var(--font-sm);
            color: var(--accent-gold);
            font-weight: 600;
        }

        /* Share Widget */
        .share-buttons {
            display: flex;
            gap: var(--space-sm);
            flex-wrap: wrap;
        }

        .share-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: var(--card-radius);
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .share-button:hover {
            background: var(--accent-gold);
            color: var(--bg-primary);
        }

        .share-button svg {
            width: 18px;
            height: 18px;
        }

        /* ============================================
           MORE ARTICLES SECTION
           ============================================ */

        .more-articles {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: var(--space-2xl) var(--space-lg);
            border-top: 1px solid var(--border-color);
        }

        .more-articles-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--space-lg);
        }

        .more-articles-title {
            font-size: var(--font-md);
            font-weight: 600;
            color: var(--text-primary);
        }

        .more-articles-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: var(--space-md);
        }

        .more-article-card {
            background: var(--bg-card);
            border-radius: var(--card-radius);
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .more-article-card:hover {
            background: var(--bg-card-hover);
        }

        .more-article-image {
            aspect-ratio: 16/9;
            background: var(--bg-tertiary);
            overflow: hidden;
        }

        .more-article-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .more-article-card:hover .more-article-image img {
            transform: scale(1.02);
        }

        .more-article-body {
            padding: var(--space-md);
        }

        .more-article-category {
            font-size: 10px;
            color: var(--accent-gold);
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: var(--space-xs);
        }

        .more-article-title {
            font-size: var(--font-base);
            font-weight: 600;
            line-height: 1.35;
            color: var(--text-primary);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* ============================================
           FOOTER
           ============================================ */

        .footer {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            padding: var(--space-xl) 0;
            margin-top: var(--space-2xl);
        }

        .footer-inner {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 var(--space-lg);
            text-align: center;
        }

        .footer-text {
            font-size: var(--font-sm);
            color: var(--text-muted);
        }

        /* ============================================
           LOADING STATE
           ============================================ */

        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            gap: var(--space-md);
        }

        .loading-spinner {
            width: 36px;
            height: 36px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: var(--font-sm);
            color: var(--text-muted);
        }

        /* Error State */
        .error-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            gap: var(--space-md);
            text-align: center;
            padding: var(--space-xl);
        }

        .error-state svg {
            width: 48px;
            height: 48px;
            color: var(--accent-red);
            opacity: 0.5;
        }

        .error-state h2 {
            font-size: var(--font-xl);
            color: var(--text-primary);
        }

        .error-state p {
            font-size: var(--font-base);
            color: var(--text-muted);
            max-width: 400px;
        }

        .error-state .btn {
            margin-top: var(--space-md);
            padding: var(--space-sm) var(--space-lg);
            background: var(--accent-gold);
            color: var(--bg-primary);
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .error-state .btn:hover {
            background: var(--accent-gold-hover);
        }

        /* ============================================
           RESPONSIVE DESIGN
           ============================================ */

        @media (max-width: 1280px) {
            .more-articles-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 1024px) {
            .article-container {
                grid-template-columns: 1fr;
            }

            .article-sidebar {
                position: static;
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: var(--space-lg);
            }

            .more-articles-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            .article-hero {
                max-height: 525px;
            }

            .article-hero-image {
                height: 525px;
            }

            .article-hero-overlay {
                padding: var(--space-xl) var(--space-lg);
            }

            .article-hero-title {
                font-size: var(--font-2xl);
            }

            .article-meta-bottom {
                flex-wrap: wrap;
                gap: var(--space-md);
            }

            .article-body {
                font-size: var(--font-md);
            }

            .article-body p:first-child::first-letter {
                font-size: 3rem;
            }

            .article-sidebar {
                grid-template-columns: 1fr;
            }

            .more-articles-grid {
                grid-template-columns: 1fr;
            }

            .header-media-links {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .back-btn-overlay span {
                display: none;
            }

            .article-hero {
                max-height: 420px;
            }

            .article-hero-image {
                height: 420px;
            }

            .article-hero-title {
                font-size: var(--font-xl);
            }

            .article-meta-top {
                gap: var(--space-sm);
            }

            .article-source-badge,
            .article-rank-badge {
                font-size: 10px;
                padding: 3px 8px;
            }

            .prominence-score {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Confirm-delete modal -->
    <div class="confirm-modal-backdrop" id="confirmDeleteModal" role="dialog" aria-modal="true">
        <div class="confirm-modal">
            <p>Delete this article from the portal?<br>This cannot be undone.</p>
            <div class="confirm-modal-actions">
                <button class="confirm-modal-ok" id="confirmDeleteOk">OK</button>
                <button class="confirm-modal-cancel" id="confirmDeleteCancel">CANCEL</button>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="header-inner">
            <a href="/" class="logo">
                <img src="/images/JubileeLogo.png" alt="Jubilee" class="logo-icon">
                <div class="logo-text">Jubilee<span class="logo-verse">Verse</span><span class="logo-dotcom">.com</span></div>
            </a>

            <div class="header-actions">
                <div class="header-media-links">
                    <a href="/prayer">Prayer</a>
                    <span class="divider">|</span>
                    <a href="/sermons">Sermons</a>
                    <span class="divider">|</span>
                    <a href="/music">Music</a>
                    <span class="divider">|</span>
                    <a href="/radio">Radio</a>
                    <span class="divider">|</span>
                    <a href="https://www.jubileeinspire.com" target="_blank" rel="noopener">AI Bible Chat</a>
                </div>
                <a href="/signin" class="btn-sign-in" id="signInBtn">Sign In</a>
                <div class="profile-btn-container" id="profileBtnContainer" style="display: none;">
                    <button class="profile-btn" id="profileBtn" onclick="toggleProfileDropdown(event)">
                        <span id="profileInitials">?</span>
                    </button>
                    <div class="profile-dropdown" id="profileDropdown">

                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            Profile Settings
                        </a>
                        <div class="profile-dropdown-divider" id="profileDivider" style="display: none;"></div>

                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                            Sign Out
                        </a>
                    </div>
