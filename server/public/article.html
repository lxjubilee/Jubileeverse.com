        async function onTranslateLangChange(langCode) {
            if (!langCode || langCode === 'en-US') { restoreOriginalArticle(); return; }
            const langObj = TRANSLATE_LANGUAGES.find(l => l.code === langCode);
            if (!langObj) return;
            ttsStop();
            // Disable TTS play button until first paragraph is ready
            const playBtn = document.getElementById('ttsPlayBtn');
            if (playBtn) playBtn.classList.add('tts-inactive');
            showTranslateStatus('Checking database...');
            const articleId = (currentArticle && currentArticle.id) || 0;

            // Check translation cache — fail silently and fall through to streaming on any error
            if (articleId > 0) {
                try {
                    const r = await fetch(`/api/articles/${articleId}/translation/${langCode}`);
                    if (r.ok && r.headers.get('content-type')?.includes('json')) {
                        const data = await r.json();
                        if (data.found) {
                            displayTranslation(data.title, data.content, langCode);
                            return;
                        }
                    }
                } catch (e) {
                    console.warn('[Translate] Cache check failed, proceeding to stream:', e.message);
                }
            }

            // Stream translation (pass fallback content for articles not in local DB)
            // Use saved originals if available (prevents sending already-translated content)
            const titleEl = document.querySelector('.article-hero-title');
            const bodyEl = document.querySelector('.article-body');
            const fbTitle = translateOriginalTitle || (titleEl ? titleEl.textContent.trim() : '');
            const fbContent = translateOriginalContent || (bodyEl ? bodyEl.innerHTML : '');
            streamTranslation(articleId, langCode, langObj.name, fbTitle, fbContent);
        }

        async function streamTranslation(articleId, langCode, langName, fbTitle, fbContent) {
            showTranslateStatus('Translating with AI...');
            // Save originals before overwriting
            if (!translateOriginalTitle) {
                const titleEl = document.querySelector('.article-hero-title');
                translateOriginalTitle = titleEl ? titleEl.textContent : '';
                const bodyEl = document.querySelector('.article-body');
                translateOriginalContent = bodyEl ? bodyEl.innerHTML : '';
                translateOriginalSegments = [...ttsSegments];
            }
            try {
                const response = await fetch(`/api/articles/${articleId}/translate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ language_code: langCode, language_name: langName, fallback_title: fbTitle, fallback_content: fbContent })
                });
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let fullContent = '';
                let titleSet = false;
                let firstParaReady = false;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();
                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        try {
                            const evt = JSON.parse(line.slice(6));
                            if (evt.type === 'title' && !titleSet) {
                                titleSet = true;
                                const titleEl = document.querySelector('.article-hero-title');
                                if (titleEl) titleEl.textContent = evt.title;
                            } else if (evt.type === 'chunk') {
                                fullContent += evt.text;
                                const ci = fullContent.indexOf('\n\n');
                                if (ci !== -1) {
                                    const htmlPart = fullContent.substring(ci + 2);
                                    const bodyEl = document.querySelector('.article-body');
                                    if (bodyEl) {
                                        bodyEl.innerHTML = htmlPart;
                                        // Activate TTS after first complete paragraph arrives
                                        if (!firstParaReady && htmlPart.includes('</p>')) {
                                            firstParaReady = true;
                                            translateCurrentLang = langCode;
                                            ttsSegments = ttsExtractSegments();
                                            const playBtn = document.getElementById('ttsPlayBtn');
                                            if (playBtn) playBtn.classList.remove('tts-inactive');
                                        }
                                    }
                                }
                            } else if (evt.type === 'done' || evt.type === 'cached') {
                                displayTranslation(evt.title, evt.content, langCode);
                                return;
                            } else if (evt.type === 'error') {
                                hideTranslateStatus();
                                const playBtn = document.getElementById('ttsPlayBtn');
                                if (playBtn) playBtn.classList.remove('tts-inactive');
                                alert('Translation failed: ' + evt.message);
                                return;
                            }
                        } catch {}
                    }
                }
            } catch (e) {
                hideTranslateStatus();
                const playBtn = document.getElementById('ttsPlayBtn');
                if (playBtn) playBtn.classList.remove('tts-inactive');
                console.error('Stream translation error:', e);
            }
        }

        function displayTranslation(title, content, langCode) {
            if (!translateOriginalTitle) {
                const titleEl = document.querySelector('.article-hero-title');
                translateOriginalTitle = titleEl ? titleEl.textContent : '';
                const bodyEl = document.querySelector('.article-body');
                translateOriginalContent = bodyEl ? bodyEl.innerHTML : '';
                translateOriginalSegments = [...ttsSegments];
            }
            const titleEl = document.querySelector('.article-hero-title');
            if (titleEl) titleEl.textContent = title;
            const bodyEl = document.querySelector('.article-body');
            if (bodyEl) bodyEl.innerHTML = content;
            translateCurrentLang = langCode;
            ttsStop();
            ttsSegments = ttsExtractSegments();
            hideTranslateStatus();
            const rb = document.getElementById('translateRestoreBtn');
            if (rb) rb.style.display = 'block';
            // Re-enable TTS play button
            const playBtn = document.getElementById('ttsPlayBtn');
            if (playBtn) playBtn.classList.remove('tts-inactive');
            // Show BACK TO link
            const langObj = TRANSLATE_LANGUAGES.find(l => l.code === langCode);
            translateUpdatePrevLangSection(true, langObj ? langObj.name : langCode);
        }

        function restoreOriginalArticle() {
            if (translateOriginalTitle) {
                const titleEl = document.querySelector('.article-hero-title');
                if (titleEl) titleEl.textContent = translateOriginalTitle;
            }
            if (translateOriginalContent) {
                const bodyEl = document.querySelector('.article-body');
                if (bodyEl) bodyEl.innerHTML = translateOriginalContent;
            }
            translateCurrentLang = null;
            translateOriginalTitle = null;
            translateOriginalContent = null;
            ttsStop();
            ttsSegments = ttsExtractSegments();
            const lbl = document.getElementById('translateDropdownLabel');
            if (lbl) lbl.textContent = 'Select language...';
            document.querySelectorAll('.translate-dropdown-option').forEach(o => o.classList.remove('active'));
            const rb = document.getElementById('translateRestoreBtn');
            if (rb) rb.style.display = 'none';
            hideTranslateStatus();
            // Re-enable TTS
            const playBtn = document.getElementById('ttsPlayBtn');
            if (playBtn) playBtn.classList.remove('tts-inactive');
            // Show TRANSLATE TO link if previous language in cookie
            translateUpdatePrevLangSection(false, null);
        }

        // ============================================
        // TTS — READ ALOUD ENGINE (Microsoft Edge Neural via /api/tts)
        // ============================================

        let ttsSegments = [];
        let ttsIsPlaying = false;
        let ttsIsPaused = false;
        let ttsCurrentSegIdx = -1;
        let ttsPausedSegIdx = 0;
        let ttsProgressInterval = null;
        let ttsVoiceGender = 'female';
        let ttsRate = 1;
        const ttsSpeedOptions = [1, 1.5, 2];
        let ttsSpeedIdx = 0;
        let ttsAudio = null;
        let ttsQueue = [];
        let ttsQueueIdx = 0;
        let ttsTotalChars = 0;
        let ttsSpokenChars = 0;
        let ttsElapsedSec = 0;
        let ttsTimerInterval = null;
        let ttsPauseTimeout = null;

        function ttsExtractSegments() {
            const body = document.querySelector('.article-body');
            if (!body) return [];
            const segments = [];
            let idx = 0;
            body.querySelectorAll('p, h2, h3, h4, li').forEach(el => {
                const text = el.textContent.trim();
                if (text.length > 10) {
                    el.setAttribute('data-tts-segment', idx);
                    segments.push(text);
                    // Wrap individual words in spans for word-level highlighting
                    ttsWrapWords(el, idx);
                    idx++;
                }
            });
            ttsTotalChars = segments.join('').length;
            return segments;
        }

        // Wrap each word in a tts-word span, preserving existing HTML
        function ttsWrapWords(el, segIdx) {
            // Skip if already wrapped
            if (el.querySelector('.tts-word')) return;
            const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
            const textNodes = [];
            while (walker.nextNode()) textNodes.push(walker.currentNode);
            let wordIdx = 0;
            textNodes.forEach(node => {
                const parts = node.textContent.split(/(\s+)/);
                if (parts.length <= 1 && !parts[0].trim()) return;
                const frag = document.createDocumentFragment();
                parts.forEach(part => {
                    if (part.trim()) {
                        const span = document.createElement('span');
                        span.className = 'tts-word';
                        span.setAttribute('data-tts-seg', segIdx);
                        span.setAttribute('data-tts-widx', wordIdx++);
                        span.textContent = part;
                        frag.appendChild(span);
                    } else {
                        frag.appendChild(document.createTextNode(part));
                    }
                });
                node.parentNode.replaceChild(frag, node);
            });
        }

        // Word highlight state
        let ttsWordTimer = null;
        let ttsWordElements = [];
        let ttsWordIdx = 0;
        let ttsWordPausedIdx = 0; // saved word index when paused

        function ttsWordStartHighlight(segIdx, startFromWordIdx) {
            ttsWordStopTimer();
            // Collect word elements for this segment
            const segEl = document.querySelector('[data-tts-segment="' + segIdx + '"]');
            if (!segEl) return;
            ttsWordElements = Array.from(segEl.querySelectorAll('.tts-word'));
            if (!ttsWordElements.length) return;

            // Start from specified word index (for resume) or 0
            ttsWordIdx = startFromWordIdx || 0;
            // Clear any previous active word
            ttsWordElements.forEach(el => el.classList.remove('tts-word-active'));

            const totalWords = ttsWordElements.length;
            const wordsToSpeak = totalWords - ttsWordIdx;
            if (wordsToSpeak <= 0) return;

            function step() {
                // Remove previous highlight
                if (ttsWordIdx > 0 && ttsWordElements[ttsWordIdx - 1]) {
                    ttsWordElements[ttsWordIdx - 1].classList.remove('tts-word-active');
                }
                if (ttsWordIdx < totalWords && ttsIsPlaying) {
                    ttsWordElements[ttsWordIdx].classList.add('tts-word-active');
                    ttsWordPausedIdx = ttsWordIdx;
                    ttsWordIdx++;
                    // Calculate ms per word from remaining audio time
                    const remaining = ttsAudio && ttsAudio.duration && isFinite(ttsAudio.duration)
                        ? (ttsAudio.duration - ttsAudio.currentTime) * 1000
                        : (totalWords - ttsWordIdx) * 250;
                    const wordsLeft = totalWords - ttsWordIdx;
                    const msPerWord = wordsLeft > 0 ? remaining / wordsLeft : 250;
                    ttsWordTimer = setTimeout(step, Math.max(80, msPerWord / ttsRate));
                }
            }

            // Small delay for audio to start, then begin stepping
            ttsWordTimer = setTimeout(step, 150);
        }

        function ttsWordStopTimer() {
            if (ttsWordTimer) { clearTimeout(ttsWordTimer); ttsWordTimer = null; }
        }

        function ttsWordClearHighlight() {
            ttsWordStopTimer();
            ttsWordElements.forEach(el => el.classList.remove('tts-word-active'));
            ttsWordElements = [];
            ttsWordIdx = 0;
            ttsWordPausedIdx = 0;
        }

        // Click on a word to start reading from that segment
        document.addEventListener('click', function(e) {
            const wordEl = e.target.closest('.tts-word');
            if (!wordEl) return;
            const segIdx = parseInt(wordEl.getAttribute('data-tts-seg'));
            if (isNaN(segIdx)) return;
            if (!ttsSegments.length) ttsSegments = ttsExtractSegments();
            // Stop current playback and start from clicked segment
            ttsStop();
            ttsSpeakFrom(segIdx);
        });

        // TTS pre-fetch cache: segIdx -> { url, blob } pre-downloaded audio
        const ttsPrefetchCache = {};

        async function ttsPrefetchSegment(segIdx) {
            if (segIdx >= ttsSegments.length || ttsPrefetchCache[segIdx]) return;
            const text = ttsSegments[segIdx];
            const lang = translateCurrentLang || 'en-US';
            try {
                const response = await fetch('/api/tts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, voice: ttsVoiceGender, lang })
                });
                if (!response.ok) return;
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                ttsPrefetchCache[segIdx] = { url, blob };
            } catch {}
        }

        async function ttsFetchAndPlay(segIdx) {
            if (!ttsIsPlaying || segIdx >= ttsSegments.length) {
                ttsIsPlaying = false;
                ttsIsPaused = false;
                ttsStopTimer();
                if (segIdx >= ttsSegments.length) {
                    ttsElapsedSec = ttsEstimateDuration();
                    ttsUpdateTimeDisplay();
                }
                ttsUpdatePlayIcon();
                ttsClearHighlights();
                const fill = document.getElementById('ttsProgressFill');
                if (fill) fill.style.width = segIdx >= ttsSegments.length ? '100%' : fill.style.width;
                return;
            }
            ttsPausedSegIdx = segIdx;
            ttsHighlightSegment(segIdx);

            // Update progress
            ttsSpokenChars = ttsSegments.slice(0, segIdx).join('').length;
            ttsUpdateProgress();

            const text = ttsSegments[segIdx];
            const lang = translateCurrentLang || 'en-US';
            try {
                let url;
                // Use pre-fetched audio if available
                if (ttsPrefetchCache[segIdx]) {
                    url = ttsPrefetchCache[segIdx].url;
                    delete ttsPrefetchCache[segIdx];
                } else {
                    const response = await fetch('/api/tts', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text, voice: ttsVoiceGender, lang })
                    });
                    if (!response.ok) throw new Error('TTS fetch failed');
                    const blob = await response.blob();
                    url = URL.createObjectURL(blob);
                }

                // Pre-fetch next paragraph in background while current plays
                ttsPrefetchSegment(segIdx + 1);

                ttsAudio = new Audio(url);
                ttsAudio.playbackRate = ttsRate;
                ttsAudio.onended = () => {
                    URL.revokeObjectURL(url);
                    ttsWordClearHighlight();
                    if (ttsIsPlaying) {
                        ttsPauseTimeout = setTimeout(() => {
                            ttsPauseTimeout = null;
                            if (ttsIsPlaying) ttsFetchAndPlay(segIdx + 1);
                        }, 2000);
                    }
                };
                ttsAudio.onerror = () => {
                    URL.revokeObjectURL(url);
                    ttsWordClearHighlight();
                    if (ttsIsPlaying) ttsFetchAndPlay(segIdx + 1);
                };
                await ttsAudio.play();
                // Start word-level highlighting once audio begins
                ttsWordStartHighlight(segIdx);
            } catch (e) {
                console.error('[TTS] Playback error:', e);
                if (ttsIsPlaying) ttsFetchAndPlay(segIdx + 1);
            }
        }

        function ttsSpeakFrom(fromSeg) {
            if (ttsPauseTimeout) { clearTimeout(ttsPauseTimeout); ttsPauseTimeout = null; }
            if (ttsAudio) { ttsAudio.pause(); ttsAudio = null; }
            ttsWordClearHighlight();
            clearInterval(ttsProgressInterval);
            if (!ttsSegments.length) ttsSegments = ttsExtractSegments();
            ttsPausedSegIdx = fromSeg;
            ttsIsPaused = false;
            ttsIsPlaying = true;
            ttsUpdatePlayIcon();
            ttsUpdateTimeDisplay();
            ttsStartTimer();
            ttsFetchAndPlay(fromSeg);
        }

        function ttsHighlightSegment(idx) {
            if (idx === ttsCurrentSegIdx) return;
            ttsCurrentSegIdx = idx;
            document.querySelectorAll('[data-tts-segment]').forEach(el => {
                el.classList.toggle('tts-speaking', parseInt(el.getAttribute('data-tts-segment')) === idx);
            });
            const speaking = document.querySelector('.tts-speaking');
            if (speaking) speaking.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function ttsClearHighlights() {
            ttsCurrentSegIdx = -1;
            ttsWordClearHighlight();
            document.querySelectorAll('[data-tts-segment]').forEach(el => el.classList.remove('tts-speaking'));
        }

        function ttsFormatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
        }

        function ttsEstimateDuration() {
            // ~14 chars/sec at 1x speed for neural TTS
            if (ttsTotalChars <= 0) return 0;
            return ttsTotalChars / (14 * ttsRate);
        }

        function ttsUpdateTimeDisplay() {
            const elapsedEl = document.getElementById('ttsElapsed');
            const durationEl = document.getElementById('ttsDuration');
            if (!elapsedEl || !durationEl) return;
            const est = ttsEstimateDuration();
            elapsedEl.textContent = ttsFormatTime(Math.min(ttsElapsedSec, est));
            durationEl.textContent = ttsFormatTime(est);
        }

        function ttsStartTimer() {
            ttsStopTimer();
            ttsTimerInterval = setInterval(() => {
                ttsElapsedSec += 1;
                ttsUpdateTimeDisplay();
            }, 1000);
        }

        function ttsStopTimer() {
            if (ttsTimerInterval) { clearInterval(ttsTimerInterval); ttsTimerInterval = null; }
        }

        function ttsResetTimer() {
            ttsStopTimer();
            ttsElapsedSec = 0;
            ttsUpdateTimeDisplay();
        }

        function ttsUpdateProgress() {
            if (ttsTotalChars <= 0) return;
            const pct = Math.min(100, (ttsSpokenChars / ttsTotalChars) * 100);
            const fill = document.getElementById('ttsProgressFill');
            if (fill) fill.style.width = pct + '%';
            // Sync elapsed estimate from progress
            ttsElapsedSec = (pct / 100) * ttsEstimateDuration();
            ttsUpdateTimeDisplay();
        }

        function ttsUpdatePlayIcon() {
            const icon = document.getElementById('ttsPlayIcon');
            if (!icon) return;
            icon.innerHTML = ttsIsPlaying
                ? '<rect x="6" y="4" width="4" height="16" fill="currentColor"/><rect x="14" y="4" width="4" height="16" fill="currentColor"/>'
                : '<polygon points="5 3 19 12 5 21 5 3"/>';
        }

        function ttsTogglePlay() {
            if (!ttsSegments.length) ttsSegments = ttsExtractSegments();
            ttsUpdateTimeDisplay();
            if (ttsIsPlaying) {
                // Pause: keep ttsAudio alive so we can resume from same position
                if (ttsPauseTimeout) { clearTimeout(ttsPauseTimeout); ttsPauseTimeout = null; }
                if (ttsAudio) ttsAudio.pause();
                ttsIsPlaying = false;
                ttsIsPaused = true;
                ttsStopTimer();
                // Save word position, then stop word timer (but don't reset index)
                ttsWordPausedIdx = ttsWordIdx > 0 ? ttsWordIdx - 1 : 0;
                ttsWordStopTimer();
                // Keep active word highlighted while paused (don't clear)
            } else if (ttsIsPaused) {
                // Resume: if audio element still exists, resume it from paused position
                ttsIsPlaying = true;
                ttsIsPaused = false;
                ttsStartTimer();
                const savedWordIdx = ttsWordPausedIdx;
                if (ttsAudio && ttsAudio.paused && ttsAudio.currentTime > 0) {
                    ttsAudio.play().then(() => {
                        ttsWordStartHighlight(ttsPausedSegIdx, savedWordIdx);
                    }).catch(() => {
                        ttsFetchAndPlay(ttsPausedSegIdx);
                    });
                } else {
                    // Audio was lost (e.g. between segments), re-fetch
                    ttsFetchAndPlay(ttsPausedSegIdx);
                }
            } else {
                ttsPausedSegIdx = 0;
                ttsSpokenChars = 0;
                ttsElapsedSec = 0;
                ttsSpeakFrom(0);
            }
            ttsUpdatePlayIcon();
        }

        function ttsStop() {
            if (ttsPauseTimeout) { clearTimeout(ttsPauseTimeout); ttsPauseTimeout = null; }
            if (ttsAudio) { ttsAudio.pause(); ttsAudio = null; }
            ttsIsPlaying = false;
            ttsIsPaused = false;
            ttsPausedSegIdx = 0;
            ttsSpokenChars = 0;
            clearInterval(ttsProgressInterval);
            ttsResetTimer();
            ttsClearHighlights();
            const fill = document.getElementById('ttsProgressFill');
            if (fill) fill.style.width = '0%';
            ttsUpdatePlayIcon();
            // Revoke and clear any pre-fetched audio
            Object.values(ttsPrefetchCache).forEach(c => { try { URL.revokeObjectURL(c.url); } catch {} });
            Object.keys(ttsPrefetchCache).forEach(k => delete ttsPrefetchCache[k]);
        }

        function ttsSetVoice(gender) {
            ttsVoiceGender = gender;
            const femaleBtn = document.getElementById('ttsGenderFemale');
            const maleBtn = document.getElementById('ttsGenderMale');
            const toggle = femaleBtn ? femaleBtn.closest('.tts-gender-toggle') : null;
            if (femaleBtn) femaleBtn.classList.toggle('active', gender === 'female');
            if (maleBtn) maleBtn.classList.toggle('active', gender === 'male');
            if (toggle) toggle.classList.toggle('male-active', gender === 'male');
            if (ttsIsPlaying || ttsIsPaused) {
                // Save position: which segment and how far through it
                const seg = ttsPausedSegIdx;
                const savedWordIdx = ttsWordIdx > 0 ? ttsWordIdx - 1 : ttsWordPausedIdx;
                const posRatio = ttsAudio && ttsAudio.duration && isFinite(ttsAudio.duration) && ttsAudio.duration > 0
                    ? ttsAudio.currentTime / ttsAudio.duration : 0;
                // Stop everything cleanly
                if (ttsPauseTimeout) { clearTimeout(ttsPauseTimeout); ttsPauseTimeout = null; }
                if (ttsAudio) { ttsAudio.pause(); ttsAudio = null; }
                ttsWordClearHighlight();
                // Re-fetch with new voice, then seek to approximate position
                ttsIsPlaying = true;
                ttsIsPaused = false;
                ttsUpdatePlayIcon();
                ttsStartTimer();
                (async function() {
                    const text = ttsSegments[seg];
                    const lang = translateCurrentLang || 'en-US';
                    try {
                        const response = await fetch('/api/tts', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ text, voice: ttsVoiceGender, lang })
                        });
                        if (!response.ok) throw new Error('TTS fetch failed');
                        const blob = await response.blob();
                        const url = URL.createObjectURL(blob);
                        ttsAudio = new Audio(url);
                        ttsAudio.playbackRate = ttsRate;
                        ttsHighlightSegment(seg);
                        ttsPausedSegIdx = seg;
                        ttsAudio.onended = () => {
                            URL.revokeObjectURL(url);
                            ttsWordClearHighlight();
                            if (ttsIsPlaying) {
                                ttsPauseTimeout = setTimeout(() => {
                                    ttsPauseTimeout = null;
                                    if (ttsIsPlaying) ttsFetchAndPlay(seg + 1);
                                }, 2000);
                            }
                        };
                        ttsAudio.onerror = () => {
                            URL.revokeObjectURL(url);
                            ttsWordClearHighlight();
                            if (ttsIsPlaying) ttsFetchAndPlay(seg + 1);
                        };
                        // Seek to approximate position once metadata loads
                        ttsAudio.onloadedmetadata = () => {
                            if (posRatio > 0 && ttsAudio.duration && isFinite(ttsAudio.duration)) {
                                ttsAudio.currentTime = posRatio * ttsAudio.duration;
                            }
                        };
                        await ttsAudio.play();
                        ttsPrefetchSegment(seg + 1);
                        ttsWordStartHighlight(seg, savedWordIdx);
                    } catch (e) {
                        console.error('[TTS] Voice switch error:', e);
                        if (ttsIsPlaying) ttsFetchAndPlay(seg + 1);
                    }
                })();
            }
        }

        function ttsCycleSpeed() {
            ttsSpeedIdx = (ttsSpeedIdx + 1) % ttsSpeedOptions.length;
            ttsRate = ttsSpeedOptions[ttsSpeedIdx];
            const btn = document.getElementById('ttsSpeedBtn');
            if (btn) btn.textContent = ttsRate + 'x';
            if (ttsAudio) ttsAudio.playbackRate = ttsRate;
            ttsUpdateTimeDisplay();
        }

        function ttsHandleProgressClick(e) {
            if (!ttsSegments.length) return;
            const bar = document.getElementById('ttsProgressBar');
            const rect = bar.getBoundingClientRect();
            const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
            const seg = Math.min(Math.floor(pct * ttsSegments.length), ttsSegments.length - 1);
            ttsStop();
            ttsSpeakFrom(seg);
        }
    </script>
    <script src="/js/site-translate.js"></script>
