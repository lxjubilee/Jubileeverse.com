    </header>

    <!-- Main Content Container -->
    <main id="articleContent">
        <!-- Loading State -->
        <div class="loading-state" id="loadingState">
            <div class="loading-spinner"></div>
            <div class="loading-text">Loading article...</div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-inner">
            <p class="footer-text">&copy; 2026 JubileeVerse. Part of the Jubilee Enterprise Network. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // ============================================
        // ARTICLE DATA MANAGEMENT
        // ============================================

        let currentArticle = null;
        let relatedArticles = [];

        // Sample related articles for demonstration
        const sampleRelatedArticles = [
            // Faith
            { id: 1, title: "Finding Peace in Uncertain Times", category: "Faith", image: "https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=400&h=250&fit=crop", timestamp: Date.now() - 3600000 },
            { id: 4, title: "The Power of Gratitude in Daily Life", category: "Faith", image: "https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=400&h=250&fit=crop", timestamp: Date.now() - 14400000 },
            { id: 9, title: "Trusting God When the Path Is Unclear", category: "Faith", image: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400&h=250&fit=crop", timestamp: Date.now() - 32400000 },
            { id: 16, title: "Walking by Faith, Not by Sight", category: "Faith", image: "https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=400&h=250&fit=crop", timestamp: Date.now() - 57600000 },
            // Community
            { id: 2, title: "Local Church Launches Food Drive", category: "Community", image: "https://images.unsplash.com/photo-1489659639091-8b687bc4386e?w=400&h=250&fit=crop", timestamp: Date.now() - 7200000 },
            { id: 10, title: "Neighbors Unite to Rebuild After Storm", category: "Community", image: "https://images.unsplash.com/photo-1559027615-cd4628902d4a?w=400&h=250&fit=crop", timestamp: Date.now() - 36000000 },
            { id: 17, title: "Volunteers Transform Abandoned Lot Into Garden", category: "Community", image: "https://images.unsplash.com/photo-1416879595882-3373a0480b5b?w=400&h=250&fit=crop", timestamp: Date.now() - 61200000 },
            // Inspiration
            { id: 3, title: "Morning Devotionals That Transform", category: "Inspiration", image: "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=400&h=250&fit=crop", timestamp: Date.now() - 10800000 },
            { id: 11, title: "From Despair to Hope: One Family's Journey", category: "Inspiration", image: "https://images.unsplash.com/photo-1518495973542-4542c06a5843?w=400&h=250&fit=crop", timestamp: Date.now() - 39600000 },
            { id: 18, title: "Small Acts of Kindness That Changed Lives", category: "Inspiration", image: "https://images.unsplash.com/photo-1529333166437-7750a6dd5a70?w=400&h=250&fit=crop", timestamp: Date.now() - 64800000 },
            // Worship
            { id: 5, title: "How Worship Music Heals the Soul", category: "Worship", image: "https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=400&h=250&fit=crop", timestamp: Date.now() - 18000000 },
            { id: 12, title: "New Hymns Reviving Ancient Prayers", category: "Worship", image: "https://images.unsplash.com/photo-1510915361894-db8b60106cb1?w=400&h=250&fit=crop", timestamp: Date.now() - 43200000 },
            // Family
            { id: 6, title: "Building Stronger Family Bonds Through Prayer", category: "Family", image: "https://images.unsplash.com/photo-1511895426328-dc8714191300?w=400&h=250&fit=crop", timestamp: Date.now() - 21600000 },
            { id: 13, title: "Teaching Children the Value of Compassion", category: "Family", image: "https://images.unsplash.com/photo-1536640712-4d4c36ff0e4e?w=400&h=250&fit=crop", timestamp: Date.now() - 46800000 },
            // Revival
            { id: 7, title: "Youth Revival Movement Sweeps Campuses", category: "Revival", image: "https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=400&h=250&fit=crop", timestamp: Date.now() - 25200000 },
            { id: 14, title: "Historic Church Sees Record Baptisms", category: "Revival", image: "https://images.unsplash.com/photo-1438232992991-995b7058bbb3?w=400&h=250&fit=crop", timestamp: Date.now() - 50400000 },
            // Mission
            { id: 8, title: "Missionaries Report Breakthrough in Asia", category: "Mission", image: "https://images.unsplash.com/photo-1469571486292-0ba58a3f068b?w=400&h=250&fit=crop", timestamp: Date.now() - 28800000 },
            { id: 15, title: "Clean Water Project Transforms Village", category: "Mission", image: "https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?w=400&h=250&fit=crop", timestamp: Date.now() - 54000000 }
        ];

        // ============================================
        // INITIALIZATION
        // ============================================

        document.addEventListener('DOMContentLoaded', () => {
            loadArticle();
        });

        async function loadArticle() {
            showLoading();

            // Sync role from server before rendering — ensures reviewer badge/delete button
            // reflects the current DB role even if localStorage is from before role was assigned
            try {
                const storedAuth = JSON.parse(localStorage.getItem('jubileeVerseAuth') || '{}');
                const token = storedAuth.token || (storedAuth.tokens && storedAuth.tokens.access);
                if (token) {
                    const meRes = await fetch('/api/auth/me', { headers: { 'Authorization': 'Bearer ' + token } });
                    if (meRes.ok) {
                        const meData = await meRes.json();
                        if (meData.success && meData.user) {
                            storedAuth.user = { ...storedAuth.user, ...meData.user };
                            localStorage.setItem('jubileeVerseAuth', JSON.stringify(storedAuth));
                        }
                    }
                }
            } catch (_) { /* non-fatal — rendering continues with cached role */ }

            try {
                // Get article data from URL parameters or sessionStorage
                const urlParams = new URLSearchParams(window.location.search);
                const articleId = urlParams.get('id');
                const articleIndex = urlParams.get('index');

                // Try to get article from sessionStorage (passed from index.html)
                const storedArticle = sessionStorage.getItem('selectedArticle');

                if (storedArticle) {
                    currentArticle = JSON.parse(storedArticle);
                } else if (articleId || articleIndex !== null) {
                    // Fallback: Try to fetch from stored hero stories
                    const storedStories = sessionStorage.getItem('heroStories');
                    if (storedStories) {
                        const stories = JSON.parse(storedStories);
                        const index = parseInt(articleIndex) || 0;
                        if (stories[index]) {
                            currentArticle = stories[index];
                        }
                    }
                }

                if (currentArticle) {
                    // Current event article — always fetch fresh from server (generates content on-demand if missing)
                    if (currentArticle.isCurrentEvent && currentArticle.id) {
                        fetch(`/api/current-events/article/${currentArticle.id}`)
                            .then(r => r.json())
                            .then(data => {
                                if (data.success && data.article) {
                                    currentArticle.rewrittenContent = data.article.full_article || currentArticle.rewrittenContent;
                                    currentArticle.imageUrl = currentArticle.imageUrl || data.article.cached_image_path || data.article.image_url;
                                }
                                loadRelatedArticles();
                                renderArticle();
                            })
                            .catch(() => {
                                loadRelatedArticles();
                                renderArticle();
                            });
                    // jv_content_objects article — fetch from public endpoint (no auth required)
                    } else if (currentArticle.isJVContent && currentArticle.id) {
                        fetch(`/api/public/article/${currentArticle.id}`)
                            .then(r => r.json())
                            .then(data => {
                                if (data && data.id) {
                                    const ext = data.extension_data || {};
                                    currentArticle.rewrittenContent = ext.body || data.summary || '';
                                    currentArticle.imageUrl = currentArticle.imageUrl || ext.hero_image_path || '';
                                    if (!currentArticle.title && data.title) currentArticle.title = data.title;
                                    if (!currentArticle.rewrittenTitle && data.title) currentArticle.rewrittenTitle = data.title;
                                }
                                loadRelatedArticles();
                                renderArticle();
                            })
                            .catch(() => {
                                loadRelatedArticles();
                                renderArticle();
                            });
                    // Non-current-event article with no content — fetch from inspire DB
                    } else if (currentArticle.id && !currentArticle.content && !currentArticle.rewrittenContent) {
                        fetch(`/api/articles/${currentArticle.id}`)
                            .then(r => r.json())
                            .then(data => {
                                if (data.success && data.article) {
                                    currentArticle.content = data.article.content;
                                    currentArticle.imageUrl = currentArticle.imageUrl || data.article.image;
                                }
                                loadRelatedArticles();
                                renderArticle();
                            })
                            .catch(() => {
                                loadRelatedArticles();
                                renderArticle();
                            });
                    } else {
                        loadRelatedArticles();
                        renderArticle();
                    }
                } else {
                    showError();
                }

            } catch (error) {
                console.error('Error loading article:', error);
                showError();
            }
        }

        function loadRelatedArticles() {
            const currentTitle = currentArticle?.rewrittenTitle || currentArticle?.title || '';
            const currentCategory = (currentArticle?.storyCluster || currentArticle?.category || '').toLowerCase();

            // Gather candidate articles, excluding the current one
            let candidates = [];

            // Try to get other stories from sessionStorage
            const storedStories = sessionStorage.getItem('heroStories');
            if (storedStories) {
                const stories = JSON.parse(storedStories);
                candidates = stories.filter(s => {
                    const t = s.rewrittenTitle || s.title || '';
                    return t !== currentTitle;
                });
            }

            // Add sample articles (excluding current by title)
            const samples = sampleRelatedArticles.filter(s => s.title !== currentTitle);
            candidates = [...candidates, ...samples];

            // Deduplicate by title
            const seen = new Set();
            candidates = candidates.filter(a => {
                const t = a.rewrittenTitle || a.title;
                if (seen.has(t)) return false;
                seen.add(t);
                return true;
            });

            // Sort: same category first, then others
            if (currentCategory) {
                const sameCategory = candidates.filter(a => (a.storyCluster || a.category || '').toLowerCase() === currentCategory);
                const otherCategory = candidates.filter(a => (a.storyCluster || a.category || '').toLowerCase() !== currentCategory);
                relatedArticles = [...sameCategory, ...otherCategory].slice(0, 10);
            } else {
                relatedArticles = candidates.slice(0, 10);
            }
        }

        // ============================================
        // RENDERING
        // ============================================

        // Track article view (fire-and-forget, deduped by session)
        var _viewTracked = false;
        function trackArticleView() {
            if (_viewTracked || !currentArticle || !currentArticle.id) return;
            _viewTracked = true;
            var aType = currentArticle.isCurrentEvent ? 'current_event' : 'article';
            var sid = sessionStorage.getItem('_jv_sid');
            if (!sid) { sid = 'sid_' + Date.now() + '_' + Math.random().toString(36).substr(2, 8); sessionStorage.setItem('_jv_sid', sid); }
            var token = getAuthToken();
            var headers = { 'Content-Type': 'application/json' };
            if (token) headers['Authorization'] = 'Bearer ' + token;
            fetch('/api/track/view', {
                method: 'POST', headers: headers,
                body: JSON.stringify({ article_id: currentArticle.id, article_type: aType, event_type: 'view', session_id: sid })
            }).catch(function() {});
        }

        function renderAuthorByline(authors) {
            if (!authors || authors.length === 0) return '';

            // Separate by role
            const primary     = authors.filter(a => a.role === 'primary_author');
            const contributors = authors.filter(a => a.role === 'contributor');
            const editors      = authors.filter(a => a.role === 'editor');
            const translators  = authors.filter(a => a.role === 'translator');

            function authorLink(a) {
                const name = a.display_name || 'Unknown Author';
                if (a.canonical_slug) {
                    return `<a href="/authors/${encodeURIComponent(a.canonical_slug)}">${name}</a>`;
                }
                return name;
            }

            function joinNames(arr) {
                if (arr.length === 0) return '';
                if (arr.length === 1) return authorLink(arr[0]);
                const last = arr[arr.length - 1];
                const rest = arr.slice(0, -1);
                return rest.map(authorLink).join(', ') + ' and ' + authorLink(last);
            }

            // Build credit line
            let namesHtml = joinNames(primary.length > 0 ? primary : authors);
            let roleSuffix = '';
            if (contributors.length > 0) roleSuffix += ` · ${joinNames(contributors)}, contributor${contributors.length > 1 ? 's' : ''}`;
            if (editors.length > 0)      roleSuffix += ` · Edited by ${joinNames(editors)}`;
            if (translators.length > 0)  roleSuffix += ` · Translated by ${joinNames(translators)}`;

            // Avatars (first 3)
            const hues = [0, 30, 60, 120, 160, 200, 240, 280, 320];
            function avatarHtml(a) {
                const name = a.display_name || '?';
                const initials = name.trim().split(/\s+/).length >= 2
                    ? (name.trim().split(/\s+/)[0][0] + name.trim().split(/\s+/)[1][0]).toUpperCase()
                    : name.slice(0, 2).toUpperCase();
                let hash = 0;
                for (let i = 0; i < a.author_id.length; i++) hash = (hash * 31 + a.author_id.charCodeAt(i)) | 0;
                const hue = hues[Math.abs(hash) % 9];
                return `<div class="article-byline-avatar" style="background-color:hsl(${hue},55%,45%)" title="${name}">${initials}</div>`;
            }
            const avatarsHtml = authors.slice(0, 3).map(avatarHtml).join('');

            // Bio excerpt: prefer channel_bio.bio_short, fall back to primary_bio.bio_short
            const bioSource = (primary[0] || authors[0]);
            const bioShort  = bioSource?.channel_bio?.bio_short || bioSource?.primary_bio?.bio_short || '';
            const bioHtml   = bioShort ? `<div class="author-bio-excerpt">${bioShort}</div>` : '';

            return `
                <div class="article-byline">
                    <div class="article-byline-avatars">${avatarsHtml}</div>
                    <div class="article-byline-text">
                        <div class="article-byline-credit">Written by</div>
                        <div class="article-byline-names">${namesHtml}</div>
                        ${roleSuffix ? `<div class="article-byline-roles">${roleSuffix}</div>` : ''}
                        ${bioHtml}
                    </div>
                </div>
            `;
        }

        function renderArticle() {
            if (!currentArticle) {
                showError();
                return;
            }

            // Update page title
            document.title = `${currentArticle.rewrittenTitle || currentArticle.title} - JubileeVerse`;

            const content = document.getElementById('articleContent');
            const rankLabels = { 1: '1st', 2: '2nd', 3: '3rd' };

            // Determine image URL
            const imageUrl = currentArticle.downloadedImage ||
                             currentArticle.imageUrl ||
                             'https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=1200&h=600&fit=crop';

            // Build rank badge if applicable
            const rankBadge = currentArticle.rank ? `
                <span class="article-rank-badge rank-${currentArticle.rank}">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                    </svg>
                    ${rankLabels[currentArticle.rank]} Most Prominent
                </span>
            ` : '';

            // Build source badge
            const sourceBadge = currentArticle.isCurrentEvent
                ? '<span class="article-source-badge default">JubileeVerse</span>'
                : currentArticle.source
                    ? `<span class="article-source-badge ${currentArticle.source}">${currentArticle.sourceName || currentArticle.source}</span>`
                    : '<span class="article-source-badge default">Good News</span>';

            // Build category (topic slugs → readable labels for current events)
            const TOPIC_LABELS = {
                'christian-watch-us': 'Christian Watch — US',
                'church-us':   'Church — United States',
                'church-global': 'Church — Global',
                'faith':       'Faith',
                'finance':     'Finance',
                'technology':  'Technology',
                'health':      'Health & Wellness',
                'social':      'Social',
                'entertainment': 'Entertainment',
            };
            const categoryLabel = currentArticle.isCurrentEvent
                ? (TOPIC_LABELS[currentArticle.storyCluster] || capitalizeFirst(currentArticle.storyCluster || ''))
                : currentArticle.storyCluster;
            const category = categoryLabel ? `
                <span class="article-category">${categoryLabel}</span>
            ` : '';

            // Format article body content
            const articleBody = formatArticleContent(currentArticle.rewrittenContent || currentArticle.content || '');

            // Build author byline (multi-author, Section 6)
            const authorByline = renderAuthorByline(currentArticle.authors);

            // Build prominence score if available
            const prominenceScore = currentArticle.score ? `
                <div class="prominence-score">
                    <div class="score-circle-small">${currentArticle.score.normalized}</div>
                    <span>Prominence</span>
                </div>
            ` : '';

            // Reviewer delete button — only for current event articles
            const reviewerDeleteBtn = (currentArticle.isCurrentEvent && currentArticle.id && isReviewer())
                ? `<button class="reviewer-delete-btn" title="Delete article (Reviewer)" onclick="event.stopPropagation(); deleteCurrentEventArticle(${currentArticle.id});">✕</button>`
                : '';

            // Reviewer image-regeneration button — ALL articles when reviewer
            const reviewerRegenBtn = (isReviewer() && currentArticle.id)
                ? `<button class="reviewer-regen-btn" id="articleRegenBtn" title="Regenerate image (Reviewer)" onclick="event.stopPropagation(); regenerateCurrentArticleImage(this);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 .49-4.59"></path></svg></button>`
                : '';

            // Reviewer article-rewrite button — current event articles only
            const reviewerRewriteBtn = (isReviewer() && currentArticle.id && currentArticle.isCurrentEvent)
                ? `<button class="reviewer-rewrite-btn" id="articleRewriteBtn" title="Rewrite article (Reviewer)" onclick="event.stopPropagation(); rewriteCurrentArticle(this);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg></button>`
                : '';

            content.innerHTML = `
                <!-- Hero Section -->
                <section class="article-hero">
                    <img src="${imageUrl}" alt="${currentArticle.rewrittenTitle || currentArticle.title}" class="article-hero-image" onerror="this.src='https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=1200&h=600&fit=crop'">
                    <button class="back-btn-overlay" onclick="goBack()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 12H5M12 19l-7-7 7-7"/>
                        </svg>
                        <span>Back</span>
                    </button>
                    ${reviewerDeleteBtn}
                    ${reviewerRegenBtn}
                    ${reviewerRewriteBtn}
                    <div class="article-hero-overlay">
                        <div class="article-hero-content">
                            <div class="article-meta-top">
                                ${sourceBadge}
                                ${rankBadge}
                                ${category}
                            </div>
                            <h1 class="article-hero-title">${currentArticle.rewrittenTitle || currentArticle.title}</h1>
                            <div class="article-meta-bottom">
                                <div class="article-meta-item">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                                        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
                                    </svg>
                                    <span>${estimateReadTime(articleBody)} min read</span>
                                </div>
                                ${prominenceScore}
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Article Content -->
                <div class="article-container">
                    <article class="article-main">
                        <div class="article-body">
                            ${articleBody}
                        </div>

                        ${authorByline}

                        <!-- Hopeful Call-to-Action -->
                        <div class="hope-callout">
                            <div class="hope-callout-title">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                                </svg>
                                A Word of Encouragement
                            </div>
                            <p class="hope-callout-text">
                                In every story, we find opportunities for hope, growth, and renewed faith.
                                As we navigate the complexities of our world, let us remember that we are called
                                to be lights in the darkness, bringing compassion and understanding to every situation.
                            </p>
                        </div>

                    </article>

                    <!-- Sidebar -->
                    <aside class="article-sidebar">
                        <!-- Read Aloud Widget -->
                        <div class="sidebar-widget">
                            <h3 class="widget-title">
                                Read Aloud
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
                            </h3>
                            <div class="tts-controls">
                                <button class="tts-play-btn" id="ttsPlayBtn" onclick="ttsTogglePlay()" title="Play">
                                    <svg id="ttsPlayIcon" viewBox="0 0 24 24" fill="currentColor">
                                        <polygon points="5 3 19 12 5 21 5 3"/>
                                    </svg>
                                </button>
                                <button class="tts-stop-btn" onclick="ttsStop()" title="Stop">
                                    <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
                                </button>
                                <button class="tts-speed-btn" id="ttsSpeedBtn" onclick="ttsCycleSpeed()">1x</button>
                                <div class="tts-gender-toggle">
                                    <button class="tts-gender-btn female-btn active" id="ttsGenderFemale" onclick="ttsSetVoice('female')" title="Female voice">
                                        <svg viewBox="0 0 100 120" fill="currentColor">
                                            <circle cx="50" cy="14" r="10"/>
                                            <!-- Torso -->
                                            <path d="M42 26 L42 48 L58 48 L58 26 Z"/>
                                            <!-- Arms -->
                                            <path d="M42 28 L26 50 L32 54 L42 38"/>
                                            <path d="M58 28 L74 50 L68 54 L58 38"/>
                                            <!-- Skirt -->
                                            <path d="M42 48 L26 78 L74 78 L58 48 Z"/>
                                            <!-- Legs -->
                                            <path d="M38 78 L36 112 L46 112 L48 78 Z"/>
                                            <path d="M52 78 L54 112 L64 112 L62 78 Z"/>
                                        </svg>
                                    </button>
                                    <button class="tts-gender-btn male-btn" id="ttsGenderMale" onclick="ttsSetVoice('male')" title="Male voice">
                                        <svg viewBox="0 0 100 120" fill="currentColor">
                                            <circle cx="50" cy="14" r="10"/>
                                            <path d="M36 28 L36 68 L64 68 L64 28 Z"/>
                                            <path d="M36 32 L20 54 L26 58 L40 40"/>
                                            <path d="M64 32 L80 54 L74 58 L60 40"/>
                                            <path d="M36 68 L34 110 L46 110 L48 68 Z"/>
                                            <path d="M52 68 L54 110 L66 110 L64 68 Z"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                            <div class="tts-progress-bar" id="ttsProgressBar" onclick="ttsHandleProgressClick(event)">
                                <div class="tts-progress-fill" id="ttsProgressFill"></div>

        function formatArticleContent(content) {
            if (!content) {
                return '<p>Content is being prepared. Please check back soon for the full article.</p>';
            }

            // If content already has HTML block tags, return as-is (existing DB articles)
            if (content.includes('<p>') || content.includes('<h2>')) {
                return content;
            }

            // Use marked.js to parse Markdown → HTML
            if (typeof marked !== 'undefined') {
                marked.setOptions({
                    breaks: true,       // single newline → <br>
                    gfm: true,          // GitHub-flavoured: tables, strikethrough, task lists
                    pedantic: false,
                });
                // Strip a leading # h1 line before parsing — the title is already
                // displayed in the hero overlay and must not be repeated in the body.
                const stripped = content.replace(/^#\s+[^\n]*\n?/, '').trimStart();
                return marked.parse(stripped);
            }

            // Fallback if CDN fails: basic paragraph splitting
            return content.split('\n\n').filter(p => p.trim()).map(p => `<p>${p.trim()}</p>`).join('');
        }

        function formatTimestamp(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);

            if (diffMins < 1) return 'Just now';
            if (diffMins < 60) return `${diffMins} min ago`;
            if (diffHours < 24) return `${diffHours} hour${diffHours > 1 ? 's' : ''} ago`;
            if (diffDays < 7) return `${diffDays} day${diffDays > 1 ? 's' : ''} ago`;

            return date.toLocaleDateString('en-US', {
                month: 'short',
                day: 'numeric',
                year: date.getFullYear() !== now.getFullYear() ? 'numeric' : undefined
            });
        }

        function estimateReadTime(content) {
            const text = content.replace(/<[^>]*>/g, '');
            const words = text.split(/\s+/).length;
            return Math.max(1, Math.ceil(words / 200));
        }

        function capitalizeFirst(str) {
            return str.charAt(0).toUpperCase() + str.slice(1);

        function generateArticleContent(title, summary, category) {
            const categoryContent = {
                faith: [
                    `<p>In a world that often feels uncertain and overwhelming, the power of faith continues to serve as an anchor for millions of people across the globe. ${summary} This truth has been reaffirmed time and again through the testimonies of believers who have experienced God's faithfulness in every season of life, from moments of great joy to the deepest valleys of despair.</p>`,
                    `<p>The Scriptures remind us in Hebrews 11:1 that "faith is the substance of things hoped for, the evidence of things not seen." This timeless truth speaks directly to the human condition — our innate need to believe in something greater than ourselves, to trust in a plan that extends beyond what our eyes can see. Throughout history, men and women of faith have drawn upon this promise to navigate the complexities of their lives with courage and conviction.</p>`,
                    `<p>Community plays an essential role in nurturing and sustaining faith. When believers gather together — whether in grand cathedrals or humble living rooms — something powerful happens. Burdens are shared, prayers are lifted, and hope is renewed. The early church understood this principle deeply, as described in Acts 2:42-47, where believers devoted themselves to fellowship, breaking of bread, and prayer. This model of community continues to inspire congregations around the world today.</p>`,
                    `<p>Modern research increasingly validates what people of faith have known for centuries: spiritual practices like prayer, meditation on Scripture, and communal worship have measurable positive effects on mental health, emotional resilience, and overall well-being. Studies from leading universities have found that individuals who maintain an active spiritual life report higher levels of life satisfaction, lower rates of depression, and stronger social connections.</p>`,
                    `<p>One of the most remarkable aspects of faith is its ability to transform perspective. When we view our circumstances through the lens of God's sovereignty, even our greatest challenges take on new meaning. The apostle Paul, writing from a Roman prison, declared in Philippians 4:11-13 that he had learned to be content in every situation — whether in plenty or in want — because of the strength he found in Christ. This radical contentment is available to every believer who chooses to anchor their identity in God's unchanging character rather than in shifting circumstances.</p>`,
                    `<p>Churches and faith-based organizations are also leading the charge in addressing some of society's most pressing issues. From feeding the hungry and sheltering the homeless to providing counseling services and addiction recovery programs, communities of faith are making tangible differences in the lives of those who need it most. These acts of service flow naturally from a genuine faith that compels believers to love their neighbors in practical, meaningful ways.</p>`,
                    `<p>For those who may be exploring faith for the first time or returning after a season away, the invitation remains open and genuine. God's grace knows no bounds, and His love is not reserved for those who have it all figured out. In fact, Jesus Himself said, "It is not the healthy who need a doctor, but the sick" (Mark 2:17). This message of radical inclusion continues to draw people from every walk of life into a relationship with the Creator who made them and loves them unconditionally.</p>`,
                    `<p>As we look toward the future, the landscape of faith continues to evolve while its core truths remain steadfast. New expressions of worship emerge, creative approaches to ministry develop, and technology opens doors for the Gospel to reach corners of the world previously untouched. Through it all, the message remains the same: God is faithful, His love endures forever, and those who put their trust in Him will never be put to shame.</p>`,
                    `<p>The journey of faith is not always easy. There will be seasons of doubt, moments of confusion, and times when the path forward seems unclear. But it is precisely in these moments that faith grows deepest. Like a tree whose roots grow stronger in the wind, believers who persevere through trials develop a resilience and depth of character that cannot be achieved any other way. As James 1:2-4 encourages us, we can "consider it pure joy" when we face trials, because the testing of our faith produces perseverance, and perseverance leads to maturity and completeness.</p>`,
                    `<p>Ultimately, faith is not merely an intellectual exercise or a cultural tradition — it is a living, breathing relationship with the God who created us, sustains us, and has prepared an eternal future for us. It is the confident assurance that we are known, loved, and held in the palm of His hand, no matter what tomorrow may bring. And that assurance changes everything.</p>`
                ],
                default: [
                    `<p>${summary} This story reflects a growing movement that is touching communities across the nation and around the world. As more people embrace the values of compassion, generosity, and hope, the ripple effects are being felt in homes, workplaces, schools, and neighborhoods everywhere.</p>`,
                    `<p>The foundation of this movement lies in the simple yet powerful belief that every person has inherent worth and dignity. When communities operate from this principle, remarkable things begin to happen. Neighbors reach out to one another, strangers become friends, and barriers that once seemed insurmountable begin to crumble. This is the transformative power of love in action — not merely as an abstract ideal, but as a daily practice that shapes every interaction and decision.</p>`,
                    `<p>Across the country, faith-based organizations are at the forefront of this cultural shift. Churches, ministries, and nonprofit organizations are partnering together in unprecedented ways to address the needs of their communities. Food pantries are stocked, clothing drives are organized, tutoring programs are launched, and mentoring relationships are formed. Each initiative, no matter how small, contributes to a larger tapestry of goodness that is redefining what it means to be a neighbor.</p>`,
                    `<p>The impact extends far beyond material provision. Perhaps the most significant contribution of these efforts is the restoration of hope. In a media landscape often dominated by negative headlines and divisive rhetoric, communities of faith are offering an alternative narrative — one centered on the belief that better days are not only possible but inevitable when people commit to working together with shared purpose and mutual respect.</p>`,
                    `<p>Education and mentorship have emerged as particularly powerful tools in this movement. Young people who receive guidance and encouragement from caring adults are more likely to succeed academically, develop healthy relationships, and contribute positively to their communities. Churches and youth organizations are investing heavily in the next generation, recognizing that the seeds planted today will bear fruit for decades to come.</p>`,
                    `<p>Technology is also playing an increasingly important role in connecting people with resources and opportunities. Online platforms make it possible for individuals to find volunteer opportunities, access educational content, connect with counselors and mentors, and participate in virtual faith communities. While technology can never replace the warmth of in-person connection, it serves as a valuable complement that extends the reach of compassion beyond geographical boundaries.</p>`,
                    `<p>The economic dimension of community care is also noteworthy. When people invest in one another — through job training programs, small business incubators, financial literacy classes, and micro-lending initiatives — entire communities experience uplift. Families achieve stability, local economies strengthen, and a cycle of generosity is established that perpetuates itself across generations.</p>`,
                    `<p>Health and wellness initiatives represent another critical area of community investment. Congregations are increasingly recognizing the connection between physical health, mental well-being, and spiritual vitality. Programs that address all three dimensions — through exercise groups, support groups, nutritional education, and spiritual formation — are producing holistic transformation in the lives of participants.</p>`,
                    `<p>The arts and creative expression also play a vital role in community building. Music, visual arts, theater, and storytelling bring people together in ways that transcend language and cultural barriers. Faith-inspired creative works have the unique ability to touch hearts, open minds, and inspire action. From worship music that lifts the spirit to films that challenge perspectives, the creative arts continue to be a powerful vehicle for communicating truth and beauty.</p>`,
                    `<p>Looking ahead, the momentum of this movement shows no signs of slowing. New leaders are emerging, innovative approaches are being developed, and partnerships are forming across denominational and organizational lines. The shared conviction that binds these diverse efforts together is simple yet profound: when people choose love over fear, generosity over greed, and hope over despair, the world becomes a better place for everyone. This is the good news that communities of faith are living out each and every day, and it is making all the difference.</p>`
                ]
            };

            const paragraphs = categoryContent[category] || categoryContent.default;
            return paragraphs.join('\n');
        }

        function checkAuthState() {

            var profileInitials = document.getElementById('profileInitials');
            var profileSettingsLink = document.getElementById('profileSettingsLink');
            var profileDivider = document.getElementById('profileDivider');

            if (authData) {
                try {
                    var parsed = JSON.parse(authData);
                    if (parsed.authenticated && parsed.user) {
                        var firstName = parsed.user.firstName || parsed.user.first_name || '';
                        var lastName = parsed.user.lastName || parsed.user.last_name || '';
                        var displayName = parsed.user.displayName || parsed.user.name || parsed.user.email || '';
                        var initials = '?';
                        if (firstName && lastName) {
                            initials = (firstName.charAt(0) + lastName.charAt(0)).toUpperCase();
                        } else if (firstName) {
                            initials = firstName.charAt(0).toUpperCase();
                        } else if (displayName) {
                            initials = displayName.split(' ').map(function(n) { return n[0]; }).join('').toUpperCase().substring(0, 2);
                        }
                        signInBtn.style.display = 'none';
                        profileBtnContainer.style.display = 'inline-flex';
                        profileInitials.textContent = initials;
                        if (profileSettingsLink) profileSettingsLink.style.display = 'flex';
                        if (profileDivider) profileDivider.style.display = 'block';
                        return;
                    }
                } catch(e) {}
            }

            signInBtn.style.display = '';
            profileBtnContainer.style.display = 'none';
        }

        function getAuthToken() {
            try {
                var auth = JSON.parse(localStorage.getItem('jubileeVerseAuth') || '{}');
                return auth.token || (auth.tokens && (auth.tokens.access || auth.tokens.accessToken)) || '';
            } catch(e) { return ''; }
        }

            } catch(e) { return false; }
        }

        function deleteCurrentEventArticle(id) {
            const modal   = document.getElementById('confirmDeleteModal');
            const okBtn   = document.getElementById('confirmDeleteOk');
            const cancelBtn = document.getElementById('confirmDeleteCancel');
            modal.classList.add('open');

            function close() {
                modal.classList.remove('open');
                okBtn.removeEventListener('click', onOk);
                cancelBtn.removeEventListener('click', close);
            }

            async function onOk() {
                close();
                const token = getAuthToken();
                if (!token) {
                    alert('Session token not found. Please sign out and sign back in.');
                    return;
                }
                try {
                    const res = await fetch('/api/current-events/' + id, {
                        method: 'DELETE',
                        headers: { 'Authorization': 'Bearer ' + token }
                    });
                    const data = await res.json();
                    if (res.ok && data.success) {
                        window.location.href = '/';
                    } else {
                        alert('Delete failed: ' + (data.error || 'Unknown error'));
                    }
                } catch(e) {
                    alert('Network error: ' + e.message);
                }
            }

            okBtn.addEventListener('click', onOk);
            cancelBtn.addEventListener('click', close);
            modal.addEventListener('click', function onBackdrop(e) {

        async function patchCurrentEventArticle(id, fields) {
            const token = getAuthToken();
            if (!token) { alert('Session token not found. Please sign out and sign back in.'); return false; }
            const res = await fetch('/api/current-events/' + id, {
                method: 'PATCH',
                headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                body: JSON.stringify(fields)
            });
            const data = await res.json();
            if (!res.ok || !data.success) { alert('Save failed: ' + (data.error || 'Unknown error')); return false; }
            return true;
        }

        async function patchRegularArticle(id, fields) {
            const token = getAuthToken();
            if (!token) { alert('Session token not found. Please sign out and sign back in.'); return false; }
            const res = await fetch('/api/articles/' + id, {
                method: 'PATCH',
                headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                body: JSON.stringify(fields)
            });
            const data = await res.json();
            if (!res.ok || !data.success) { alert('Save failed: ' + (data.error || 'Unknown error')); return false; }
            return true;
        }

        async function regenerateCurrentArticleImage(btnEl) {
            if (!currentArticle || !currentArticle.id) return;
            alert('This image will now be generated');
            const token = getAuthToken();
            if (!token) return;
            btnEl.disabled = true;
            btnEl.style.opacity = '0.4';
            try {
                const endpoint = currentArticle.isCurrentEvent
                    ? '/api/current-events/' + currentArticle.id + '/regenerate-image'
                    : '/api/articles/' + currentArticle.id + '/regenerate-image';
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }
                });
                const data = await res.json();
                if (res.ok && data.success && data.imagePath) {
                    const heroImg = document.querySelector('.article-hero-image');
                    if (heroImg) heroImg.src = data.imagePath + '?t=' + Date.now();
                }
            } catch (e) {
                console.warn('[Reviewer] Article image regeneration error:', e.message);
            } finally {
                btnEl.disabled = false;
                btnEl.style.opacity = '';
            }
        }

        async function rewriteCurrentArticle(btnEl) {
            if (!currentArticle || !currentArticle.id || !currentArticle.isCurrentEvent) return;
            if (!confirm('Rewrite this article using the AI prompts? The existing content will be replaced.')) return;
            const token = getAuthToken();
            if (!token) return;
            btnEl.disabled = true;
            btnEl.style.opacity = '0.4';
            try {
                const res = await fetch('/api/current-events/' + currentArticle.id + '/rewrite-article', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }
                });
                const data = await res.json();
                if (res.ok && data.success && data.full_article) {
                    currentArticle.rewrittenContent = data.full_article;
                    const bodyEl = document.querySelector('.article-body');
                    if (bodyEl && window.marked) {
                        bodyEl.innerHTML = marked.parse(data.full_article.replace(/^#[^\n]*\n/, ''));
                    }
                    console.log('[Reviewer] Article rewritten successfully.');
                } else {
                    alert('Rewrite failed: ' + (data.error || 'Unknown error'));
                }
            } catch (e) {
                console.warn('[Reviewer] Article rewrite error:', e.message);
                alert('Rewrite failed — check console.');
            } finally {
                btnEl.disabled = false;
                btnEl.style.opacity = '';
            }
        }

        function initReviewerEditing(articleId, rawContent) {
            if (!isReviewer()) return;

            // ── Title editing ─────────────────────────────────────
            const titleEl = document.querySelector('.article-hero-title');
            if (titleEl) {
                titleEl.title = 'Double-click to edit title';
                titleEl.style.cursor = 'text';
                // Small hint badge
                titleEl.style.position = 'relative';

                titleEl.addEventListener('dblclick', function() {
                    if (_reviewerEditingTitle) return;
                    _reviewerEditingTitle = true;
                    const original = titleEl.textContent.trim();
                    const wrap = document.createElement('div');
                    wrap.className = 'reviewer-title-edit-wrap';
                    wrap.innerHTML = `
                        <textarea class="reviewer-title-input" rows="2">${original}</textarea>
                        <div class="reviewer-edit-actions">
                            <button class="reviewer-save-btn">Save Title</button>
                            <button class="reviewer-cancel-btn">Cancel</button>
                        </div>
                    `;
                    titleEl.replaceWith(wrap);
                    const textarea = wrap.querySelector('textarea');
                    textarea.focus();
                    textarea.setSelectionRange(textarea.value.length, textarea.value.length);

                    wrap.querySelector('.reviewer-cancel-btn').addEventListener('click', function() {
                        wrap.replaceWith(titleEl);
                        _reviewerEditingTitle = false;
                    });

                    wrap.querySelector('.reviewer-save-btn').addEventListener('click', async function() {
                        const newTitle = textarea.value.trim();
                        if (!newTitle) return;
                        const ok = currentArticle.isCurrentEvent
                            ? await patchCurrentEventArticle(articleId, { headline: newTitle })
                            : await patchRegularArticle(articleId, { title: newTitle });
                        if (ok) {
                            titleEl.textContent = newTitle;
                            if (currentArticle.isCurrentEvent) { currentArticle.headline = newTitle; }
                            else { currentArticle.title = newTitle; }
                            document.title = newTitle + ' — JubileeVerse';
                        }
                        wrap.replaceWith(titleEl);
                        _reviewerEditingTitle = false;
                    });
                });
            }

            // ── Body editing ──────────────────────────────────────
            const bodyEl = document.querySelector('.article-body');
            if (bodyEl) {
                bodyEl.title = 'Double-click to edit content';
                bodyEl.style.cursor = 'text';

                bodyEl.addEventListener('dblclick', function() {
                    if (_reviewerEditingBody) return;
                    _reviewerEditingBody = true;
                    const renderedHTML = bodyEl.innerHTML;

                    const wrap = document.createElement('div');
                    wrap.className = 'reviewer-body-edit-wrap';
                    wrap.innerHTML = `
                        <p class="reviewer-body-hint">✏️ ${currentArticle.isCurrentEvent ? 'Editing raw Markdown — save to re-render' : 'Editing HTML content — save to update'}</p>
                        <textarea class="reviewer-body-textarea">${(rawContent || '').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</textarea>
                        <div class="reviewer-edit-actions">
                            <button class="reviewer-save-btn">Save Content</button>
                            <button class="reviewer-cancel-btn">Cancel</button>
                        </div>
                    `;
                    bodyEl.replaceWith(wrap);
                    const textarea = wrap.querySelector('textarea');
                    // Decode entities back to raw markdown in textarea value
                    textarea.value = rawContent || '';
                    textarea.focus();

                    wrap.querySelector('.reviewer-cancel-btn').addEventListener('click', function() {
                        bodyEl.innerHTML = renderedHTML;
                        wrap.replaceWith(bodyEl);
                        _reviewerEditingBody = false;
                        initReviewerEditing(articleId, rawContent);
                    });

                    wrap.querySelector('.reviewer-save-btn').addEventListener('click', async function() {
                        const newContent = textarea.value;
                        const ok = currentArticle.isCurrentEvent
                            ? await patchCurrentEventArticle(articleId, { full_article: newContent })
                            : await patchRegularArticle(articleId, { content: newContent });
                        if (ok) {
                            rawContent = newContent;
                            const rendered = formatArticleContent(newContent);
                            bodyEl.innerHTML = rendered;
                            if (currentArticle.isCurrentEvent) { currentArticle.full_article = newContent; }
                            else { currentArticle.content = newContent; }
                        } else {
                            bodyEl.innerHTML = renderedHTML;
                        }
                        wrap.replaceWith(bodyEl);
                        _reviewerEditingBody = false;
                        initReviewerEditing(articleId, rawContent);
                    });
                });
            }
        }

        function filterTranslateLanguages() {
            const query = (document.getElementById('translateSearchInput').value || '').toLowerCase().trim();
            const options = document.querySelectorAll('#translateOptionsContainer .translate-dropdown-option');
            let visibleCount = 0;
            options.forEach(opt => {
                const match = !query || opt.dataset.name.includes(query);
                opt.style.display = match ? '' : 'none';
                if (match) visibleCount++;
            });
            let noResults = document.getElementById('translateNoResults');
            if (visibleCount === 0) {
                if (!noResults) {
                    noResults = document.createElement('div');
                    noResults.id = 'translateNoResults';
                    noResults.className = 'translate-no-results';
                    noResults.textContent = 'No languages found';
                    document.getElementById('translateOptionsContainer').appendChild(noResults);

                noResults.style.display = '';
            } else if (noResults) {

        function toggleTranslateDropdown(e) {
            if (e) e.stopPropagation();
            const dd = document.getElementById('translateDropdown');
            if (!dd) return;
            const isOpen = dd.classList.contains('open');
            if (!isOpen) {
                // Determine if panel should open above or below
                const panel = document.getElementById('translateDropdownPanel');
                const trigger = document.getElementById('translateDropdownTrigger');
                if (panel && trigger) {
                    const rect = trigger.getBoundingClientRect();
                    const spaceBelow = window.innerHeight - rect.bottom;
                    const panelHeight = Math.min(372, TRANSLATE_LANGUAGES.length * 31);
                    if (spaceBelow < panelHeight && rect.top > panelHeight) {
                        panel.classList.add('panel-above');
                    } else {
                        panel.classList.remove('panel-above');
                    }
                }
            }
            dd.classList.toggle('open');
        }

            const dd = document.getElementById('translateDropdown');

        function selectTranslateLanguage(code, name) {
            const lbl = document.getElementById('translateDropdownLabel');
            if (lbl) lbl.textContent = name;
            document.querySelectorAll('.translate-dropdown-option').forEach(o => {
                o.classList.toggle('active', o.dataset.code === code);
            });
            closeTranslateDropdown();
            // Save as previous language in cookie (skip English — restoring original is not a "translation")
            if (code !== 'en-US') translateSetPrevLangCookie(code, name);
            onTranslateLangChange(code);
        }

        function translateSetPrevLangCookie(code, name) {
            const expires = new Date(Date.now() + 365 * 24 * 60 * 60 * 1000).toUTCString();
            document.cookie = `tl_prev_code=${encodeURIComponent(code)};expires=${expires};path=/`;
            document.cookie = `tl_prev_name=${encodeURIComponent(name)};expires=${expires};path=/`;
        }

        function translateGetPrevLangCookie() {
            const get = (key) => {
                const m = document.cookie.match(new RegExp('(?:^|; )' + key + '=([^;]*)'));
                return m ? decodeURIComponent(m[1]) : null;
            };
            const code = get('tl_prev_code');
            const name = get('tl_prev_name');
            return (code && name) ? { code, name } : null;
        }

        function translateUpdatePrevLangSection(isTranslated, currentLangName) {
            const section = document.getElementById('translatePrevLangSection');
            if (!section) return;
            section.innerHTML = '';
            const prev = translateGetPrevLangCookie();
            if (isTranslated) {
                const a = document.createElement('a');
                a.textContent = '↩ BACK TO: English (Original)';
                a.addEventListener('click', function(e) { e.preventDefault(); restoreOriginalArticle(); });
                section.appendChild(a);
            } else if (prev) {
                const label = document.createTextNode('⚡ TRANSLATE TO: ');
                const a = document.createElement('a');
                a.textContent = prev.name + ' (Previously Used)';
                a.addEventListener('click', function(e) {
                    e.preventDefault();
                    selectTranslateLanguage(prev.code, prev.name);
                });
                section.appendChild(label);
                section.appendChild(a);
            }
            section.style.display = section.childNodes.length ? 'block' : 'none';
        }

            const el = document.getElementById('translateStatus');
            const txt = document.getElementById('translateStatusText');
            if (el) el.style.display = 'flex';

        }
        function hideTranslateStatus() {
