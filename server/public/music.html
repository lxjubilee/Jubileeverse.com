<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="JubileeVerse Music - Christian worship, praise and inspirational music">
    <title>Music - JubileeVerse</title>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #1b1b1b;
            --bg-secondary: #242424;
            --bg-tertiary: #2d2d2d;
            --bg-card: #2d2d2d;
            --bg-card-hover: #3a3a3a;
            --text-primary: #ffffff;
            --text-secondary: #c4c4c4;
            --text-muted: #8a8a8a;
            --accent-gold: #E6AC00;
            --accent-gold-hover: #F5C518;
            --accent-green: #1db954;
            --border-color: rgba(255, 255, 255, 0.1);
            --header-height: 48px;
            --player-height: 80px;
            --card-radius: 8px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            overflow: hidden;
        }

        a { color: inherit; text-decoration: none; transition: color 0.2s; }
        a:hover { color: var(--accent-gold); }

        /* Header */
        .header {
            height: var(--header-height);
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-inner {
            max-width: 100%;
            margin: 0 auto;
            padding: 0 16px;
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
        }

        .logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .logo-text span { color: var(--accent-gold); }
        .logo-text .logo-verse { color: var(--accent-gold); }
        .logo-text .logo-dotcom { color: #ffffff; }

        .back-link {
            color: var(--text-secondary);
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 14px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            transition: all 0.15s;
        }

        .back-link:hover {
            color: var(--text-primary);
            background: var(--bg-tertiary);
        }

        /* Main Layout */
        .music-layout {
            display: grid;
            grid-template-columns: 280px 1fr 300px;
            height: calc(100vh - var(--header-height) - var(--player-height));
            overflow: hidden;
        }

        /* Left Sidebar */
        .library-sidebar {
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .library-header {
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .library-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .library-title svg { opacity: 0.7; }

        .library-add-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            border-radius: 50%;
            transition: all 0.15s;
            display: flex;
        }

        .library-add-btn:hover { color: var(--text-primary); background: var(--bg-tertiary); }

        .library-filters {
            padding: 0 16px 12px;
            display: flex;
            gap: 8px;
        }

        .filter-chip {
            background: var(--bg-tertiary);
            border: none;
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }

        .filter-chip:hover { background: var(--bg-card-hover); color: var(--text-primary); }
        .filter-chip.active { background: var(--accent-gold); color: #000; }

        .library-search {
            padding: 0 16px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .library-search-label {
            font-size: 12px;
            color: var(--text-muted);
        }

        .library-sort {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .library-sort:hover { color: var(--text-primary); }

        .album-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 8px;
        }

        .album-list::-webkit-scrollbar { width: 6px; }
        .album-list::-webkit-scrollbar-track { background: transparent; }
        .album-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
        .album-list::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

        .album-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .album-item:hover { background: var(--bg-tertiary); }
        .album-item.active { background: var(--bg-tertiary); border-left: 3px solid var(--accent-gold); }

        .album-item-art {
            width: 48px;
            height: 48px;
            border-radius: 4px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .album-item-info { flex: 1; min-width: 0; }

        .album-item-name {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .album-item.active .album-item-name { color: var(--accent-gold); }

        .album-item-artist {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .album-item-meta {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* Center Content */
        .main-content {
            overflow-y: auto;
            background: var(--bg-primary);
        }

        .main-content::-webkit-scrollbar { width: 8px; }
        .main-content::-webkit-scrollbar-track { background: transparent; }
        .main-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
        .main-content::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

        /* Album Banner */
        .album-banner {
            padding: 32px 32px 24px;
            display: flex;
            align-items: flex-end;
            gap: 24px;
            background: linear-gradient(135deg, #3a2d1a 0%, var(--bg-primary) 100%);
        }

        .album-banner-art {
            width: 220px;
            height: 220px;
            border-radius: 6px;
            object-fit: cover;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            flex-shrink: 0;
        }

        .album-banner-info {
            flex: 1;
            min-width: 0;
        }

        .album-banner-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .album-banner-title {
            font-size: 42px;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .album-banner-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: var(--text-secondary);
            flex-wrap: wrap;
        }

        .album-banner-artist {
            font-weight: 600;
            color: var(--text-primary);
        }

        .album-banner-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--text-muted);
        }

        .album-banner-listeners {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Album Actions */
        .album-actions {
            padding: 20px 32px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn-play-large {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--accent-gold);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            flex-shrink: 0;
        }

        .btn-play-large:hover { transform: scale(1.05); background: var(--accent-gold-hover); }

        .btn-play-large svg { color: #000; width: 24px; height: 24px; fill: #000; }

        .btn-shuffle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: transparent;
            border: 1px solid var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            color: var(--text-secondary);
        }

        .btn-shuffle:hover { border-color: var(--text-primary); color: var(--text-primary); }

        .btn-follow {
            padding: 6px 24px;
            border-radius: 20px;
            border: 1px solid var(--text-muted);
            background: transparent;
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }

        .btn-follow:hover { border-color: var(--text-primary); transform: scale(1.02); }
        .btn-follow.following { border-color: var(--accent-gold); color: var(--accent-gold); }

        .btn-more {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 8px;
            transition: color 0.15s;
        }

        .btn-more:hover { color: var(--text-primary); }

        /* Track List */
        .track-list {
            padding: 0 16px 100px;
        }

        .track-header {
            display: grid;
            grid-template-columns: 40px 1fr 80px;
            padding: 8px 16px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 4px;
        }

        .track-header span {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .track-header span:last-child { text-align: right; }

        .track-row {
            display: grid;
            grid-template-columns: 40px 1fr 80px;
            padding: 10px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.1s;
            align-items: center;
        }

        .track-row:hover { background: var(--bg-tertiary); }
        .track-row.playing { background: rgba(230, 172, 0, 0.08); }

        .track-num {
            font-size: 14px;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }

        .track-row.playing .track-num { color: var(--accent-gold); }

        .track-row:hover .track-num-text { display: none; }
        .track-row:hover .track-num-play { display: block; }
        .track-num-play { display: none; color: var(--text-primary); }

        .track-info { min-width: 0; }

        .track-title {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-row.playing .track-title { color: var(--accent-gold); }

        .track-duration {
            font-size: 13px;
            color: var(--text-muted);
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        /* Right Sidebar */
        .popular-sidebar {
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            overflow-y: auto;
            padding: 16px;
        }

        .popular-sidebar::-webkit-scrollbar { width: 6px; }
        .popular-sidebar::-webkit-scrollbar-track { background: transparent; }
        .popular-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

        .popular-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 16px;
        }

        .popular-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s;
            margin-bottom: 4px;
        }

        .popular-card:hover { background: var(--bg-tertiary); }

        .popular-card-art {
            width: 56px;
            height: 56px;
            border-radius: 4px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .popular-card-info { flex: 1; min-width: 0; }

        .popular-card-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .popular-card-artist {
            font-size: 12px;
            color: var(--text-muted);
        }

        .popular-card-listeners {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .popular-divider {
            height: 1px;
            background: var(--border-color);
            margin: 16px 0;
        }

        .popular-section-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        /* Sticky Footer Player */
        .music-player {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: var(--player-height);
            background: #181818;
            border-top: 1px solid var(--border-color);
            z-index: 1001;
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            align-items: center;
            padding: 0 16px;
        }

        /* Player Left - Track Info */
        .player-track-info {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .player-track-art {
            width: 56px;
            height: 56px;
            border-radius: 4px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .player-track-text { min-width: 0; }

        .player-track-name {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-track-artist {
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-track-like {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            flex-shrink: 0;
            transition: color 0.15s;
        }

        .player-track-like:hover { color: var(--accent-gold); }

        /* Player Center - Controls */
        .player-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .player-buttons {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .player-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px;
            transition: color 0.15s;
            display: flex;
            align-items: center;
        }

        .player-btn:hover { color: var(--text-primary); }
        .player-btn.active { color: var(--accent-gold); }

        .player-btn svg { width: 16px; height: 16px; }

        .player-btn-play {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--text-primary);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }

        .player-btn-play:hover { transform: scale(1.06); }
        .player-btn-play svg { width: 16px; height: 16px; fill: #000; color: #000; }

        .player-progress {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            max-width: 600px;
        }

        .player-time {
            font-size: 11px;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            min-width: 35px;
            text-align: center;
        }

        .progress-bar {
            flex: 1;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .progress-bar:hover { height: 6px; }

        .progress-fill {
            height: 100%;
            background: var(--text-secondary);
            border-radius: 2px;
            position: relative;
            transition: width 0.1s linear;
        }

        .progress-bar:hover .progress-fill { background: var(--accent-gold); }

        .progress-knob {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--text-primary);
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0;
            transition: opacity 0.15s;
        }

        .progress-bar:hover .progress-knob { opacity: 1; }

        /* Player Right - Volume */
        .player-volume {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
        }

        .volume-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px;
            display: flex;
            transition: color 0.15s;
        }

        .volume-btn:hover { color: var(--text-primary); }
        .volume-btn svg { width: 16px; height: 16px; }

        .volume-bar {
            width: 100px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .volume-bar:hover { height: 6px; }

        .volume-fill {
            height: 100%;
            width: 70%;
            background: var(--text-secondary);
            border-radius: 2px;
            position: relative;
        }

        .volume-bar:hover .volume-fill { background: var(--accent-gold); }

        .volume-knob {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--text-primary);
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0;
        }

        .volume-bar:hover .volume-knob { opacity: 1; }

        .player-extra-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            display: flex;
            transition: color 0.15s;
        }

        .player-extra-btn:hover { color: var(--text-primary); }
        .player-extra-btn svg { width: 16px; height: 16px; }

        /* Empty state */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
            padding: 40px;
        }

        .empty-state svg { margin-bottom: 16px; opacity: 0.3; }
        .empty-state h3 { font-size: 18px; color: var(--text-primary); margin-bottom: 8px; }
        .empty-state p { font-size: 14px; }

        /* Hamburger Button */
        .hamburger-btn {
            display: none;
            position: fixed;
            top: 56px;
            left: 16px;
            z-index: 1100;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 44px;
            height: 44px;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 0;
        }

        .hamburger-btn:hover {
            background: var(--bg-tertiary);
        }

        .hamburger-btn.active {
            left: 296px;
            background: var(--bg-tertiary);
        }

        .hamburger-icon {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            gap: 5px;
        }

        .hamburger-icon span {
            display: block;
            width: 20px;
            height: 2px;
            background: var(--text-primary);
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        .hamburger-btn.active .hamburger-icon span:nth-child(1) {
            transform: rotate(45deg) translate(6px, 6px);
        }

        .hamburger-btn.active .hamburger-icon span:nth-child(2) {
            opacity: 0;
        }

        .hamburger-btn.active .hamburger-icon span:nth-child(3) {
            transform: rotate(-45deg) translate(6px, -6px);
        }

        /* Mobile Sidebar Overlay */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1050;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .sidebar-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Mobile Accordion */
        .mobile-accordion {
            display: none;
            flex-direction: column;
            height: 100%;
            overflow-y: auto;
        }

        .accordion-section {
            border-bottom: 1px solid var(--border-color);
        }

        .accordion-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            cursor: pointer;
            transition: background 0.2s;
            user-select: none;
        }

        .accordion-header:hover {
            background: var(--bg-tertiary);
        }

        .accordion-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .accordion-title svg { opacity: 0.8; }

        .accordion-badge {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 500;
            padding: 2px 8px;
            border-radius: 12px;
            margin-left: auto;
            margin-right: 8px;
        }

        .accordion-toggle {
            transition: transform 0.3s;
            opacity: 0.6;
        }

        .accordion-toggle.expanded {
            transform: rotate(180deg);
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .accordion-content.expanded {
            max-height: none;
            overflow-y: auto;
        }

                // Arpeggio melody on each beat
                const arpIdx = arpPattern[bib];
                synthNote(midiFreq(chord[arpIdx] + 12), audioNextTime, beat * 0.6, wave, 0.07);

                // Higher accent on beats 2 and 4
                if (bib === 1 || bib === 3) {
                    const acIdx = arpPattern[(bib + 1) % 4];
                    synthNote(midiFreq(chord[acIdx] + 24), audioNextTime + beat * 0.25, beat * 0.3, 'sine', 0.025);
                }

                audioNextTime += beat;
                audioBeat++;
            }
        }

        function startAudioPlayback(albumIdx, trackIdx) {
            initAudioCtx();
            stopAudioPlayback();
            const cfg = ALBUM_AUDIO[albumIdx];
            audioConfig = {
                chords: cfg.chords,
                chordOrder: CHORD_ORDERS[trackIdx % CHORD_ORDERS.length],
                beat: 60 / cfg.bpm,
                wave: cfg.wave,
                arpPattern: ARP_PATTERNS[trackIdx % ARP_PATTERNS.length]
            };
            audioBeat = 0;
            audioNextTime = audioCtx.currentTime + 0.1;
            audioSchedulerId = setInterval(audioSchedule, 50);
        }

        function stopAudioPlayback() {
            if (audioSchedulerId) {
                clearInterval(audioSchedulerId);
                audioSchedulerId = null;
            }
        }

        function resumeAudioPlayback() {
            if (!audioCtx || !audioConfig) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            audioNextTime = audioCtx.currentTime + 0.1;
            audioSchedulerId = setInterval(audioSchedule, 50);
        }

        function setAudioVolume(vol) {
            audioVolume = Math.max(0, Math.min(1, vol));
            if (masterGain) masterGain.gain.value = audioVolume;
        }

        // ============================================
        // MOBILE SIDEBAR FUNCTIONS
        // ============================================

        function toggleMobileSidebar() {
            const sidebar = document.querySelector('.library-sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const hamburgerBtn = document.getElementById('hamburgerBtn');

            if (sidebar.classList.contains('active')) {
                closeMobileSidebar();
            } else {
                openMobileSidebar();
            }
        }

        function openMobileSidebar() {
            const sidebar = document.querySelector('.library-sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const hamburgerBtn = document.getElementById('hamburgerBtn');

            sidebar.classList.add('active');
            overlay.classList.add('active');
            hamburgerBtn.classList.add('active');

            if (window.innerWidth <= 768) {
                document.body.style.overflow = 'hidden';
            }
        }

        function closeMobileSidebar() {
            const sidebar = document.querySelector('.library-sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const hamburgerBtn = document.getElementById('hamburgerBtn');

            sidebar.classList.remove('active');
            overlay.classList.remove('active');
            hamburgerBtn.classList.remove('active');

            if (window.innerWidth <= 768) {
                document.body.style.overflow = 'auto';
            }
        }

        // ============================================
        // MOBILE ACCORDION FUNCTIONS
        // ============================================

        function toggleAccordion(section) {
            const content = document.getElementById(`${section}Content`);
            const toggle = document.getElementById(`${section}Toggle`);
            const isExpanded = content.classList.contains('expanded');

            // Close all sections first
            document.querySelectorAll('.accordion-content.expanded').forEach(el => {
                el.classList.remove('expanded');
            });
            document.querySelectorAll('.accordion-toggle.expanded').forEach(el => {
                el.classList.remove('expanded');
            });

            // If the clicked section wasn't open, open it
            if (!isExpanded) {
                content.classList.add('expanded');
                toggle.classList.add('expanded');
            }
        }

        function renderMobileAlbumList() {
            const container = document.getElementById('mobileAlbumList');
            if (!container) return;

            const badge = document.getElementById('albumsBadge');
            if (badge) badge.textContent = albums.length;

            container.innerHTML = albums.map((album, idx) => `
                <div class="album-item ${idx === currentAlbumIdx ? 'active' : ''}" onclick="selectAlbum(${idx}); closeMobileSidebar();" id="mobileAlbumItem${idx}">
                    <img class="album-item-art" src="${album.image}" alt="${album.name}" loading="lazy">
                    <div class="album-item-info">
                        <div class="album-item-name">${album.name}</div>
                        <div class="album-item-artist">Album &bull; ${album.artist}</div>
                    </div>
                </div>
            `).join('');
        }

        function renderMobilePopularList() {
            const container = document.getElementById('mobilePopularList');
            if (!container) return;

            const popular = [5, 6, 4, 1];
            const viral = [7, 3, 0, 2];

            container.innerHTML = `
                ${popular.map(idx => `
                    <div class="album-item" onclick="selectAlbum(${idx}); closeMobileSidebar();">
                        <img class="album-item-art" src="${albums[idx].image}" alt="${albums[idx].name}" loading="lazy">
                        <div class="album-item-info">
                            <div class="album-item-name">${albums[idx].name}</div>
                            <div class="album-item-artist">${albums[idx].artist}</div>
                        </div>
                    </div>
                `).join('')}
            `;
        }

        // ============================================
        // INITIALIZATION
        // ============================================

        document.addEventListener('DOMContentLoaded', () => {
            renderAlbumList();
            renderPopularSidebar();
            renderMobileAlbumList();
            renderMobilePopularList();

            // Check for album query parameter (from homepage music cards)
            const params = new URLSearchParams(window.location.search);
            const albumParam = params.get('album');
            if (albumParam !== null) {
                const idx = parseInt(albumParam);
                if (idx >= 0 && idx < albums.length) {
                    selectAlbum(idx);
                    playTrack(idx, 0);
                } else {
                    selectAlbum(0);
                }
            } else {
                selectAlbum(0);
            }
        });

        // ============================================
        // RENDER FUNCTIONS
        // ============================================

        function renderAlbumList() {
            const list = document.getElementById('albumList');
            list.innerHTML = albums.map((album, idx) => `
                <div class="album-item ${idx === currentAlbumIdx ? 'active' : ''}" onclick="selectAlbum(${idx})" id="albumItem${idx}">
                    <img class="album-item-art" src="${album.image}" alt="${album.name}" loading="lazy">
                    <div class="album-item-info">
                        <div class="album-item-name">${album.name}</div>
                        <div class="album-item-artist">Album &bull; ${album.artist}</div>
                    </div>
                </div>
            `).join('');
        }

        function renderPopularSidebar() {
            const sidebar = document.getElementById('popularSidebar');
            const popular = [5, 6, 4, 1]; // indices of popular albums
            const viral = [7, 3, 0, 2];

            sidebar.innerHTML = `
                <div class="popular-title">Popular Albums</div>
                ${popular.map(idx => renderPopularCard(idx)).join('')}
                <div class="popular-divider"></div>
                <div class="popular-section-title">Viral Worship</div>
                ${viral.map(idx => renderPopularCard(idx)).join('')}
            `;
        }

        function renderPopularCard(idx) {
            const album = albums[idx];
            return `
                <div class="popular-card" onclick="selectAlbum(${idx})">
                    <img class="popular-card-art" src="${album.image}" alt="${album.name}" loading="lazy">
                    <div class="popular-card-info">
                        <div class="popular-card-name">${album.name}</div>
                        <div class="popular-card-artist">${album.artist}</div>
                        <div class="popular-card-listeners">${album.listeners}</div>
                    </div>
                </div>
            `;
        }

        function selectAlbum(idx) {
            currentAlbumIdx = idx;
            const album = albums[idx];

            // Update sidebar active state (desktop + mobile)
            document.querySelectorAll('.album-item').forEach(el => {
                el.classList.remove('active');
            });
            const desktopItem = document.getElementById(`albumItem${idx}`);
            const mobileItem = document.getElementById(`mobileAlbumItem${idx}`);
            if (desktopItem) desktopItem.classList.add('active');
            if (mobileItem) mobileItem.classList.add('active');

            // Calculate total duration
            let totalSeconds = 0;
            album.tracks.forEach(t => {
                const parts = t.duration.split(':');
                totalSeconds += parseInt(parts[0]) * 60 + parseInt(parts[1]);
            });
            const totalMin = Math.floor(totalSeconds / 60);
            const totalSec = totalSeconds % 60;

            // Render center content
            const main = document.getElementById('mainContent');
            main.innerHTML = `
                <div class="album-banner">
                    <img class="album-banner-art" src="${album.image}" alt="${album.name}">
                    <div class="album-banner-info">
                        <div class="album-banner-label">Album</div>
                        <h1 class="album-banner-title">${album.name}</h1>
                        <div class="album-banner-meta">
                            <span class="album-banner-artist">${album.artist}</span>
                            <span class="album-banner-dot"></span>
                            <span>${album.year}</span>
                            <span class="album-banner-dot"></span>
                            <span>${album.tracks.length} songs, ${totalMin} min ${totalSec} sec</span>
                        </div>
                        <div class="album-banner-listeners">${album.listeners}</div>
                    </div>
                </div>
                <div class="album-actions">
                    <button class="btn-play-large" id="bannerPlayBtn" onclick="toggleBannerPlay(${idx})" title="Play">
                        <svg id="bannerPlayIcon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    </button>
                    <button class="btn-shuffle" onclick="shufflePlay(${idx})" title="Shuffle play">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
                    </button>
                    <button class="btn-follow" id="followBtn" onclick="toggleFollow(this)">Following</button>
                    <button class="btn-more" title="More options">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
                    </button>
                </div>
                <div class="track-list">
                    <div class="track-header">
                        <span>#</span>
                        <span>Title</span>
                        <span style="text-align:right">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                        </span>
                    </div>
                    ${album.tracks.map((track, ti) => `
                        <div class="track-row ${currentAlbumIdx === idx && currentTrackIdx === ti ? 'playing' : ''}" onclick="playTrack(${idx}, ${ti})" id="track${idx}_${ti}">
                            <div class="track-num">
                                <span class="track-num-text">${ti + 1}</span>
                                <span class="track-num-play">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                                </span>
                            </div>
                            <div class="track-info">
                                <div class="track-title">${track.title}</div>
                            </div>
                            <div class="track-duration">${track.duration}</div>
                        </div>
                    `).join('')}
                </div>
            `;
            main.scrollTop = 0;
        }

        // ============================================
        // PLAYBACK CONTROLS
        // ============================================

        function playTrack(albumIdx, trackIdx) {
            currentAlbumIdx = albumIdx;
            currentTrackIdx = trackIdx;
            isPlaying = true;

            const album = albums[albumIdx];
            const track = album.tracks[trackIdx];

            // Update player
            document.getElementById('playerArt').src = album.image;
            document.getElementById('playerTrackName').textContent = track.title;
            document.getElementById('playerArtist').textContent = album.artist;

            // Parse duration
            const parts = track.duration.split(':');
            const totalSec = parseInt(parts[0]) * 60 + parseInt(parts[1]);
            document.getElementById('playerDuration').textContent = track.duration;

            // Update play icon
            updatePlayIcon();

            // Reset and start progress
            currentProgress = 0;
            document.getElementById('progressFill').style.width = '0%';
            document.getElementById('playerElapsed').textContent = '0:00';

            clearInterval(progressInterval);
            progressInterval = setInterval(() => {
                if (!isPlaying) return;
                currentProgress += 1;
                const pct = Math.min((currentProgress / totalSec) * 100, 100);
                document.getElementById('progressFill').style.width = pct + '%';
                const m = Math.floor(currentProgress / 60);
                const s = currentProgress % 60;
                document.getElementById('playerElapsed').textContent = m + ':' + String(s).padStart(2, '0');

                if (currentProgress >= totalSec) {
                    nextTrack();
                }
            }, 1000);

            // Highlight active track
            document.querySelectorAll('.track-row').forEach(el => el.classList.remove('playing'));
            const activeRow = document.getElementById('track' + albumIdx + '_' + trackIdx);
            if (activeRow) activeRow.classList.add('playing');

            // Update sidebar
            renderAlbumList();

            // Start audio playback
            startAudioPlayback(albumIdx, trackIdx);
        }

        function togglePlay() {
            if (currentTrackIdx === -1) {
                if (currentAlbumIdx >= 0) playTrack(currentAlbumIdx, 0);
                return;
            }
            isPlaying = !isPlaying;
            if (isPlaying) {
                resumeAudioPlayback();
            } else {
                stopAudioPlayback();
            }
            updatePlayIcon();
        }

        function updatePlayIcon() {
            const playSvg = '<polygon points="5 3 19 12 5 21 5 3"/>';
            const pauseSvg = '<rect x="6" y="4" width="4" height="16" fill="currentColor"/><rect x="14" y="4" width="4" height="16" fill="currentColor"/>';

            const icon = document.getElementById('playIcon');
            icon.innerHTML = isPlaying ? pauseSvg : playSvg;

            const bannerIcon = document.getElementById('bannerPlayIcon');
            if (bannerIcon) {
                bannerIcon.innerHTML = isPlaying ? pauseSvg : playSvg;
            }
        }

        function toggleBannerPlay(idx) {
            if (isPlaying && currentAlbumIdx === idx) {
                togglePlay();
            } else {
                playTrack(idx, 0);
            }
        }

        function prevTrack() {
            if (currentAlbumIdx < 0) return;
            const album = albums[currentAlbumIdx];
            let newIdx = currentTrackIdx - 1;
            if (newIdx < 0) newIdx = album.tracks.length - 1;
            playTrack(currentAlbumIdx, newIdx);
        }

        function nextTrack() {
            if (currentAlbumIdx < 0) return;
            const album = albums[currentAlbumIdx];
            let newIdx;
            if (isShuffled) {
                newIdx = Math.floor(Math.random() * album.tracks.length);
            } else {
                newIdx = currentTrackIdx + 1;
                if (newIdx >= album.tracks.length) {
                    if (isRepeating) { newIdx = 0; }
                    else { clearInterval(progressInterval); stopAudioPlayback(); isPlaying = false; updatePlayIcon(); return; }
                }
            }
            playTrack(currentAlbumIdx, newIdx);
        }

        function toggleShuffle() {
            isShuffled = !isShuffled;
            document.getElementById('shuffleBtn').classList.toggle('active', isShuffled);
        }

        function toggleRepeat() {
            isRepeating = !isRepeating;
            document.getElementById('repeatBtn').classList.toggle('active', isRepeating);
        }

        function seekTrack(e) {
            if (currentTrackIdx < 0) return;
            const bar = document.getElementById('progressBar');
            const rect = bar.getBoundingClientRect();
            const pct = (e.clientX - rect.left) / rect.width;

            const track = albums[currentAlbumIdx].tracks[currentTrackIdx];
            const parts = track.duration.split(':');
            const totalSec = parseInt(parts[0]) * 60 + parseInt(parts[1]);

            currentProgress = Math.floor(pct * totalSec);
            document.getElementById('progressFill').style.width = (pct * 100) + '%';
            const m = Math.floor(currentProgress / 60);
            const s = currentProgress % 60;
            document.getElementById('playerElapsed').textContent = m + ':' + String(s).padStart(2, '0');
        }

        function shufflePlay(albumIdx) {
            isShuffled = true;
            document.getElementById('shuffleBtn').classList.add('active');
            const album = albums[albumIdx];
            const randomTrack = Math.floor(Math.random() * album.tracks.length);
            playTrack(albumIdx, randomTrack);
        }

        function toggleFollow(btn) {
            btn.classList.toggle('following');
            btn.textContent = btn.classList.contains('following') ? 'Following' : 'Follow';
        }

        function toggleLike() {
            const btn = document.querySelector('.player-track-like');
            const svg = btn.querySelector('svg');
            const isLiked = svg.getAttribute('fill') !== 'none';
            svg.setAttribute('fill', isLiked ? 'none' : 'var(--accent-gold)');
            svg.setAttribute('stroke', isLiked ? 'currentColor' : 'var(--accent-gold)');
            btn.style.color = isLiked ? '' : 'var(--accent-gold)';
        }

        // Volume controls
        function handleVolumeClick(e) {
            const bar = document.getElementById('volumeBar');
            const rect = bar.getBoundingClientRect();
            const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
            setAudioVolume(pct);
            document.querySelector('.volume-fill').style.width = (pct * 100) + '%';
        }

        let preMuteVolume = 0.7;
        function toggleMute() {
            if (audioVolume > 0) {
                preMuteVolume = audioVolume;
                setAudioVolume(0);
                document.querySelector('.volume-fill').style.width = '0%';
            } else {
                setAudioVolume(preMuteVolume);
                document.querySelector('.volume-fill').style.width = (preMuteVolume * 100) + '%';
            }
        }
    </script>
    <script src="/js/site-translate.js"></script>
</body>
</html>
