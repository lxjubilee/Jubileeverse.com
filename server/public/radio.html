<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="JubileeVerse Radio - Christian radio stations, podcasts, worship music and teaching">
    <title>Radio - JubileeVerse</title>
    <link rel="icon" type="image/png" href="/images/brand-logo.png">
    <link rel="apple-touch-icon" href="/images/brand-logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #1b1b1b;
            --bg-secondary: #242424;
            --bg-tertiary: #2d2d2d;
            --bg-card: #2d2d2d;
            --bg-card-hover: #3a3a3a;
            --text-primary: #ffffff;
            --text-secondary: #c4c4c4;
            --text-muted: #8a8a8a;
            --accent-gold: #E6AC00;
            --accent-gold-hover: #F5C518;
            --accent-red: #e74c3c;
            --border-color: rgba(255, 255, 255, 0.1);
            --header-height: 48px;
            --player-height: 80px;
            --card-radius: 8px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            overflow: hidden;
        }

        a { color: inherit; text-decoration: none; transition: color 0.2s; }
        a:hover { color: var(--accent-gold); }

        /* Header */
        .header {
            height: var(--header-height);
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-inner {
            max-width: 100%;
            margin: 0 auto;
            padding: 0 16px;
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
        }

        .logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .logo-text span { color: var(--accent-gold); }
        .logo-text .logo-verse { color: var(--accent-gold); }
        .logo-text .logo-dotcom { color: #ffffff; }

        .back-link {
            color: var(--text-secondary);
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 14px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            transition: all 0.15s;
        }

        .back-link:hover {
            color: var(--text-primary);
            background: var(--bg-tertiary);
        }

        /* Main Layout */
        .radio-layout {
            display: grid;
            grid-template-columns: 280px 1fr 300px;
            height: calc(100vh - var(--header-height) - var(--player-height));
            overflow: hidden;
        }

        /* Left Sidebar */
        .station-sidebar {
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .station-header {
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .station-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .station-title svg { opacity: 0.7; }

        .station-filters {
            padding: 0 16px 12px;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .filter-chip {
            background: var(--bg-tertiary);
            border: none;
            color: var(--text-secondary);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }

        .filter-chip:hover { background: var(--bg-card-hover); color: var(--text-primary); }
        .filter-chip.active { background: var(--accent-gold); color: #000; }

        .station-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 8px;
        }

        .station-list::-webkit-scrollbar { width: 6px; }
        .station-list::-webkit-scrollbar-track { background: transparent; }
        .station-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
        .station-list::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

        .station-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .station-item:hover { background: var(--bg-tertiary); }
        .station-item.active { background: var(--bg-tertiary); border-left: 3px solid var(--accent-gold); }

        .station-item-art {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        .station-item-info { flex: 1; min-width: 0; }

        .station-item-name {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .station-item.active .station-item-name { color: var(--accent-gold); }

        .station-item-category {
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .station-item-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-live { background: rgba(231,76,60,0.2); color: #e74c3c; }
        .badge-podcast { background: rgba(155,89,182,0.2); color: #bb8fce; }
        .badge-music { background: rgba(230,172,0,0.2); color: var(--accent-gold); }
        .badge-religious { background: rgba(46,204,113,0.2); color: #2ecc71; }

        /* Center Content */
        .main-content {
            overflow-y: auto;
            background: var(--bg-primary);
        }

        .main-content::-webkit-scrollbar { width: 8px; }
        .main-content::-webkit-scrollbar-track { background: transparent; }
        .main-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
        .main-content::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

        /* Station Banner */
        .station-banner {
            padding: 32px 32px 24px;
            display: flex;
            align-items: flex-end;
            gap: 24px;
            background: linear-gradient(135deg, #2d1a1a 0%, var(--bg-primary) 100%);
        }

        .station-banner.cat-live { background: linear-gradient(135deg, #3a1a1a 0%, var(--bg-primary) 100%); }
        .station-banner.cat-podcast { background: linear-gradient(135deg, #2d1a3a 0%, var(--bg-primary) 100%); }
        .station-banner.cat-music { background: linear-gradient(135deg, #3a2d1a 0%, var(--bg-primary) 100%); }
        .station-banner.cat-religious { background: linear-gradient(135deg, #1a3a2d 0%, var(--bg-primary) 100%); }

        .station-banner-art {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            flex-shrink: 0;
            border: 3px solid rgba(255,255,255,0.1);
        }

        .station-banner-info {
            flex: 1;
            min-width: 0;
        }

        .station-banner-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .station-banner-title {
            font-size: 38px;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 10px;
            color: var(--text-primary);
        }

        .station-banner-desc {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .station-banner-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-muted);
            flex-wrap: wrap;
        }

        .station-banner-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--text-muted);
        }

        /* Station Actions */
        .station-actions {
            padding: 20px 32px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn-play-large {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--accent-gold);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            flex-shrink: 0;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-play-large:hover { transform: scale(1.05); background: var(--accent-gold-hover); }
        .btn-play-large:active { transform: scale(0.95); }
        .btn-play-large svg { color: #000; width: 24px; height: 24px; fill: #000; pointer-events: none; }

        .btn-follow {
            padding: 6px 24px;
            border-radius: 20px;
            border: 1px solid var(--text-muted);
            background: transparent;
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            min-width: 44px;
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-follow:hover { border-color: var(--text-primary); transform: scale(1.02); }
        .btn-follow:active { transform: scale(0.95); }
        .btn-follow.following { border-color: var(--accent-gold); color: var(--accent-gold); }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 12px;
            border-radius: 12px;
            background: rgba(231,76,60,0.15);
            color: #e74c3c;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e74c3c;
            animation: livePulse 1.5s ease-in-out infinite;
        }

        @keyframes livePulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        /* Now Playing Section */
        .now-playing-section {
            padding: 0 32px 24px;
        }

        .now-playing-card {
            background: var(--bg-tertiary);
            border-radius: 12px;
            padding: 20px;
            border-left: 4px solid var(--accent-gold);
        }

        .now-playing-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--accent-gold);
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .now-playing-show {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .now-playing-host {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .now-playing-time {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Schedule Section */
        .schedule-section {
            padding: 0 32px 100px;
        }

        .schedule-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 16px;
        }

        .schedule-row {
            display: grid;
            grid-template-columns: 90px 1fr 150px;
            padding: 12px 16px;
            border-radius: 6px;
            transition: background 0.1s;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        .schedule-row:hover { background: var(--bg-tertiary); }

        .schedule-time {
            font-size: 13px;
            color: var(--accent-gold);
            font-weight: 500;
            font-variant-numeric: tabular-nums;
        }

        .schedule-info { min-width: 0; }

        .schedule-show {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .schedule-desc {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .schedule-host {
            font-size: 12px;
            color: var(--text-secondary);
            text-align: right;
        }

        /* Right Sidebar */
        .discover-sidebar {
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            overflow-y: auto;
            padding: 16px;
        }

        .discover-sidebar::-webkit-scrollbar { width: 6px; }
        .discover-sidebar::-webkit-scrollbar-track { background: transparent; }
        .discover-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

        .discover-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 16px;
        }

        .discover-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s;
            margin-bottom: 4px;
        }

        .discover-card:hover { background: var(--bg-tertiary); }

        .discover-card-art {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        .discover-card-info { flex: 1; min-width: 0; }

        .discover-card-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .discover-card-cat {
            font-size: 11px;
            color: var(--text-muted);
        }

        .discover-card-listeners {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .discover-divider {
            height: 1px;
            background: var(--border-color);
            margin: 16px 0;
        }

        .discover-section-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        /* Your Library Section */
        .library-section {
            margin-bottom: 20px;
        }

        .library-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            cursor: pointer;
            user-select: none;
            transition: background 0.15s;
            border-radius: 6px;
        }

        .library-header:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .library-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .library-toggle {
            color: var(--text-muted);
            transition: transform 0.2s;
        }

        .library-toggle.expanded {
            transform: rotate(180deg);
        }

        .library-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }

        .library-content.expanded {
            max-height: 500px;
            overflow-y: auto;
        }

        .library-empty {
            padding: 20px 16px;
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
        }

        .library-empty-icon {
            font-size: 32px;
            opacity: 0.3;
            margin-bottom: 8px;
        }

        .playlist-header {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            padding: 12px 16px 8px 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Heart Icon for Favorites */
        .station-heart-btn,
        .discover-heart-btn {
            background: none;
            border: none;
            padding: 8px;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .station-heart-btn:hover,
        .discover-heart-btn:hover {
            color: var(--accent-gold);
            transform: scale(1.1);
        }

        .station-heart-btn.favorited,
        .discover-heart-btn.favorited {
            color: var(--accent-gold);
        }

        .station-heart-btn svg,
        .discover-heart-btn svg {
            width: 18px;
            height: 18px;
        }

        /* Follow Button */
        .station-follow-btn {
            background: none;
            border: none;
            padding: 8px;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .station-follow-btn:hover {
            color: var(--text-primary);
            transform: scale(1.1);
        }

        .station-follow-btn.following {
            color: var(--accent-gold);
        }

        .station-follow-btn svg {
            width: 18px;
            height: 18px;
        }

        /* Remove button for library items (trash icon) */
        .discover-remove-btn {
            background: none;
            border: none;
            padding: 8px;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s;
            flex-shrink: 0;
            opacity: 0;
            pointer-events: none;
        }

        .discover-card:hover .discover-remove-btn {
            opacity: 1;
            pointer-events: auto;
        }

        .discover-remove-btn:hover {
            color: #ff4444;
            transform: scale(1.1);
        }

        .discover-remove-btn svg {
            width: 18px;
            height: 18px;
        }

        /* Banner heart button */
        .btn-heart {
            background: none;
            border: 1px solid var(--text-muted);
            color: var(--text-primary);
            padding: 6px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-heart:hover {
            border-color: var(--text-primary);
            transform: scale(1.02);
        }

        .btn-heart.favorited {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        .btn-heart svg {
            width: 16px;
            height: 16px;
        }

        /* Sticky Footer Player */
        .radio-player {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: var(--player-height);
            background: #181818;
            border-top: 1px solid var(--border-color);
            z-index: 1001;
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            align-items: center;
            padding: 0 16px;
        }

        /* Player Left */
        .player-station-info {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .player-station-art {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        .player-station-text { min-width: 0; }

        .player-station-name {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-station-show {
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-like-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            flex-shrink: 0;
            transition: color 0.15s;
        }

        .player-like-btn:hover { color: var(--accent-gold); }

        /* Player Center */
        .player-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .player-buttons {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .player-btn-play {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--text-primary);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }

        .player-btn-play:hover { transform: scale(1.06); }
        .player-btn-play svg { width: 18px; height: 18px; fill: #000; color: #000; }

        .player-live-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            color: #e74c3c;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .player-live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e74c3c;
            animation: livePulse 1.5s ease-in-out infinite;
        }

        .player-live-indicator.inactive {
            color: var(--text-muted);
        }

        .player-live-indicator.inactive .player-live-dot {
            background: var(--text-muted);
            animation: none;
        }

        /* Player Right - Volume */
        .player-volume {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
        }

        .volume-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px;
            display: flex;
            transition: color 0.15s;
        }

        .volume-btn:hover { color: var(--text-primary); }
        .volume-btn svg { width: 16px; height: 16px; }

        .volume-bar {
            width: 100px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .volume-bar:hover { height: 6px; }

        .volume-fill {
            height: 100%;
            width: 70%;
            background: var(--text-secondary);
            border-radius: 2px;
            position: relative;
        }

        .volume-bar:hover .volume-fill { background: var(--accent-gold); }

        .volume-knob {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--text-primary);
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0;
        }

        .volume-bar:hover .volume-knob { opacity: 1; }

        /* Empty state */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
            padding: 40px;
        }

        .empty-state svg { margin-bottom: 16px; opacity: 0.3; }
        .empty-state h3 { font-size: 18px; color: var(--text-primary); margin-bottom: 8px; }
        .empty-state p { font-size: 14px; }

        /* Mobile Accordion */
        .mobile-accordion {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .accordion-section {
            border-bottom: 1px solid var(--border-color);
        }

        .accordion-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            cursor: pointer;
            transition: background 0.2s;
            user-select: none;
        }

        .accordion-header:hover {
            background: var(--bg-tertiary);
        }

        .accordion-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .accordion-title svg {
            opacity: 0.8;
        }

        .accordion-badge {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 500;
            padding: 2px 8px;
            border-radius: 12px;
            margin-left: auto;
            margin-right: 8px;
        }

        .accordion-toggle {
            transition: transform 0.3s;
            opacity: 0.6;
        }

        .accordion-toggle.expanded {
            transform: rotate(180deg);
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .accordion-content.expanded {
            max-height: none;
            overflow-y: auto;
        }

        .accordion-content::-webkit-scrollbar { width: 6px; }
        .accordion-content::-webkit-scrollbar-track { background: transparent; }
        .accordion-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

        .accordion-filters {
            padding: 12px 16px 8px;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--border-color);
        }

        .accordion-list {
            padding: 8px;
        }

        .accordion-empty {
            padding: 32px 16px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
        }

        /* Responsive */
        /* Hamburger Menu Button */
        .hamburger-btn {
            display: none;
            position: fixed;
            top: 56px;
            left: 16px;
            z-index: 1100;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 44px;
            height: 44px;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .hamburger-btn:hover {
            background: var(--bg-tertiary);
            transform: scale(1.05);
        }

        .hamburger-btn:active {
            transform: scale(0.95);
        }

        .hamburger-btn.active {
            left: 296px;
            background: var(--bg-tertiary);
        }

        .hamburger-icon {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 20px;
        }

        .hamburger-icon span {
            display: block;
            width: 100%;
            height: 2px;
            background: var(--text-primary);
            border-radius: 2px;
            transition: all 0.3s;
        }

        .hamburger-btn.active .hamburger-icon span:nth-child(1) {
            transform: rotate(45deg) translate(6px, 6px);
        }

        .hamburger-btn.active .hamburger-icon span:nth-child(2) {
            opacity: 0;
        }

        .hamburger-btn.active .hamburger-icon span:nth-child(3) {
            transform: rotate(-45deg) translate(6px, -6px);
        }

        /* Mobile Sidebar Overlay */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: var(--header-height);
            left: 0;
            right: 0;
            bottom: var(--player-height);
            background: rgba(0, 0, 0, 0.7);
            z-index: 1050;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .sidebar-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        @media (max-width: 1024px) {
            .radio-layout { grid-template-columns: 280px 1fr; }
            .discover-sidebar { display: none; }
        }

        @media (max-width: 768px) {
            body {
                overflow-x: hidden;
                overflow-y: auto;
            }

            .hamburger-btn { display: flex; }
            .sidebar-overlay { display: block; }

            .radio-layout {
                grid-template-columns: 1fr;
                height: auto;
                min-height: calc(100vh - var(--header-height));
                overflow: visible;
                padding-bottom: calc(var(--player-height) + 20px);
            }

            .main-content {
                height: auto;
                overflow-y: visible;
                overflow-x: hidden;
            }

            .station-sidebar {
                position: fixed;
                top: var(--header-height);
                left: 0;
                bottom: 0;
                width: 300px;
                z-index: 1060;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
                box-shadow: 2px 0 8px rgba(0,0,0,0.3);
                padding-bottom: var(--player-height);
                overflow-y: auto;
            }

            .station-sidebar.active {
                transform: translateX(0);
            }

            /* Hide desktop sidebar structure on mobile */
            .station-header,
            .station-filters,
            .station-list {
                display: none !important;
            }

            /* Show mobile accordion */
            .mobile-accordion {
                display: flex !important;
            }

            .station-banner { padding: 20px 16px 16px; gap: 16px; }
            .station-banner-art { width: 120px; height: 120px; }
            .station-banner-title { font-size: 24px; }
            .station-actions { padding: 16px; }
            .now-playing-section { padding: 0 16px 16px; }
            .schedule-section { padding: 0 16px 16px; }
            .schedule-row { grid-template-columns: 70px 1fr; }
            .schedule-host { display: none; }
            .player-volume { display: none; }

            .radio-player {
                position: fixed !important;
                bottom: 0 !important;
                left: 0 !important;
                right: 0 !important;
                z-index: 1001 !important;
                grid-template-columns: 1fr 1fr;
                display: grid !important;
                height: var(--player-height) !important;
            }
        }
    </style>

        // ============================================
        // FAVORITES HELPER FUNCTIONS
        // ============================================

        // Helper: Get auth data from localStorage
        function getAuthData() {
            try {
                const authStr = localStorage.getItem('jubileeVerseAuth');
                if (!authStr) return null;
                const authData = JSON.parse(authStr);
                return authData.authenticated ? authData : null;
            } catch (error) {
                console.error('Error parsing auth data:', error);
                return null;
            }
        }

        // Helper: Get station ID (format: "station-0", "station-1", etc.)
        function getStationId(stationIdx) {
            return `station-${stationIdx}`;
        }

        // Helper: Get auth headers for API calls
        function getAuthHeaders() {
            const authData = getAuthData();
            if (!authData || !authData.tokens || !authData.tokens.access) {
                return {};
            }
            return {
                'Authorization': `Bearer ${authData.tokens.access}`,
                'Content-Type': 'application/json'
            };
        }

        // ============================================
        // AUDIO STREAMING ENGINE (HTML5 Audio)
        // ============================================

        let radioAudio = null;
        let audioVolume = 0.7;

        function startAudioPlayback(stationIdx) {
            stopAudioPlayback();
            const station = stations[stationIdx];
            if (!station.streamUrl) return;

            radioAudio = new Audio();
            radioAudio.crossOrigin = 'anonymous';
            radioAudio.volume = audioVolume;
            radioAudio.src = station.streamUrl;
            radioAudio.play().catch(err => {
                console.log('Stream playback error:', err.message);
            });
        }

        function stopAudioPlayback() {
            if (radioAudio) {
                radioAudio.pause();
                radioAudio.src = '';
                radioAudio = null;
            }
        }

        function resumeAudioPlayback() {
            if (radioAudio) {
                radioAudio.play().catch(err => {
                    console.log('Resume error:', err.message);
                });
            }
        }

        function setAudioVolume(vol) {
            audioVolume = Math.max(0, Math.min(1, vol));
            if (radioAudio) radioAudio.volume = audioVolume;
        }

        // ============================================
        // FAVORITES API FUNCTIONS
        // ============================================

        // Load favorites from localStorage or API
        async function loadUserFavorites() {
            const authData = getAuthData();

            if (authData) {
                // Logged in: load from database
                try {
                    const response = await fetch('/api/radio/favorites', {
                        headers: getAuthHeaders()
                    });

                    if (!response.ok) {
                        console.error('Failed to load favorites:', response.status);
                        loadFromLocalStorage();
                        return;
                    }

                    const data = await response.json();
                    if (data.success && data.favorites) {
                        userFavorites = new Set(data.favorites.map(f => f.station_id));
                        updateLibraryContent(data.favorites);
                        updatePlayerLikeButton();
                        renderStationList(); // Update heart icons in station list
                        renderMobileFavorites(); // Update mobile accordion
                    }
                } catch (error) {
                    console.error('Error loading favorites:', error);
                    loadFromLocalStorage();
                }
            } else {
                // Not logged in: load from localStorage
                loadFromLocalStorage();
            }
        }

        // Load favorites from localStorage
        function loadFromLocalStorage() {
            try {
                const stored = localStorage.getItem('jubileeVerseFavorites');
                if (stored) {
                    const favIds = JSON.parse(stored);
                    userFavorites = new Set(favIds);

                    // Convert to favorites format for UI
                    const favorites = favIds.map(stationId => {
                        const idx = parseInt(stationId.replace('station-', ''));
                        const station = stations[idx];
                        return {
                            station_id: stationId,
                            station_name: station.name,
                            station_category: station.category,
                            station_image: station.image
                        };
                    }).filter(f => f.station_name); // Filter out invalid stations

                    updateLibraryContent(favorites);
                } else {
                    userFavorites.clear();
                    updateLibraryContent([]);
                }
            } catch (error) {
                console.error('Error loading from localStorage:', error);
                userFavorites.clear();
                updateLibraryContent([]);
            }

            // Update player button state
            updatePlayerLikeButton();

            // Update heart icons in station list
            renderStationList();
            renderMobileFavorites();
        }

        // Save favorites to localStorage
        function saveToLocalStorage() {
            try {
                localStorage.setItem('jubileeVerseFavorites', JSON.stringify([...userFavorites]));
            } catch (error) {
                console.error('Error saving to localStorage:', error);
            }
        }

        // Toggle favorite (add or remove)
        async function toggleFavorite(event, stationIdx) {
            event.stopPropagation(); // Prevent station selection

            const authData = getAuthData();
            const station = stations[stationIdx];
            const stationId = getStationId(stationIdx);
            const isFavorited = userFavorites.has(stationId);

            // Optimistic UI update
            const btn = event.currentTarget;
            const svg = btn.querySelector('svg');

            if (isFavorited) {
                userFavorites.delete(stationId);
                btn.classList.remove('favorited');
                svg.setAttribute('fill', 'none');
                btn.title = 'Add to favorites';
            } else {
                userFavorites.add(stationId);
                btn.classList.add('favorited');
                svg.setAttribute('fill', 'currentColor');
                btn.title = 'Remove from favorites';
            }

            if (authData) {
                // Logged in: save to database
                try {
                    if (isFavorited) {
                        const response = await fetch(`/api/radio/favorites/${encodeURIComponent(stationId)}`, {
                            method: 'DELETE',
                            headers: getAuthHeaders()
                        });
                        if (!response.ok) throw new Error('Failed to remove favorite');
                    } else {
                        const response = await fetch('/api/radio/favorites', {
                            method: 'POST',
                            headers: getAuthHeaders(),
                            body: JSON.stringify({
                                station_id: stationId,
                                station_name: station.name,
                                station_category: station.category,
                                station_image: station.image
                            })
                        });
                        if (!response.ok) throw new Error('Failed to add favorite');
                    }

                    // Reload from database
                    await loadUserFavorites();
                    renderStationList();
                    renderMobileStationList();
                    renderMobileFavorites();

                } catch (error) {

        // Load follows from localStorage or API
        async function loadUserFollows() {
            const authData = getAuthData();

            if (authData) {
                // Logged in: load from database
                try {
                    const response = await fetch('/api/radio/follows', {
                        headers: getAuthHeaders()
                    });

                    if (!response.ok) {
                        console.error('Failed to load follows:', response.status);
                        loadFollowsFromLocalStorage();
                        return;
                    }

                    const data = await response.json();
                    if (data.success && data.follows) {
                        userFollows = new Set(data.follows.map(f => f.station_id));
                        updateFollowedStationsContent(data.follows);
                    }
                } catch (error) {
                    console.error('Error loading follows:', error);
                    loadFollowsFromLocalStorage();
                }
            } else {
                // Not logged in: load from localStorage
                loadFollowsFromLocalStorage();
            }
        }

        // Load follows from localStorage
        function loadFollowsFromLocalStorage() {
            console.log('[Follows] loadFollowsFromLocalStorage called');
            try {
                const stored = localStorage.getItem('jubileeVerseFollows');
                console.log('[Follows] Stored data:', stored);
                if (stored) {
                    const followIds = JSON.parse(stored);
                    console.log('[Follows] Follow IDs:', followIds);
                    userFollows = new Set(followIds);

                    // Convert to follows format for UI
                    const follows = followIds.map(stationId => {
                        const idx = parseInt(stationId.replace('station-', ''));
                        const station = stations[idx];
                        return {
                            station_id: stationId,
                            station_name: station.name,
                            station_category: station.category,
                            station_image: station.image
                        };
                    }).filter(f => f.station_name); // Filter out invalid stations

                    console.log('[Follows] Calling updateFollowedStationsContent with', follows.length, 'follows');
                    updateFollowedStationsContent(follows);
                } else {
                    console.log('[Follows] No stored follows, clearing');
                    userFollows.clear();
                    updateFollowedStationsContent([]);
                }
            } catch (error) {
                console.error('[Follows] Error loading from localStorage:', error);
                userFollows.clear();
                updateFollowedStationsContent([]);
            }
        }

        // Save follows to localStorage
        function saveFollowsToLocalStorage() {
            try {
                localStorage.setItem('jubileeVerseFollows', JSON.stringify([...userFollows]));
            } catch (error) {
                console.error('Error saving follows to localStorage:', error);
            }
        }

        // Toggle follow for a station (make it global)
        window.toggleFollow = async function(btnElement, stationIdx) {
            const authData = getAuthData();
            const station = stations[stationIdx];
            const stationId = getStationId(stationIdx);
            const isFollowed = userFollows.has(stationId);

            // Optimistic UI update
            if (isFollowed) {
                userFollows.delete(stationId);
                btnElement.classList.remove('following');
                btnElement.textContent = 'Follow';
            } else {
                userFollows.add(stationId);
                btnElement.classList.add('following');
                btnElement.textContent = 'Following';
            }

            if (authData) {
                // Logged in: save to database
                try {
                    if (isFollowed) {
                        const response = await fetch(`/api/radio/follows/${encodeURIComponent(stationId)}`, {
                            method: 'DELETE',
                            headers: getAuthHeaders()
                        });
                        if (!response.ok) throw new Error('Failed to unfollow');
                    } else {
                        const response = await fetch('/api/radio/follows', {
                            method: 'POST',
                            headers: getAuthHeaders(),
                            body: JSON.stringify({
                                station_id: stationId,
                                station_name: station.name,
                                station_category: station.category,
                                station_image: station.image
                            })
                        });
                        if (!response.ok) throw new Error('Failed to follow');
                    }

                    // Reload from database
                    await loadUserFollows();
                    renderMobileStationList();
                    renderMobileFollows();
                    renderMobileTrending();
                    renderMobileRecommended();
                } catch (error) {
                    console.error('Error toggling follow:', error);
                    // Revert on error
                    if (isFollowed) {
                        userFollows.add(stationId);
                        btnElement.classList.add('following');
                        btnElement.textContent = 'Following';
                    } else {
                        userFollows.delete(stationId);
                        btnElement.classList.remove('following');
                        btnElement.textContent = 'Follow';
                    }
                    alert('Failed to update follows. Please try again.');
                }
            } else {
                // Not logged in: save to localStorage
                saveFollowsToLocalStorage();
                await loadUserFollows();
                renderMobileStationList();
                renderMobileFollows();
                renderMobileTrending();
                renderMobileRecommended();
            }
        }

            if (window.innerWidth <= 768) {
                document.body.style.overflow = 'auto';
            } else {
                document.body.style.overflow = '';
            }
        }

        // ============================================
        // INITIALIZATION
        // ============================================

        document.addEventListener('DOMContentLoaded', async () => {
            console.log('[Init] Starting initialization');

            // First render UI to create DOM elements
            renderStationList();
            renderDiscoverSidebar();
            console.log('[Init] Rendered station list and discover sidebar');

            // Render mobile accordion (initial empty state)
            renderMobileStationList();

            // Then load favorites and follows
            console.log('[Init] Loading favorites...');
            await loadUserFavorites();
            console.log('[Init] Loading follows...');
            await loadUserFollows();
            console.log('[Init] Favorites and follows loaded');

            // Update mobile accordion with loaded data
            renderMobileFavorites();
            renderMobileFollows();
            renderMobileTrending();
            renderMobileRecommended();
            console.log('[Init] Updated mobile accordion');

            // Check for station query parameter
            const params = new URLSearchParams(window.location.search);
            const stationParam = params.get('station');
            if (stationParam !== null) {
                const idx = parseInt(stationParam);
                if (idx >= 0 && idx < stations.length) {
                    selectStation(idx);
                    playStation(idx);
                } else {
                    selectStation(0);
                }
            } else {
                selectStation(0);
            }
        });

        // ============================================
        // RENDER FUNCTIONS
        // ============================================

        function getCategoryBadge(cat) {
            const labels = { live: 'LIVE', podcast: 'PODCAST', music: 'MUSIC', religious: 'TEACHING' };
            return `<span class="station-item-badge badge-${cat}">${labels[cat]}</span>`;
        }

        function renderStationList() {
            const list = document.getElementById('stationList');
            const filtered = currentFilter === 'all' ? stations : stations.filter(s => s.category === currentFilter);

            list.innerHTML = filtered.map((station, i) => {
                const realIdx = stations.indexOf(station);
                const stationId = getStationId(realIdx);
                const isFavorited = userFavorites.has(stationId);

                return `
                    <div class="station-item ${realIdx === currentStationIdx ? 'active' : ''}" id="stationItem${realIdx}">
                        <img class="station-item-art" src="${station.image}" alt="${station.name}" loading="lazy" onclick="selectStation(${realIdx})">
                        <div class="station-item-info" onclick="selectStation(${realIdx})">
                            <div class="station-item-name">${station.name}</div>
                            <div class="station-item-category">${getCategoryBadge(station.category)} ${station.listeners}</div>
                        </div>
                        <button class="station-heart-btn ${isFavorited ? 'favorited' : ''}"
                                onclick="toggleFavorite(event, ${realIdx})"
                                title="${isFavorited ? 'Remove from favorites' : 'Add to favorites'}"
                                data-station-id="${stationId}">
                            <svg viewBox="0 0 24 24" fill="${isFavorited ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2">
                                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                            </svg>
                        </button>
                    </div>
                `;
            }).join('');
        }

        function filterStations(cat) {
            currentFilter = cat;
            // Update filter chips
            document.querySelectorAll('.filter-chip').forEach(chip => {
                chip.classList.toggle('active', chip.textContent.trim().toLowerCase() === cat || (cat === 'all' && chip.textContent.trim() === 'All'));
            });
            renderStationList();
        }

        function renderDiscoverSidebar() {
            const sidebar = document.getElementById('discoverSidebar');
            const librarySection = renderYourLibrary();
            const trending = [0, 2, 10, 13]; // K-LOVE, Moody Radio, ChristianHits, Abiding Sacred
            const recommended = [1, 3, 12, 15]; // BBN Radio, RefNet, ChristianPowerPraise, Bluegrass Hymns

            sidebar.innerHTML = `
                ${librarySection}
                <div class="discover-divider"></div>
                <div class="discover-title">Trending Stations</div>
                ${trending.map(idx => renderDiscoverCard(idx)).join('')}
                <div class="discover-divider"></div>
                <div class="discover-section-title">Recommended For You</div>
                ${recommended.map(idx => renderDiscoverCard(idx)).join('')}
            `;
        }

        function renderDiscoverCard(idx) {
            const station = stations[idx];
            return `
                <div class="discover-card" onclick="selectStation(${idx})">
                    <img class="discover-card-art" src="${station.image}" alt="${station.name}" loading="lazy">
                    <div class="discover-card-info">
                        <div class="discover-card-name">${station.name}</div>
                        <div class="discover-card-cat">${station.category.charAt(0).toUpperCase() + station.category.slice(1)}</div>
                        <div class="discover-card-listeners">${station.listeners}</div>
                    </div>
                </div>
            `;
        }

        function selectStation(idx) {
            currentStationIdx = idx;
            const station = stations[idx];
            const catClass = 'cat-' + station.category;

            // Close mobile sidebar when station is selected
            if (window.innerWidth <= 768) {
                closeMobileSidebar();
            }

            // Update sidebar active state
            document.querySelectorAll('.station-item').forEach(el => el.classList.remove('active'));
            const activeItem = document.getElementById('stationItem' + idx);
            if (activeItem) activeItem.classList.add('active');

            // Render center content
            const main = document.getElementById('mainContent');
            main.innerHTML = `
                <div class="station-banner ${catClass}">
                    <img class="station-banner-art" src="${station.image}" alt="${station.name}">
                    <div class="station-banner-info">
                        <div class="station-banner-label">
                            ${getCategoryBadge(station.category)} Radio Station
                        </div>
                        <h1 class="station-banner-title">${station.name}</h1>
                        <div class="station-banner-desc">${station.description}</div>
                        <div class="station-banner-meta">
                            <span>${station.listeners}</span>
                            <span class="station-banner-dot"></span>
                            <span>${station.category === 'live' || station.category === 'music' ? '24/7 Broadcast' : 'On Demand'}</span>
                        </div>
                    </div>
                </div>

                <div class="station-actions">
                    <button class="btn-play-large" id="bannerPlayBtn" onclick="toggleBannerPlay(${idx})" title="Play">
                        <svg id="bannerPlayIcon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    </button>
                    <div class="live-badge">
                        <span class="live-dot"></span>
                        ${station.category === 'live' ? 'LIVE NOW' : 'ON AIR'}
                    </div>
                    <button class="btn-follow ${userFollows.has(getStationId(idx)) ? 'following' : ''}" onclick="toggleFollow(this, ${idx})">${userFollows.has(getStationId(idx)) ? 'Following' : 'Follow'}</button>
                </div>

                <div class="now-playing-section">
                    <div class="now-playing-card">
                        <div class="now-playing-label">Now Playing</div>
                        <div class="now-playing-show">${station.currentShow.name}</div>
                        <div class="now-playing-host">Hosted by ${station.currentShow.host}</div>
                        <div class="now-playing-time">${station.currentShow.time}</div>
                    </div>
                </div>

                <div class="schedule-section">
                    <div class="schedule-title">${station.category === 'podcast' || station.category === 'religious' ? 'Recent Episodes' : 'Today\'s Schedule'}</div>
                    ${station.schedule.map(item => `
                        <div class="schedule-row">
                            <div class="schedule-time">${item.time}</div>
                            <div class="schedule-info">
                                <div class="schedule-show">${item.show}</div>
                                <div class="schedule-desc">${item.desc}</div>
                            </div>
                            <div class="schedule-host">${item.host}</div>
                        </div>
                    `).join('')}
                </div>
            `;
            main.scrollTop = 0;

            // Update footer player info
            document.getElementById('playerArt').src = station.image;
            document.getElementById('playerStationName').textContent = station.name;
            document.getElementById('playerShowName').textContent = station.currentShow.name;

            // Update player like button state
            updatePlayerLikeButton();
        }

        // ============================================
        // PLAYBACK CONTROLS
        // ============================================

        function playStation(idx) {
            currentStationIdx = idx;
            isPlaying = true;
            const station = stations[idx];

            // Update player
            document.getElementById('playerArt').src = station.image;
            document.getElementById('playerStationName').textContent = station.name;
            document.getElementById('playerShowName').textContent = station.currentShow.name;

            // Update play icon
            updatePlayIcon();

            // Update live indicator
            const indicator = document.getElementById('liveIndicator');
            indicator.classList.remove('inactive');

            // Update sidebar
            renderStationList();

            // Start audio
            startAudioPlayback(idx);
        }

        function togglePlay() {
            if (currentStationIdx === -1) {
                if (stations.length > 0) playStation(0);
                return;
            }
            isPlaying = !isPlaying;
            if (isPlaying) {
                resumeAudioPlayback();
                document.getElementById('liveIndicator').classList.remove('inactive');
            } else {
                stopAudioPlayback();
                document.getElementById('liveIndicator').classList.add('inactive');
            }
            updatePlayIcon();
        }

        function updatePlayIcon() {
            const playSvg = '<polygon points="5 3 19 12 5 21 5 3"/>';
            const pauseSvg = '<rect x="6" y="4" width="4" height="16" fill="currentColor"/><rect x="14" y="4" width="4" height="16" fill="currentColor"/>';

            const icon = document.getElementById('playIcon');
            icon.innerHTML = isPlaying ? pauseSvg : playSvg;

            const bannerIcon = document.getElementById('bannerPlayIcon');
            if (bannerIcon) {
                bannerIcon.innerHTML = isPlaying ? pauseSvg : playSvg;
            }
        }

        function toggleBannerPlay(idx) {
            if (isPlaying && currentStationIdx === idx) {
                togglePlay();
            } else {
                playStation(idx);
            }
        }

        function toggleFollow(btn) {
            btn.classList.toggle('following');
            btn.textContent = btn.classList.contains('following') ? 'Following' : 'Follow';
        }

        function toggleLike() {
            // Toggle favorite for the currently playing station
            if (currentStationIdx >= 0 && currentStationIdx < stations.length) {
                // Create a fake event to pass to toggleFavorite
                const fakeEvent = {
                    stopPropagation: () => {},
                    currentTarget: document.querySelector('.player-like-btn')
                };
                toggleFavorite(fakeEvent, currentStationIdx);
            }
        }

        // Update player like button state
        function updatePlayerLikeButton() {
            const btn = document.querySelector('.player-like-btn');
            if (!btn) return;

            const svg = btn.querySelector('svg');
            const stationId = getStationId(currentStationIdx);
            const isFavorited = userFavorites.has(stationId);

            svg.setAttribute('fill', isFavorited ? 'currentColor' : 'none');
            svg.setAttribute('stroke', 'currentColor');
            btn.style.color = isFavorited ? 'var(--accent-gold)' : '';
            btn.title = isFavorited ? 'Remove from favorites' : 'Add to favorites';
        }

        // Volume controls
        function handleVolumeClick(e) {
            const bar = document.getElementById('volumeBar');
            const rect = bar.getBoundingClientRect();
            const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
            setAudioVolume(pct);
            document.querySelector('.volume-fill').style.width = (pct * 100) + '%';
        }

        let preMuteVolume = 0.7;
        function toggleMute() {
            if (audioVolume > 0) {
                preMuteVolume = audioVolume;
                setAudioVolume(0);
                document.querySelector('.volume-fill').style.width = '0%';
            } else {
                setAudioVolume(preMuteVolume);
                document.querySelector('.volume-fill').style.width = (preMuteVolume * 100) + '%';
            }
        }
    </script>
    <script src="/js/site-translate.js"></script>
</body>
</html>
