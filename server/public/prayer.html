<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="JubileeVerse Prayer - Guided Christian prayers for every moment of your day">
    <title>Prayer - JubileeVerse</title>
    <link rel="icon" type="image/png" href="/images/brand-logo.png">
    <link rel="apple-touch-icon" href="/images/brand-logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #1b1b1b;
            --bg-secondary: #242424;
            --bg-tertiary: #2d2d2d;
            --bg-card: #2d2d2d;
            --bg-card-hover: #3a3a3a;
            --text-primary: #ffffff;
            --text-secondary: #c4c4c4;
            --text-muted: #8a8a8a;
            --accent-gold: #E6AC00;
            --accent-gold-hover: #F5C518;
            --accent-red: #e74c3c;
            --border-color: rgba(255, 255, 255, 0.1);
            --header-height: 48px;
            --player-height: 80px;
            --card-radius: 8px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            overflow: hidden;
        }

        a { color: inherit; text-decoration: none; transition: color 0.2s; }
        a:hover { color: var(--accent-gold); }

        /* Header */
        .header {
            height: var(--header-height);
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-inner {
            max-width: 100%;
            margin: 0 auto;
            padding: 0 16px;
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
        }

        .logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .logo-text span { color: var(--accent-gold); }
        .logo-text .logo-verse { color: var(--accent-gold); }
        .logo-text .logo-dotcom { color: #ffffff; }

        .back-link {
            color: var(--text-secondary);
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 14px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            transition: all 0.15s;
        }

        .back-link:hover {
            color: var(--text-primary);
            background: var(--bg-tertiary);
        }

        /* Main Layout */
        .prayer-layout {
            display: grid;
            grid-template-columns: 280px 1fr 300px;
            height: calc(100vh - var(--header-height) - var(--player-height));
            overflow: hidden;
        }

        /* Left Sidebar */
        .prayer-sidebar {
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .prayer-sidebar-header {
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .prayer-sidebar-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .prayer-sidebar-title svg { opacity: 0.7; }

        .prayer-filters {
            padding: 0 16px 12px;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .filter-chip {
            background: var(--bg-tertiary);
            border: none;
            color: var(--text-secondary);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }

        .filter-chip:hover { background: var(--bg-card-hover); color: var(--text-primary); }
        .filter-chip.active { background: var(--accent-gold); color: #000; }

        .prayer-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 8px;
        }

        .prayer-list::-webkit-scrollbar { width: 6px; }
        .prayer-list::-webkit-scrollbar-track { background: transparent; }
        .prayer-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
        .prayer-list::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

        .prayer-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .prayer-item:hover { background: var(--bg-tertiary); }
        .prayer-item.active { background: var(--bg-tertiary); border-left: 3px solid var(--accent-gold); }

        .prayer-item-art {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .prayer-item-info { flex: 1; min-width: 0; }

        .prayer-item-name {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .prayer-item.active .prayer-item-name { color: var(--accent-gold); }

        .prayer-item-meta {
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .prayer-item-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-morning { background: rgba(255,183,77,0.2); color: #ffb74d; }
        .badge-evening { background: rgba(121,134,203,0.2); color: #7986cb; }
        .badge-healing { background: rgba(129,199,132,0.2); color: #81c784; }
        .badge-comfort { background: rgba(186,104,200,0.2); color: #ba68c8; }
        .badge-gratitude { background: rgba(230,172,0,0.2); color: var(--accent-gold); }
        .badge-protection { background: rgba(231,76,60,0.2); color: #e74c3c; }
        .badge-guidance { background: rgba(79,195,247,0.2); color: #4fc3f7; }
        .badge-family { background: rgba(240,98,146,0.2); color: #f06292; }

        /* Center Content */
        .main-content {
            overflow-y: auto;
            background: var(--bg-primary);
        }

        .main-content::-webkit-scrollbar { width: 8px; }
        .main-content::-webkit-scrollbar-track { background: transparent; }
        .main-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
        .main-content::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

        /* Prayer Banner */
        .prayer-banner {
            padding: 32px 32px 24px;
            display: flex;
            align-items: flex-end;
            gap: 24px;
            background: linear-gradient(135deg, #2d1a1a 0%, var(--bg-primary) 100%);
        }

        .prayer-banner.cat-morning { background: linear-gradient(135deg, #3a2d1a 0%, var(--bg-primary) 100%); }
        .prayer-banner.cat-evening { background: linear-gradient(135deg, #1a1a3a 0%, var(--bg-primary) 100%); }
        .prayer-banner.cat-healing { background: linear-gradient(135deg, #1a3a1a 0%, var(--bg-primary) 100%); }
        .prayer-banner.cat-comfort { background: linear-gradient(135deg, #2d1a3a 0%, var(--bg-primary) 100%); }
        .prayer-banner.cat-gratitude { background: linear-gradient(135deg, #3a2d1a 0%, var(--bg-primary) 100%); }
        .prayer-banner.cat-protection { background: linear-gradient(135deg, #3a1a1a 0%, var(--bg-primary) 100%); }
        .prayer-banner.cat-guidance { background: linear-gradient(135deg, #1a2d3a 0%, var(--bg-primary) 100%); }
        .prayer-banner.cat-family { background: linear-gradient(135deg, #3a1a2d 0%, var(--bg-primary) 100%); }

        .prayer-banner-art {
            width: 200px;
            height: 200px;
            border-radius: 12px;
            object-fit: cover;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            flex-shrink: 0;
            border: 3px solid rgba(255,255,255,0.1);
        }

        .prayer-banner-info {
            flex: 1;
            min-width: 0;
        }

        .prayer-banner-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .prayer-banner-title {
            font-size: 38px;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 10px;
            color: var(--text-primary);
        }

        .prayer-banner-desc {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .prayer-banner-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-muted);
            flex-wrap: wrap;
        }

        .prayer-banner-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--text-muted);
        }

        /* Prayer Actions */
        .prayer-actions {
            padding: 20px 32px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn-play-large {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--accent-gold);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            flex-shrink: 0;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-play-large:hover { transform: scale(1.05); background: var(--accent-gold-hover); }
        .btn-play-large:active { transform: scale(0.95); }
        .btn-play-large svg { color: #000; width: 24px; height: 24px; fill: #000; pointer-events: none; }

        .btn-follow {
            padding: 6px 24px;
            border-radius: 20px;
            border: 1px solid var(--text-muted);
            background: transparent;
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            min-width: 44px;
            min-height: 44px;
        }

        .btn-follow:hover { border-color: var(--text-primary); transform: scale(1.02); }
        .btn-follow:active { transform: scale(0.95); }
        .btn-follow.following { border-color: var(--accent-gold); color: var(--accent-gold); }

        .voice-selector {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-left: auto;
            background: var(--bg-tertiary);
            border-radius: 24px;
            padding: 3px;
        }

        .voice-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            min-width: 44px;
            min-height: 44px;
        }

        .voice-btn:hover { color: var(--text-primary); }
        .voice-btn:active { transform: scale(0.95); }

        .voice-btn.active {
            background: var(--accent-gold);
            color: #000;
        }

        .voice-btn svg { width: 16px; height: 16px; pointer-events: none; }

        .voice-selector-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            padding: 0 8px;
            white-space: nowrap;
        }

        .duration-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 12px;
            border-radius: 12px;
            background: rgba(230,172,0,0.15);
            color: var(--accent-gold);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Scripture Section */
        .scripture-section {
            padding: 0 32px 24px;
        }

        .scripture-card {
            background: var(--bg-tertiary);
            border-radius: 12px;
            padding: 20px;
            border-left: 4px solid var(--accent-gold);
        }

        .scripture-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--accent-gold);
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .scripture-text {
            font-size: 16px;
            font-style: italic;
            color: var(--text-primary);
            margin-bottom: 6px;
            line-height: 1.6;
        }

        .scripture-ref {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        /* Prayer Text Section */
        .prayer-text-section {
            padding: 0 32px 100px;
        }

        .prayer-text-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .prayer-text-body {
            background: var(--bg-tertiary);
            border-radius: 12px;
            padding: 24px;
            font-size: 16px;
            line-height: 1.8;
            color: var(--text-secondary);
            white-space: pre-line;
        }

        .prayer-text-body .prayer-line {
            margin-bottom: 12px;
            transition: color 0.3s;
        }

        .prayer-text-body .prayer-line.speaking {
            color: var(--accent-gold);
            font-weight: 500;
        }

        /* Right Sidebar */
        .discover-sidebar {
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            overflow-y: auto;
            padding: 16px;
        }

        .discover-sidebar::-webkit-scrollbar { width: 6px; }
        .discover-sidebar::-webkit-scrollbar-track { background: transparent; }
        .discover-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

        .discover-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 16px;
        }

        .discover-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s;
            margin-bottom: 4px;
        }

        .discover-card:hover { background: var(--bg-tertiary); }

        .discover-card-art {
            width: 52px;
            height: 52px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .discover-card-info { flex: 1; min-width: 0; }

        .discover-card-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .discover-card-cat {
            font-size: 11px;
            color: var(--text-muted);
        }

        .discover-card-duration {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .discover-divider {
            height: 1px;
            background: var(--border-color);
            margin: 16px 0;
        }

        .discover-section-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        /* Your Library Section */
        .library-section {
            margin-bottom: 20px;
        }

        .library-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            cursor: pointer;
            user-select: none;
            transition: background 0.15s;
            border-radius: 6px;
        }

        .library-header:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .library-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .library-toggle {
            color: var(--text-muted);
            transition: transform 0.2s;
        }

        .library-toggle.expanded {
            transform: rotate(180deg);
        }

        .library-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }

        .library-content.expanded {
            max-height: 500px;
            overflow-y: auto;
        }

        .library-empty {
            padding: 20px 16px;
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
        }

        .library-empty-icon {
            font-size: 32px;
            opacity: 0.3;
            margin-bottom: 8px;
        }

        .playlist-header {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            padding: 12px 16px 8px 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Heart Icon for Favorites */
        .discover-heart-btn {
            background: none;
            border: none;
            padding: 8px;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .discover-heart-btn:hover {
            color: var(--accent-gold);
            transform: scale(1.1);
        }

        .discover-heart-btn.favorited {
            color: var(--accent-gold);
        }

        .discover-heart-btn svg {
            width: 18px;
            height: 18px;
        }

        /* Remove button for library items (trash icon) */
        .discover-remove-btn {
            background: none;
            border: none;
            padding: 8px;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s;
            flex-shrink: 0;
            opacity: 0;
            pointer-events: none;
        }

        .discover-card:hover .discover-remove-btn {
            opacity: 1;
            pointer-events: auto;
        }

        .discover-remove-btn:hover {
            color: #ff4444;
            transform: scale(1.1);
        }

        .discover-remove-btn svg {
            width: 18px;
            height: 18px;
        }

        /* Sticky Footer Player */
        .prayer-player {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: var(--player-height);
            background: #181818;
            border-top: 1px solid var(--border-color);
            z-index: 1070;
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            align-items: center;
            padding: 0 16px;
        }

        /* Player Left */
        .player-prayer-info {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .player-prayer-art {
            width: 56px;
            height: 56px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .player-prayer-text { min-width: 0; }

        .player-prayer-name {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-prayer-category {
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-like-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            flex-shrink: 0;
            transition: color 0.15s;
        }

        .player-like-btn:hover { color: var(--accent-gold); }

        /* Player Center */
        .player-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .player-buttons {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .player-btn-secondary {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 8px;
            display: flex;
            transition: color 0.15s;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            min-width: 44px;
            min-height: 44px;
            align-items: center;
            justify-content: center;
        }

        .player-btn-secondary:hover { color: var(--text-primary); }
        .player-btn-secondary:active { opacity: 0.7; }
        .player-btn-secondary svg { width: 18px; height: 18px; pointer-events: none; }

        .player-btn-play {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--text-primary);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .player-btn-play:hover { transform: scale(1.06); }
        .player-btn-play:active { transform: scale(0.95); }
        .player-btn-play svg { width: 18px; height: 18px; fill: #000; color: #000; pointer-events: none; }

        /* Progress Bar */
        .player-progress-row {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            max-width: 500px;
        }

        .player-time {
            font-size: 11px;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            min-width: 36px;
            text-align: center;
        }

        .progress-bar {
            flex: 1;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .progress-bar:hover { height: 6px; }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--text-secondary);
            border-radius: 2px;
            position: relative;
            transition: width 0.1s linear;
        }

        .progress-bar:hover .progress-fill { background: var(--accent-gold); }

        .progress-knob {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--text-primary);
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0;
        }

        .progress-bar:hover .progress-knob { opacity: 1; }

        /* Player Right - Volume & Speed */
        .player-right {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
        }

        .speed-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            font-family: inherit;
            transition: all 0.15s;
        }

        .speed-btn:hover { background: rgba(255,255,255,0.2); color: var(--text-primary); }

        .volume-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px;
            display: flex;
            transition: color 0.15s;
        }

        .volume-btn:hover { color: var(--text-primary); }
        .volume-btn svg { width: 16px; height: 16px; }

        .volume-bar {
            width: 100px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .volume-bar:hover { height: 6px; }

        .volume-fill {
            height: 100%;
            width: 70%;
            background: var(--text-secondary);
            border-radius: 2px;
            position: relative;
        }

        .volume-bar:hover .volume-fill { background: var(--accent-gold); }

        .volume-knob {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--text-primary);
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0;
        }

        .volume-bar:hover .volume-knob { opacity: 1; }

        /* Empty state */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
            padding: 40px;
        }

        .empty-state svg { margin-bottom: 16px; opacity: 0.3; }
        .empty-state h3 { font-size: 18px; color: var(--text-primary); margin-bottom: 8px; }
        .empty-state p { font-size: 14px; }

        /* Favorite Icon in Prayer List */
        .prayer-item-fav {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            flex-shrink: 0;
            transition: color 0.2s, transform 0.15s;
            display: flex;
            align-items: center;
        }

        .prayer-item-fav:hover { color: var(--accent-gold); transform: scale(1.15); }
        .prayer-item-fav.favorited { color: var(--accent-gold); }
        .prayer-item-fav.favorited svg { fill: var(--accent-gold); }

        /* Favorites Button (before voice-selector) */
        .btn-favorites {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--text-muted);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            position: relative;
            flex-shrink: 0;
        }

        .btn-favorites:hover { border-color: var(--accent-gold); color: var(--accent-gold); }
        .btn-favorites svg { width: 18px; height: 18px; }

        .btn-favorites .fav-count {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--accent-gold);
            color: #000;
            font-size: 9px;
            font-weight: 700;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Favorites Panel */
        .favorites-panel {
            position: fixed;
            top: 0;
            right: -360px;
            width: 360px;
            height: 100vh;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            transition: right 0.3s ease;
            box-shadow: -4px 0 24px rgba(0,0,0,0.4);
        }

        .favorites-panel.open { right: 0; }

        .favorites-panel-header {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .favorites-panel-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .favorites-panel-title svg { color: var(--accent-gold); }

        .favorites-panel-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            display: flex;
            transition: color 0.15s;
        }

        .favorites-panel-close:hover { color: var(--text-primary); }

        .favorites-panel-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .favorites-panel-list::-webkit-scrollbar { width: 6px; }
        .favorites-panel-list::-webkit-scrollbar-track { background: transparent; }
        .favorites-panel-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

        .fav-panel-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .fav-panel-item:hover { background: var(--bg-tertiary); }

        .fav-panel-item-art {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .fav-panel-item-info { flex: 1; min-width: 0; }

        .fav-panel-item-name {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .fav-panel-item-meta {
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .fav-panel-remove {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 6px;
            border-radius: 4px;
            display: flex;
            transition: all 0.15s;
            flex-shrink: 0;
        }

        .fav-panel-remove:hover { color: var(--accent-red); background: rgba(231,76,60,0.1); }

        .favorites-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
            padding: 40px;
        }

        .favorites-empty svg { margin-bottom: 12px; opacity: 0.3; }
        .favorites-empty p { font-size: 14px; line-height: 1.5; }

        .favorites-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .favorites-overlay.visible { opacity: 1; pointer-events: auto; }

        /* Mobile Hamburger Button */
        .hamburger-btn {
            display: none;
            position: fixed;
            top: 56px;
            left: 16px;
            z-index: 1100;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 44px;
            height: 44px;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 0;
        }

        .hamburger-btn:hover {
            background: var(--bg-tertiary);
        }

        .hamburger-btn.active {
            left: 296px;
            background: var(--bg-tertiary);
        }

        .hamburger-icon {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            gap: 5px;
        }

        .hamburger-icon span {
            display: block;
            width: 20px;
            height: 2px;
            background: var(--text-primary);
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        .hamburger-btn.active .hamburger-icon span:nth-child(1) {
            transform: rotate(45deg) translate(6px, 6px);
        }

        .hamburger-btn.active .hamburger-icon span:nth-child(2) {
            opacity: 0;
        }

        .hamburger-btn.active .hamburger-icon span:nth-child(3) {
            transform: rotate(-45deg) translate(6px, -6px);
        }

        /* Mobile Sidebar Overlay */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1050;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .sidebar-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Mobile Accordion */
        .mobile-accordion {
            display: none;
            flex-direction: column;
            height: 100%;
            overflow-y: auto;
        }

        .accordion-section {
            border-bottom: 1px solid var(--border-color);
        }

        .accordion-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .accordion-header:hover {
            background: var(--bg-tertiary);
        }

        .accordion-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .accordion-title svg {
            opacity: 0.7;
        }

        .accordion-badge {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 12px;
            min-width: 20px;
            text-align: center;
        }

        .accordion-toggle {
            transition: transform 0.3s ease;
            opacity: 0.5;
        }

        .accordion-toggle.expanded {
            transform: rotate(180deg);
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .accordion-content.expanded {
            max-height: 600px;
            overflow-y: auto;
        }

        .accordion-filters {
            padding: 12px 16px;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--border-color);
        }

        .accordion-list {
            padding: 8px;
        }

        .accordion-empty {
            padding: 32px 16px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .prayer-layout { grid-template-columns: 280px 1fr; }
            .discover-sidebar { display: none; }
        }

        @media (max-width: 768px) {
            body {
                overflow-y: auto;
                overflow-x: hidden;
            }

            .prayer-layout {
                grid-template-columns: 1fr;
                height: auto;
                min-height: calc(100vh - var(--header-height));
                overflow: visible;
                padding-bottom: var(--player-height);
            }

            .main-content {
                height: auto;
                overflow-y: visible;
            }

            /* Show hamburger button on mobile */
            .hamburger-btn {
                display: flex;
                align-items: center;
                justify-content: center;
            }

            /* Show overlay on mobile */
            .sidebar-overlay {
                display: block;
            }

            /* Make sidebar slide in from left */
            .prayer-sidebar {
                position: fixed;
                top: var(--header-height);
                left: -280px;
                bottom: 0;
                width: 280px;
                z-index: 1080;
                transition: left 0.3s ease;
                display: flex;
            }

            .prayer-sidebar.active {
                left: 0;
            }

            /* Hide desktop sidebar elements on mobile */
            .prayer-sidebar-header,
            .prayer-filters,
            .prayer-list {
                display: none !important;
            }

            /* Show mobile accordion on mobile */
            .mobile-accordion {
                display: flex !important;
            }
            .prayer-banner { padding: 20px 16px 16px; gap: 16px; }
            .prayer-banner-art { width: 120px; height: 120px; }
            .prayer-banner-title { font-size: 24px; }
            .prayer-actions {
                padding: 16px;
                flex-wrap: wrap;
                gap: 10px;
            }
            .scripture-section { padding: 0 16px 16px; }
            .prayer-text-section { padding: 0 16px 100px; }
            .player-right { display: none; }
            .prayer-player { grid-template-columns: 1fr 1fr; }

            /* Voice selector responsive */
            .voice-selector {
                margin-left: 0;
                width: 100%;
                order: 3;
            }
            .voice-selector-label {
                display: none;
            }
            .voice-btn {
                flex: 1;
                justify-content: center;
                padding: 8px 12px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-inner">
            <a href="/" class="logo">
                <img src="/images/JubileeLogo.png" alt="Jubilee" class="logo-icon">
                <div class="logo-text">Jubilee<span class="logo-verse">Verse</span><span class="logo-dotcom">.com</span></div>
            </a>
            <a href="/" class="back-link">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                Back to Home
            </a>
        </div>
    </header>

    <!-- Mobile Hamburger Menu Button -->
    <button class="hamburger-btn" id="hamburgerBtn" onclick="toggleMobileSidebar()">
        <div class="hamburger-icon">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </button>

    <!-- Mobile Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeMobileSidebar()"></div>

    <!-- Three-Column Layout -->
    <div class="prayer-layout">
        <!-- Left Sidebar - Prayer List -->
        <aside class="prayer-sidebar">
            <div class="prayer-sidebar-header">
                <div class="prayer-sidebar-title">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="M12 6v6l4 2"/></svg>
                    Prayers
                </div>
            </div>
            <div class="prayer-filters" id="prayerFilters">
                <button class="filter-chip active" onclick="filterPrayers('all')">All</button>
                <button class="filter-chip" onclick="filterPrayers('morning')">Morning</button>
                <button class="filter-chip" onclick="filterPrayers('evening')">Evening</button>
                <button class="filter-chip" onclick="filterPrayers('healing')">Healing</button>
                <button class="filter-chip" onclick="filterPrayers('comfort')">Comfort</button>
                <button class="filter-chip" onclick="filterPrayers('gratitude')">Gratitude</button>
                <button class="filter-chip" onclick="filterPrayers('guidance')">Guidance</button>
                <button class="filter-chip" onclick="filterPrayers('protection')">Protection</button>
                <button class="filter-chip" onclick="filterPrayers('family')">Family</button>
            </div>
            <div class="prayer-list" id="prayerList"></div>

            <!-- Mobile Accordion -->
            <div class="mobile-accordion">
                <!-- Prayers Tab -->
                <div class="accordion-section">
                    <div class="accordion-header" onclick="toggleAccordion('prayers')">
                        <div class="accordion-title">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="M12 6v6l4 2"/></svg>
                            Prayers
                        </div>
                        <span class="accordion-badge" id="prayersBadge">0</span>
                        <svg class="accordion-toggle expanded" id="prayersToggle" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="6 9 12 15 18 9"/>
                        </svg>
                    </div>
                    <div class="accordion-content expanded" id="prayersContent">
                        <div class="accordion-filters" id="mobileFilters">
                            <button class="filter-chip active" onclick="filterMobilePrayers('all')">All</button>
                            <button class="filter-chip" onclick="filterMobilePrayers('morning')">Morning</button>
                            <button class="filter-chip" onclick="filterMobilePrayers('evening')">Evening</button>
                            <button class="filter-chip" onclick="filterMobilePrayers('healing')">Healing</button>
                            <button class="filter-chip" onclick="filterMobilePrayers('comfort')">Comfort</button>
                            <button class="filter-chip" onclick="filterMobilePrayers('gratitude')">Gratitude</button>
                            <button class="filter-chip" onclick="filterMobilePrayers('guidance')">Guidance</button>
                            <button class="filter-chip" onclick="filterMobilePrayers('protection')">Protection</button>
                            <button class="filter-chip" onclick="filterMobilePrayers('family')">Family</button>
                        </div>
                        <div class="accordion-list" id="mobilePrayerList"></div>
                    </div>
                </div>

                <!-- Favorite Prayers Tab -->
                <div class="accordion-section">
                    <div class="accordion-header" onclick="toggleAccordion('favorites')">
                        <div class="accordion-title">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                            Favorite Prayers
                        </div>
                        <span class="accordion-badge" id="favoritesBadge">0</span>
                        <svg class="accordion-toggle" id="favoritesToggle" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="6 9 12 15 18 9"/>
                        </svg>
                    </div>
                    <div class="accordion-content" id="favoritesContent">
                        <div class="accordion-list" id="mobileFavoritesList"></div>
                    </div>
                </div>

                <!-- Most Popular Tab -->
                <div class="accordion-section">
                    <div class="accordion-header" onclick="toggleAccordion('popular')">
                        <div class="accordion-title">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
                            Most Popular
                        </div>
                        <span class="accordion-badge" id="popularBadge">4</span>
                        <svg class="accordion-toggle" id="popularToggle" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="6 9 12 15 18 9"/>
                        </svg>
                    </div>
                    <div class="accordion-content" id="popularContent">
                        <div class="accordion-list" id="mobilePopularList"></div>
                    </div>
                </div>

                <!-- Recommended For You Tab -->
                <div class="accordion-section">
                    <div class="accordion-header" onclick="toggleAccordion('recommended')">
                        <div class="accordion-title">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                            Recommended For You
                        </div>
                        <span class="accordion-badge" id="recommendedBadge">4</span>
                        <svg class="accordion-toggle" id="recommendedToggle" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="6 9 12 15 18 9"/>
                        </svg>
                    </div>
                    <div class="accordion-content" id="recommendedContent">
                        <div class="accordion-list" id="mobileRecommendedList"></div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Center - Prayer Content -->
        <main class="main-content" id="mainContent">
            <div class="empty-state">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="M12 6v6l4 2"/></svg>
                <h3>Select a prayer</h3>
                <p>Choose a prayer from the list to begin</p>
            </div>
        </main>

        <!-- Right Sidebar - Discover -->
        <aside class="discover-sidebar" id="discoverSidebar"></aside>
    </div>

    <!-- Sticky Footer Player -->
    <div class="prayer-player" id="prayerPlayer">
        <!-- Left - Prayer Info -->
        <div class="player-prayer-info">
            <img class="player-prayer-art" id="playerArt" src="https://images.unsplash.com/photo-1507692049790-de58290a4334?w=120&h=120&fit=crop" alt="">
            <div class="player-prayer-text">
                <div class="player-prayer-name" id="playerPrayerName">No prayer selected</div>
                <div class="player-prayer-category" id="playerCategory">-</div>
            </div>
            <button class="player-like-btn" onclick="toggleLike()" title="Like">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            </button>
        </div>

        <!-- Center - Controls -->
        <div class="player-controls">
            <div class="player-buttons">
                <button class="player-btn-secondary" onclick="prevPrayer()" title="Previous">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6V6zm3.5 6l8.5 6V6l-8.5 6z"/></svg>
                </button>
                <button class="player-btn-play" id="playBtn" onclick="togglePlay()" title="Play">
                    <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                </button>
                <button class="player-btn-secondary" onclick="nextPrayer()" title="Next">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 18h2V6h-2v12zM6 18l8.5-6L6 6v12z"/></svg>
                </button>
            </div>
            <div class="player-progress-row">
                <span class="player-time" id="currentTime">0:00</span>
                <div class="progress-bar" id="progressBar" onclick="handleProgressClick(event)">
                    <div class="progress-fill" id="progressFill">
                        <div class="progress-knob"></div>
                    </div>
                </div>
                <span class="player-time" id="totalTime">0:00</span>
            </div>
        </div>

        <!-- Right - Speed & Volume -->
        <div class="player-right">

            const sidebar = document.querySelector('.prayer-sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const hamburgerBtn = document.getElementById('hamburgerBtn');

            if (sidebar.classList.contains('active')) {
                closeMobileSidebar();
            } else {
                openMobileSidebar();
            }
        }

        function openMobileSidebar() {
            const sidebar = document.querySelector('.prayer-sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const hamburgerBtn = document.getElementById('hamburgerBtn');

            sidebar.classList.add('active');
            overlay.classList.add('active');
            hamburgerBtn.classList.add('active');

            // Prevent body scroll on mobile when sidebar is open
            if (window.innerWidth <= 768) {
                document.body.style.overflow = 'hidden';
            }
        }

        function closeMobileSidebar() {
            const sidebar = document.querySelector('.prayer-sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const hamburgerBtn = document.getElementById('hamburgerBtn');

            sidebar.classList.remove('active');
            overlay.classList.remove('active');
            hamburgerBtn.classList.remove('active');

            // Restore body scroll
            if (window.innerWidth <= 768) {
                document.body.style.overflow = 'auto';
            }
        }

        // MOBILE ACCORDION FUNCTIONS
        // ============================================

        let currentMobileFilter = 'all';

        function toggleAccordion(section) {
            const content = document.getElementById(`${section}Content`);
            const toggle = document.getElementById(`${section}Toggle`);
            const isExpanded = content.classList.contains('expanded');

            // Close all sections first
            document.querySelectorAll('.accordion-content.expanded').forEach(el => {
                el.classList.remove('expanded');
            });
            document.querySelectorAll('.accordion-toggle.expanded').forEach(el => {
                el.classList.remove('expanded');
            });

            // If the clicked section wasn't open, open it
            if (!isExpanded) {
                content.classList.add('expanded');
                toggle.classList.add('expanded');
            }
        }

        function renderMobilePrayerList() {
            const container = document.getElementById('mobilePrayerList');
            if (!container) return;

            const filtered = currentMobileFilter === 'all'
                ? prayers
                : prayers.filter(p => p.category === currentMobileFilter);

            if (filtered.length === 0) {
                container.innerHTML = '<div class="accordion-empty">No prayers found</div>';
                return;
            }

            const favorites = getFavorites();

            container.innerHTML = filtered.map((prayer, idx) => {
                const realIdx = prayers.indexOf(prayer);
                const isFav = favorites.includes(realIdx);

                return `
                    <div class="prayer-item ${realIdx === currentPrayerIdx ? 'active' : ''}" onclick="selectPrayer(${realIdx})" id="mobilePrayerItem${realIdx}">
                        <button class="prayer-item-fav ${isFav ? 'favorited' : ''}" onclick="toggleFavorite(${realIdx}, event)" title="${isFav ? 'Remove from favorites' : 'Add to favorites'}">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="${isFav ? 'var(--accent-gold)' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                        </button>
                        <img class="prayer-item-art" src="${prayer.image}" alt="${prayer.name}" loading="lazy">
                        <div class="prayer-item-info">
                            <div class="prayer-item-name">${prayer.name}</div>
                            <div class="prayer-item-category">
                                <span class="prayer-item-badge badge-${prayer.category}">${prayer.category.charAt(0).toUpperCase() + prayer.category.slice(1)}</span>
                                <span class="prayer-item-duration">${prayer.duration}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            const prayersBadge = document.getElementById('prayersBadge');
            if (prayersBadge) {
                prayersBadge.textContent = filtered.length;
            }
        }

        function renderMobileFavorites() {
            const container = document.getElementById('mobileFavoritesList');
            if (!container) return;

            const favorites = getFavorites();
            const favs = favorites.map(idx => {
                return { idx, prayer: prayers[idx] };
            }).filter(f => f.prayer);

            if (favs.length === 0) {
                container.innerHTML = '<div class="accordion-empty">No favorite prayers yet<br><span style="font-size:11px;margin-top:4px;display:block;">Tap the heart icon to save prayers</span></div>';

                container.innerHTML = favs.map(({ idx, prayer }) => {
                    return `
                        <div class="prayer-item ${idx === currentPrayerIdx ? 'active' : ''}" onclick="selectPrayer(${idx})">

            if (favoritesBadge) {
                favoritesBadge.textContent = favs.length;
            }

            if (favs.includes(idx)) {

                favs.push(idx);

            saveFavorites(favs);
            renderPrayerList();

        // ============================================
        // TEXT-TO-SPEECH ENGINE
        // ============================================

        function estimateDuration(lines) {
            const totalChars = lines.join(' ').length;
            return (totalChars / 15) / speechRate;
        }

        function getSelectedVoice() {
            const voices = window.speechSynthesis.getVoices();
            const enVoices = voices.filter(v => v.lang.startsWith('en'));

            if (selectedVoiceGender === 'female') {
                return enVoices.find(v => /Zira/i.test(v.name)) ||
                       enVoices.find(v => /Samantha/i.test(v.name)) ||
                       enVoices.find(v => /Karen/i.test(v.name)) ||
                       enVoices.find(v => /Female/i.test(v.name) && /Natural/i.test(v.name)) ||
                       enVoices.find(v => /Female/i.test(v.name)) ||
                       enVoices.find(v => /Google US English/i.test(v.name)) ||
                       enVoices.find(v => /Natural/i.test(v.name)) ||
                       enVoices.find(v => v.lang === 'en-US') || null;
            } else {
                return enVoices.find(v => /David/i.test(v.name)) ||
                       enVoices.find(v => /Mark/i.test(v.name)) ||
                       enVoices.find(v => /Daniel/i.test(v.name)) ||
                       enVoices.find(v => /James/i.test(v.name)) ||
                       enVoices.find(v => /Male/i.test(v.name) && /Natural/i.test(v.name)) ||
                       enVoices.find(v => /Male/i.test(v.name)) ||
                       enVoices.find(v => /Google UK English Male/i.test(v.name)) ||
                       enVoices.find(v => v.lang === 'en-GB') || null;
            }
        }

        function speakLines(prayer, fromLine, isResume, charOffset = 0) {
            // Cancel any existing speech
            window.speechSynthesis.cancel();
            clearInterval(progressInterval);

            const linesToSpeak = prayer.lines.slice(fromLine);
            if (linesToSpeak.length === 0) return;
            let text = linesToSpeak.join('\n');
            if (charOffset > 0) text = text.substring(charOffset);

            speechUtterance = new SpeechSynthesisUtterance(text);
            speechUtterance.rate = speechRate;
            speechUtterance.pitch = 1;
            speechUtterance.volume = parseFloat(document.getElementById('volumeFill').style.width || '70') / 100;

            const voice = getSelectedVoice();
            if (voice) speechUtterance.voice = voice;

            // Compute total duration for full prayer and remaining duration
            totalDuration = estimateDuration(prayer.lines);
            const remainingDuration = estimateDuration(linesToSpeak);

            // Track absolute character position for accurate progress
            totalPrayerChars = prayer.lines.join('\n').length;
            let baseChars = 0;
            for (let i = 0; i < fromLine; i++) baseChars += prayer.lines[i].length + 1;
            charBaseOffset = baseChars + charOffset;
            spokenAbsCharIdx = charBaseOffset;

            if (isResume) {
                // Keep elapsed time from before pause, start tracking the remaining portion
                speechStartTime = Date.now();
                speechDuration = remainingDuration;
            } else {
                elapsedBeforePause = 0;
                speechStartTime = Date.now();
                speechDuration = remainingDuration;
            }

            currentLineIdx = -1;
            highlightLine(fromLine);

            // Build line break map for the (potentially sliced) text
            let charCount = 0;
            const lineBreaks = [];
            linesToSpeak.forEach((line, i) => {
                const effectiveLen = (i === 0 && charOffset > 0) ? (line.length - charOffset) : line.length;
                const lineCharBase = (i === 0 && charOffset > 0) ? charOffset : 0;
                lineBreaks.push({ start: charCount, end: charCount + effectiveLen, lineIdx: fromLine + i, lineCharBase });
                charCount += effectiveLen + 1;
            });

            speechUtterance.onboundary = (e) => {
                if (e.name === 'word') {
                    const charIdx = e.charIndex;
                    spokenAbsCharIdx = charBaseOffset + charIdx;
                    for (let i = lineBreaks.length - 1; i >= 0; i--) {
                        if (charIdx >= lineBreaks[i].start) {
                            highlightLine(lineBreaks[i].lineIdx);
                            pausedAtLineIdx = lineBreaks[i].lineIdx;
                            pausedCharWithinLine = lineBreaks[i].lineCharBase + (charIdx - lineBreaks[i].start);
                            break;
                        }
                    }
                }
            };

            speechUtterance.onend = () => {
                // Only mark as finished if we weren't manually stopped
                if (isPlaying) {
                    isPlaying = false;
                    isPaused = false;
                    elapsedBeforePause = 0;
                    pausedAtLineIdx = 0;
                    pausedCharWithinLine = 0;
                    updatePlayIcon();
                    clearHighlights();
                    clearInterval(progressInterval);
                    document.getElementById('progressFill').style.width = '100%';
                    const totalTime = formatTime(totalDuration);
                    document.getElementById('currentTime').textContent = totalTime;
                    document.getElementById('totalTime').textContent = totalTime;
                }
            };

            window.speechSynthesis.speak(speechUtterance);

            // Progress tracking
            progressInterval = setInterval(updateProgress, 200);
        }

        function startPrayerPlayback(prayerIdx) {
            stopPrayerPlayback();
            const prayer = prayers[prayerIdx];
            speakLines(prayer, 0, false);
        }

        function stopPrayerPlayback() {
            window.speechSynthesis.cancel();
            speechUtterance = null;
            isPaused = false;
            pausedAtLineIdx = 0;
            pausedCharWithinLine = 0;
            elapsedBeforePause = 0;
            spokenAbsCharIdx = 0;
            charBaseOffset = 0;
            clearInterval(progressInterval);
            currentLineIdx = -1;
            document.getElementById('progressFill').style.width = '0%';
            document.getElementById('currentTime').textContent = '0:00';
        }

        function pausePrayerPlayback() {
            // Save how far we got
            elapsedBeforePause = elapsedBeforePause + (Date.now() - speechStartTime) / 1000;
            window.speechSynthesis.cancel();
            isPaused = true;
            clearInterval(progressInterval);
        }

        function resumePrayerPlayback() {
            if (currentPrayerIdx < 0) return;
            const prayer = prayers[currentPrayerIdx];
            isPaused = false;
            // Resume from the exact word where we paused
            speakLines(prayer, pausedAtLineIdx, true, pausedCharWithinLine);
        }

        function updateProgress() {
            if (!isPlaying || totalPrayerChars <= 0) return;
            const pct = Math.min(100, (spokenAbsCharIdx / totalPrayerChars) * 100);
            document.getElementById('progressFill').style.width = pct + '%';
            const estimatedTime = (pct / 100) * totalDuration;
            document.getElementById('currentTime').textContent = formatTime(estimatedTime);
            document.getElementById('totalTime').textContent = formatTime(totalDuration);
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return m + ':' + (s < 10 ? '0' : '') + s;
        }

        function highlightLine(idx) {
            if (idx === currentLineIdx) return;
            currentLineIdx = idx;
            document.querySelectorAll('.prayer-line').forEach((el, i) => {
                el.classList.toggle('speaking', i === idx);
            });
            const speakingEl = document.querySelector('.prayer-line.speaking');
            if (speakingEl) {
                speakingEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function clearHighlights() {
            document.querySelectorAll('.prayer-line').forEach(el => el.classList.remove('speaking'));
        }

            const params = new URLSearchParams(window.location.search);
            const prayerParam = params.get('prayer');
            if (prayerParam !== null) {
                const idx = parseInt(prayerParam);
                if (idx >= 0 && idx < prayers.length) {
                    selectPrayer(idx);
                } else {
                    selectPrayer(0);
                }
            } else {
                selectPrayer(0);
            }

            // Initialize favorites count badge
            updateFavoritesCount();
        });

        function getCategoryLabel(cat) {
            const labels = { morning: 'Morning', evening: 'Evening', healing: 'Healing', comfort: 'Comfort', gratitude: 'Gratitude', protection: 'Protection', guidance: 'Guidance', family: 'Family' };
