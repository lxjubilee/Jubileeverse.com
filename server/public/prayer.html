        function renderPrayerList() {
            const list = document.getElementById('prayerList');
            const filtered = currentFilter === 'all' ? prayers : prayers.filter(p => p.category === currentFilter);

            const favs = getFavorites();
            list.innerHTML = filtered.map((prayer, i) => {
                const realIdx = prayers.indexOf(prayer);
                const isFav = favs.includes(realIdx);
                return `
                    <div class="prayer-item ${realIdx === currentPrayerIdx ? 'active' : ''}" onclick="selectPrayer(${realIdx})" id="prayerItem${realIdx}">
                        <button class="prayer-item-fav ${isFav ? 'favorited' : ''}" onclick="toggleFavorite(${realIdx}, event)" title="${isFav ? 'Remove from favorites' : 'Add to favorites'}">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="${isFav ? 'var(--accent-gold)' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                        </button>
                        <img class="prayer-item-art" src="${prayer.image}" alt="${prayer.name}" loading="lazy">
                        <div class="prayer-item-info">
                            <div class="prayer-item-name">${prayer.name}</div>
                            <div class="prayer-item-meta">${getCategoryBadge(prayer.category)} ${prayer.duration}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterPrayers(cat) {
            currentFilter = cat;
            document.querySelectorAll('.filter-chip').forEach(chip => {
                const chipText = chip.textContent.trim().toLowerCase();
                chip.classList.toggle('active', chipText === cat || (cat === 'all' && chipText === 'all'));
            });
            renderPrayerList();
        }

        function renderDiscoverSidebar() {
            const sidebar = document.getElementById('discoverSidebar');
            const popular = [17, 0, 4, 6]; // Lord's Prayer, Morning Offering, Healing, Comfort
            const recommended = [11, 19, 8, 14]; // Armor of God, St. Francis, Thanksgiving, My Family

            sidebar.innerHTML = `
                <div class="library-section">
                    <div class="library-header" onclick="toggleLibrary()">
                        <div class="library-title">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                            </svg>
                            Your Library
                        </div>
                        <svg class="library-toggle expanded" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="6 9 12 15 18 9"/>
                        </svg>
                    </div>
                    <div class="library-content expanded" id="favoritePrayersContent">
                        <div class="library-empty">
                            <div class="library-empty-icon">♡</div>
                            <div>No favorite prayers yet</div>
                            <div style="font-size: 11px; margin-top: 4px;">Click the heart icon to save prayers</div>
                        </div>
                    </div>
                </div>
                <div class="discover-divider"></div>
                <div class="discover-title">Most Popular</div>
                ${popular.map(idx => renderDiscoverCard(idx)).join('')}
                <div class="discover-divider"></div>
                <div class="discover-section-title">Recommended For You</div>
                ${recommended.map(idx => renderDiscoverCard(idx)).join('')}
            `;
        }

        function renderDiscoverCard(idx) {
            const prayer = prayers[idx];
            return `
                <div class="discover-card" onclick="selectPrayer(${idx})">
                    <img class="discover-card-art" src="${prayer.image}" alt="${prayer.name}" loading="lazy">
                    <div class="discover-card-info">
                        <div class="discover-card-name">${prayer.name}</div>
                        <div class="discover-card-cat">${getCategoryLabel(prayer.category)}</div>
                        <div class="discover-card-duration">${prayer.duration}</div>
                    </div>
                </div>
            `;
        }

        function selectPrayer(idx) {
            // Close mobile sidebar when prayer is selected
            if (window.innerWidth <= 768) {
                closeMobileSidebar();
            }

            // If a different prayer is playing or paused, stop it
            if (isPlaying || isPaused) {
                stopPrayerPlayback();
                isPlaying = false;
                isPaused = false;
                updatePlayIcon();
            }

            currentPrayerIdx = idx;
            const prayer = prayers[idx];
            const catClass = 'cat-' + prayer.category;

            // Update sidebar active state
            document.querySelectorAll('.prayer-item').forEach(el => el.classList.remove('active'));
            const activeItem = document.getElementById('prayerItem' + idx);
            if (activeItem) activeItem.classList.add('active');

            // Render center content
            const main = document.getElementById('mainContent');
            main.innerHTML = `
                <div class="prayer-banner ${catClass}">
                    <img class="prayer-banner-art" src="${prayer.image}" alt="${prayer.name}">
                    <div class="prayer-banner-info">
                        <div class="prayer-banner-label">
                            ${getCategoryBadge(prayer.category)} Prayer
                        </div>
                        <h1 class="prayer-banner-title">${prayer.name}</h1>
                        <div class="prayer-banner-desc">${prayer.description}</div>
                        <div class="prayer-banner-meta">
                            <span>${prayer.author}</span>
                            <span class="prayer-banner-dot"></span>
                            <span>${prayer.duration} read</span>
                            <span class="prayer-banner-dot"></span>
                            <span>${prayer.lines.length} lines</span>
                        </div>
                    </div>
                </div>

                <div class="prayer-actions">
                    <button class="btn-play-large" id="bannerPlayBtn" onclick="toggleBannerPlay(${idx})" title="Play">
                        <svg id="bannerPlayIcon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    </button>
                    <div class="duration-badge">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                        ${prayer.duration}
                    </div>
                    <button class="btn-follow" onclick="toggleFollow(this)">Save</button>
                    <div class="voice-selector">
                        <span class="voice-selector-label">Choose Prayer Voice</span>
                        <button class="voice-btn ${selectedVoiceGender === 'female' ? 'active' : ''}" onclick="setVoiceGender('female')" title="Female voice">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/><path d="M12 13v2"/></svg>
                            Female
                        </button>
                        <button class="voice-btn ${selectedVoiceGender === 'male' ? 'active' : ''}" onclick="setVoiceGender('male')" title="Male voice">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>
                            Male
                        </button>
                    </div>
                </div>

                <div class="scripture-section">
                    <div class="scripture-card">
                        <div class="scripture-label">Scripture</div>
                        <div class="scripture-text">${prayer.scripture.text}</div>
                        <div class="scripture-ref">\u2014 ${prayer.scripture.ref}</div>
                    </div>
                </div>

                <div class="prayer-text-section">
                    <div class="prayer-text-title">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15z"/></svg>
                        Prayer Text
                    </div>
                    <div class="prayer-text-body" id="prayerTextBody">
                        ${prayer.lines.map((line, i) => `<div class="prayer-line" data-line="${i}">${line}</div>`).join('')}
                    </div>
                </div>
            `;
            main.scrollTop = 0;

            // Update footer player info
            document.getElementById('playerArt').src = prayer.image;
            document.getElementById('playerPrayerName').textContent = prayer.name;
            document.getElementById('playerCategory').textContent = getCategoryLabel(prayer.category) + ' Prayer';

            // Update player like button state
            updatePlayerLikeButton();
        }

        // ============================================
        // PLAYBACK CONTROLS
        // ============================================

        function playPrayer(idx) {
            currentPrayerIdx = idx;
            isPlaying = true;
            const prayer = prayers[idx];

            // Update player info
            document.getElementById('playerArt').src = prayer.image;
            document.getElementById('playerPrayerName').textContent = prayer.name;
            document.getElementById('playerCategory').textContent = getCategoryLabel(prayer.category) + ' Prayer';

            updatePlayIcon();
            renderPrayerList();

            // Start TTS
            startPrayerPlayback(idx);
        }

        function togglePlay() {
            if (currentPrayerIdx === -1) {
                if (prayers.length > 0) playPrayer(0);
                return;
            }

            if (isPlaying) {
                isPlaying = false;
                pausePrayerPlayback();
            } else {
                if (isPaused) {
                    isPlaying = true;
                    resumePrayerPlayback();
                } else {
                    // Start fresh
                    playPrayer(currentPrayerIdx);
                    return;
                }
            }
            updatePlayIcon();
        }

        function prevPrayer() {
            if (currentPrayerIdx <= 0) return;
            const newIdx = currentPrayerIdx - 1;
            selectPrayer(newIdx);
            playPrayer(newIdx);
        }

        function nextPrayer() {
            if (currentPrayerIdx >= prayers.length - 1) return;
            const newIdx = currentPrayerIdx + 1;
            selectPrayer(newIdx);
            playPrayer(newIdx);
        }

        function updatePlayIcon() {
            const playSvg = '<polygon points="5 3 19 12 5 21 5 3"/>';
            const pauseSvg = '<rect x="6" y="4" width="4" height="16" fill="currentColor"/><rect x="14" y="4" width="4" height="16" fill="currentColor"/>';

            // Footer player icon
            const icon = document.getElementById('playIcon');
            icon.innerHTML = isPlaying ? pauseSvg : playSvg;

            // Banner large play button icon
            const bannerIcon = document.getElementById('bannerPlayIcon');
            if (bannerIcon) {
                bannerIcon.innerHTML = isPlaying ? pauseSvg : playSvg;
            }
        }

        function toggleBannerPlay(idx) {
            if (isPlaying && currentPrayerIdx === idx) {
                // Currently playing this prayer — pause it
                togglePlay();
            } else if (isPaused && currentPrayerIdx === idx) {
                // Paused on this prayer — resume from where we left off
                togglePlay();
            } else {
                // Not playing or different prayer — start playing
                playPrayer(idx);
            }
        }

        function setVoiceGender(gender) {
            selectedVoiceGender = gender;
            // Update button states
            document.querySelectorAll('.voice-btn').forEach(btn => {
                const btnGender = btn.getAttribute('title').toLowerCase().includes('female') ? 'female' : 'male';
                btn.classList.toggle('active', btnGender === gender);
            });
            // If currently playing, restart with the new voice
            if (isPlaying && currentPrayerIdx >= 0) {
                playPrayer(currentPrayerIdx);
            }
        }

        function toggleFollow(btn) {
            btn.classList.toggle('following');
            btn.textContent = btn.classList.contains('following') ? 'Saved' : 'Save';
        }

        function toggleLike() {
            // Toggle favorite for the current prayer
            toggleFavorite(currentPrayerIdx, null);

            // Update player button appearance
            updatePlayerLikeButton();
        }

        function updatePlayerLikeButton() {
            const btn = document.querySelector('.player-like-btn');
            if (!btn) return;

            const svg = btn.querySelector('svg');
            const favs = getFavorites();
            const isLiked = favs.includes(currentPrayerIdx);

            svg.setAttribute('fill', isLiked ? 'var(--accent-gold)' : 'none');
            svg.setAttribute('stroke', isLiked ? 'var(--accent-gold)' : 'currentColor');
            btn.style.color = isLiked ? 'var(--accent-gold)' : '';
            btn.title = isLiked ? 'Remove from favorites' : 'Add to favorites';
        }

        // Speed control
        function cycleSpeed() {
            currentSpeedIdx = (currentSpeedIdx + 1) % speedOptions.length;
            speechRate = speedOptions[currentSpeedIdx];
            document.getElementById('speedBtn').textContent = speechRate + 'x';
            // If currently playing, restart with new speed
            if (isPlaying && currentPrayerIdx >= 0) {
                playPrayer(currentPrayerIdx);
            }
        }

        // Progress bar click — seek to the corresponding line
        function handleProgressClick(e) {
            if (currentPrayerIdx < 0) return;
            const prayer = prayers[currentPrayerIdx];
            const bar = document.getElementById('progressBar');
            const rect = bar.getBoundingClientRect();
            const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));

            // Map click percentage to a line index
            const targetLine = Math.floor(pct * prayer.lines.length);
            const clampedLine = Math.min(targetLine, prayer.lines.length - 1);

            // Compute elapsed time up to that line for progress display
            const linesBeforeTarget = prayer.lines.slice(0, clampedLine);
            elapsedBeforePause = estimateDuration(linesBeforeTarget);
            pausedAtLineIdx = clampedLine;
            pausedCharWithinLine = 0;

            if (isPlaying) {
                // Re-speak from the target line
                speakLines(prayer, clampedLine, true);
            } else {
                // If paused or stopped, set position and start playing
                isPlaying = true;
                isPaused = false;
                speakLines(prayer, clampedLine, true);
                updatePlayIcon();
            }
        }

        // Add drag support on the progress bar
        (function() {
            const bar = document.getElementById('progressBar');
            let dragging = false;
            bar.addEventListener('mousedown', (e) => { dragging = true; handleProgressClick(e); });
            document.addEventListener('mousemove', (e) => { if (dragging) handleProgressClick(e); });
            document.addEventListener('mouseup', () => { dragging = false; });
        })();

        // Volume controls
        function handleVolumeClick(e) {
            const bar = document.getElementById('volumeBar');
            const rect = bar.getBoundingClientRect();
            const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
            document.getElementById('volumeFill').style.width = (pct * 100) + '%';
            updateVolumeIcon();
            // Apply volume immediately if speech is active
            if (isPlaying && speechUtterance) {
                // Cancel and re-speak from current position to apply new volume
                elapsedBeforePause = elapsedBeforePause + (Date.now() - speechStartTime) / 1000;
                const prayer = prayers[currentPrayerIdx];
                speakLines(prayer, pausedAtLineIdx, true, pausedCharWithinLine);
            }
        }

        // Add drag support on the volume bar
        (function() {
            const bar = document.getElementById('volumeBar');
            let dragging = false;
            bar.addEventListener('mousedown', (e) => { dragging = true; handleVolumeClick(e); });
            document.addEventListener('mousemove', (e) => { if (dragging) handleVolumeClick(e); });
            document.addEventListener('mouseup', () => { dragging = false; });
        })();

        const volumeSvgHigh = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>';
        const volumeSvgLow = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>';
        const volumeSvgMute = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>';

        function updateVolumeIcon() {
            const fill = document.getElementById('volumeFill');
            const vol = parseFloat(fill.style.width) || 0;
            const btn = document.getElementById('volumeBtn');
            const svg = btn.querySelector('svg');
            if (vol <= 0) {
                svg.innerHTML = volumeSvgMute;
            } else if (vol < 40) {
                svg.innerHTML = volumeSvgLow;
            } else {
                svg.innerHTML = volumeSvgHigh;
            }
        }

        let preMuteVolume = 70;
        function toggleMute() {
            const fill = document.getElementById('volumeFill');
            const currentWidth = parseFloat(fill.style.width) || 0;
            if (currentWidth > 0) {
                preMuteVolume = currentWidth;
                fill.style.width = '0%';
            } else {
                fill.style.width = preMuteVolume + '%';
            }
            updateVolumeIcon();
            // Apply mute/unmute immediately
            if (isPlaying && speechUtterance) {
                elapsedBeforePause = elapsedBeforePause + (Date.now() - speechStartTime) / 1000;
                const prayer = prayers[currentPrayerIdx];
                speakLines(prayer, pausedAtLineIdx, true, pausedCharWithinLine);
            }
        }
    </script>
    <script src="/js/site-translate.js"></script>
</body>
</html>
