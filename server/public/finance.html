    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #1b1b1b;
            --bg-secondary: #242424;
            --bg-tertiary: #2d2d2d;
            --bg-card: #2d2d2d;
            --text-primary: #ffffff;
            --text-secondary: #c4c4c4;
            --text-muted: #8a8a8a;
            --accent-gold: #E6AC00;
            --accent-gold-hover: #F5C518;
            --accent-blue: #0078d4;
            --accent-green: #0a8043;
            --accent-red: #d93025;
            --border-color: rgba(255, 255, 255, 0.1);
            --header-height: 48px;
            --card-radius: 8px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
        }

        /* Header */
        .header {
            height: var(--header-height);
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 10px;
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--text-primary);
        }
        .logo-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
        }
        .logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #ffffff;
        }
        .logo-text span { color: var(--accent-gold); font-weight: 400; }
        .logo-text .logo-verse { color: var(--accent-gold); }
        .logo-text .logo-dotcom { color: #ffffff; }
        .back-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--accent-gold); }
        .back-link svg { width: 16px; height: 16px; }

        /* Finance page layout */
        .finance-page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 16px;
        }

        /* Loading */
        .finance-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            gap: 16px;
        }
        .finance-loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent-gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Market tabs */
        .market-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            overflow-x: auto;
            scrollbar-width: none;
            padding-bottom: 4px;
        }
        .market-tabs::-webkit-scrollbar { display: none; }
        .market-tab {
            flex-shrink: 0;
            padding: 8px 20px;
            border-radius: 24px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .market-tab:hover {
            border-color: var(--accent-gold);
            color: var(--text-primary);
        }
        .market-tab.active {
            background: var(--accent-gold);
            color: #000;
            border-color: var(--accent-gold);
            font-weight: 600;
        }

        /* Market indices banner */
        .indices-banner {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 24px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.2) transparent;
        }
        .indices-banner::-webkit-scrollbar { height: 4px; }
        .indices-banner::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }
        .index-card {
            flex: 0 0 200px;
            background: var(--bg-card);
            border-radius: var(--card-radius);
            border: 1px solid var(--border-color);
            padding: 16px;
            transition: border-color 0.2s;
        }
        .index-card:hover { border-color: rgba(255,255,255,0.2); }
        .index-card-name {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        .index-card-value {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .index-card-change {
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .index-card-change.positive { color: var(--accent-green); }
        .index-card-change.negative { color: var(--accent-red); }
        .index-card-change svg { width: 14px; height: 14px; }

        /* Section title */
        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-title-icon { font-size: 20px; }

        /* Watchlist / Stock table */
        .stock-table {
            background: var(--bg-card);
            border-radius: var(--card-radius);
            border: 1px solid var(--border-color);
            overflow: hidden;
            margin-bottom: 24px;
        }
        .stock-table-header {
            display: grid;
            grid-template-columns: 2fr 1fr 100px 1fr;
            padding: 12px 16px;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border-color);
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
        }
        .stock-table-header span:nth-child(2),
        .stock-table-header span:nth-child(3),
        .stock-table-header span:nth-child(4) { text-align: right; }
        .stock-row {
            display: grid;
            grid-template-columns: 2fr 1fr 100px 1fr;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            align-items: center;
            transition: background 0.15s;
            cursor: pointer;
        }
        .stock-row:last-child { border-bottom: none; }
        .stock-row:hover { background: rgba(255,255,255,0.03); }
        .stock-info {
            display: flex;
            flex-direction: column;
        }
        .stock-name {
            font-size: 14px;
            font-weight: 600;
        }
        .stock-ticker {
            font-size: 11px;
            color: var(--text-muted);
        }
        .stock-chart {
            display: flex;
            justify-content: flex-end;
        }
        .stock-price {
            text-align: right;
            font-size: 14px;
            font-weight: 600;
        }
        .stock-change {
            text-align: right;
            font-size: 13px;
            font-weight: 600;
        }
        .stock-change.positive { color: var(--accent-green); }
        .stock-change.negative { color: var(--accent-red); }

        /* News cards grid */
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }
        .news-card {
            background: var(--bg-card);
            border-radius: var(--card-radius);
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: all 0.2s;
            cursor: pointer;
        }
        .news-card:hover {
            border-color: var(--accent-gold);
            transform: translateY(-2px);
        }
        .news-card-image {
            width: 100%;
            height: 140px;
            object-fit: cover;
            background: var(--bg-tertiary);
        }
        .news-card-body {
            padding: 14px;
        }
        .news-card-category {
            font-size: 10px;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .news-card-title {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .news-card-meta {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* Quick stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: var(--bg-card);
            border-radius: var(--card-radius);
            border: 1px solid var(--border-color);
            padding: 16px;
            text-align: center;
        }
        .stat-card-value {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .stat-card-label {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .stock-table-header { grid-template-columns: 2fr 1fr 1fr; }
            .stock-table-header span:nth-child(3) { display: none; }
            .stock-row { grid-template-columns: 2fr 1fr 1fr; }
            .stock-chart { display: none; }
            .index-card { flex: 0 0 160px; padding: 12px; }
            .index-card-value { font-size: 18px; }
        }
        @media (max-width: 480px) {
            .finance-page { padding: 16px 10px; }
            .news-grid { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>

        let currentCountry = 'US';

        async function getCountry() {
            try {
                const res = await fetch('https://ipapi.co/json/', { signal: AbortSignal.timeout(5000) });
                if (res.ok) { const g = await res.json(); return g.country_code || 'US'; }
            } catch (e) {}
            try {
                const res = await fetch('https://ip-api.com/json/?fields=countryCode', { signal: AbortSignal.timeout(5000) });
                if (res.ok) { const g = await res.json(); return g.countryCode || 'US'; }
            } catch (e) {}
            return 'US';
        }

        function generateMiniChart(positive) {
            const points = [];
            let y = 12;
            for (let x = 0; x <= 50; x += 5) {
                y += (Math.random() - (positive ? 0.35 : 0.65)) * 4;
                y = Math.max(2, Math.min(22, y));
                points.push(`${x},${y}`);
            }
            const color = positive ? '#0a8043' : '#d93025';
            return `<svg width="50" height="24" viewBox="0 0 50 24"><polyline points="${points.join(' ')}" fill="none" stroke="${color}" stroke-width="1.5"/></svg>`;
        }

        function renderPage() {
            const page = document.getElementById('financePage');
            const data = financeDataSets[currentCountry] || financeDataSets.DEFAULT;

            // Tabs
            const tabsHTML = data.tabs.map(t =>
                `<button class="market-tab${t.id === currentTab ? ' active' : ''}" onclick="switchTab('${t.id}')">${t.label}</button>`
            ).join('');

            // Indices banner
            const indicesHTML = data.indices.map(idx => `
                <div class="index-card">
                    <div class="index-card-name">${idx.name} (${idx.ticker})</div>
                    <div class="index-card-value">${idx.value}</div>
                    <div class="index-card-change ${idx.positive ? 'positive' : 'negative'}">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            ${idx.positive
                                ? '<path d="M7 14l5-5 5 5z"/>'
                                : '<path d="M7 10l5 5 5-5z"/>'}
                        </svg>
                        ${idx.change} (${idx.changeVal})
                    </div>
                </div>
            `).join('');

            // Stock table based on current tab
            let stocksData = [];
            let tableTitle = 'Watchlist';
            if (currentTab === 'indices') {
                stocksData = data.stocks;
                tableTitle = 'Top Stocks';
            } else if (currentTab === 'stocks') {
                stocksData = data.stocks;
                tableTitle = 'Popular Stocks';
            } else if (currentTab === 'crypto') {
                stocksData = data.crypto || [];
                tableTitle = 'Cryptocurrencies';
            } else if (currentTab === 'mutualfunds') {
                stocksData = data.mutualfunds || [];
                tableTitle = 'Mutual Funds';
            }

            const stockRowsHTML = stocksData.map(s => `
                <div class="stock-row">
                    <div class="stock-info">
                        <span class="stock-name">${s.name}</span>
                        <span class="stock-ticker">${s.ticker}</span>
                    </div>
                    <div class="stock-price">${data.currency === 'USD' ? '$' : (data.currency === 'GBP' ? '£' : '₹')}${s.price}</div>
                    <div class="stock-chart">${generateMiniChart(s.positive)}</div>
                    <div class="stock-change ${s.positive ? 'positive' : 'negative'}">${s.change}</div>
                </div>
            `).join('');

            // News
            const newsHTML = data.news.map(n => `
                <div class="news-card">
                    <img class="news-card-image" src="${n.image}" alt="${n.title}" loading="lazy">
                    <div class="news-card-body">
                        <div class="news-card-category">${n.category}</div>
                        <div class="news-card-title">${n.title}</div>
                        <div class="news-card-meta">${n.time}</div>
                    </div>
                </div>
            `).join('');

            // Stats
            const marketStatus = new Date().getHours() >= 9 && new Date().getHours() < 16 ? 'Open' : 'Closed';
            const statsHTML = `
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-card-value" style="color:${marketStatus === 'Open' ? 'var(--accent-green)' : 'var(--accent-red)'}">${marketStatus}</div>
                        <div class="stat-card-label">Market Status</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-value">${data.indices.length}</div>
                        <div class="stat-card-label">Indices Tracked</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-value">${stocksData.length}</div>
                        <div class="stat-card-label">Securities</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-value">${data.region}</div>
                        <div class="stat-card-label">Region</div>
                    </div>
                </div>
            `;

            page.innerHTML = `
                <div class="market-tabs">${tabsHTML}</div>

                <div class="section-title"><span class="section-title-icon">📈</span> Market Overview</div>
                <div class="indices-banner">${indicesHTML}</div>

                ${statsHTML}

                <div class="section-title"><span class="section-title-icon">📋</span> ${tableTitle}</div>
                <div class="stock-table">
                    <div class="stock-table-header">
                        <span>Name</span>
                        <span>Price</span>
                        <span>Chart</span>
                        <span>Change</span>
                    </div>
                    ${stockRowsHTML}
                </div>

                <div class="section-title"><span class="section-title-icon">📰</span> Financial News</div>
                <div class="news-grid">${newsHTML}</div>
            `;
        }

        function switchTab(id) {
            currentTab = id;
            renderPage();
        }

        async function init() {
            currentCountry = await getCountry();
            if (!financeDataSets[currentCountry]) currentCountry = 'US';
            currentTab = financeDataSets[currentCountry].tabs[0].id;
            renderPage();
        }

        init();
    </script>
    <script src="/js/site-translate.js"></script>
</body>
</html>
